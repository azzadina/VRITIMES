data actually says.\n\nMost PR habits are inherited, not tested. Here are the four we see most often, checked against current sources:\n\n1. \"Press releases are dead.\" Cision's 2025 State of the Media found 72% of journalists call them the most useful resource PR teams provide.\n2. \"A longer pitch looks more serious.\" Muck Rack (2025): 69% of journalists prefer pitches under 200 words.\n3. \"Follow up daily to be sure.\" Same study: 50% say one follow-up is ideal, and 51% want it 3–7 days later.\n4. \"Releases are an SEO shortcut.\" Google's spam policies list optimized anchor text in distributed press releases as link spam.\n\nWhich myth was hardest to unlearn on your team?\n\nMore on VRITIMES: https://www.vritimes.com/ph?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_ph_202612&utm_content=ph_20261202_viral\n\n#VRITIMES #PRlife #MarketingPH #PressReleasePH #MSMEPH\n\nSources:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n• Google Search Central, Spam policies — https://developers.google.com/search/docs/essentials/spam-policies\n"}, "sources": [{"name": "Cision", "title": "2025 State of the Media Report (press release, 7 May 2025)", "year": 2025, "url": "https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/"}, {"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}, {"name": "Google Search Central", "title": "Spam policies for Google web search (link spam)", "year": 2025, "url": "https://developers.google.com/search/docs/essentials/spam-policies"}], "pdf": null, "mp4": "PH/PH_2026-12-02_Wed_VIRAL_reels_press-release-myth-vs-fact/reel_draft.mp4", "script": "PH/PH_2026-12-02_Wed_VIRAL_reels_press-release-myth-vs-fact/reel_script.md", "price": null}, {"id": "ph_20261204_edu", "date": "2026-12-04", "day": "Fri", "pillar": "EDU", "format": "carousel", "title": "How to write spokesperson quotes journalists actually use", "hook": "\"We are thrilled to announce…\" is the most deleted sentence in PR. 😅", "cta": "Save before your next release", "times": {"linkedin": "08:30 PHT", "instagram_facebook": "12:00 PHT"}, "dir": "PH/PH_2026-12-04_Fri_EDU_carousel_writing-quotes-journalists-use", "imgs": ["PH/PH_2026-12-04_Fri_EDU_carousel_writing-quotes-journalists-use/slides/01.png", "PH/PH_2026-12-04_Fri_EDU_carousel_writing-quotes-journalists-use/slides/02.png", "PH/PH_2026-12-04_Fri_EDU_carousel_writing-quotes-journalists-use/slides/03.png", "PH/PH_2026-12-04_Fri_EDU_carousel_writing-quotes-journalists-use/slides/04.png", "PH/PH_2026-12-04_Fri_EDU_carousel_writing-quotes-journalists-use/slides/05.png", "PH/PH_2026-12-04_Fri_EDU_carousel_writing-quotes-journalists-use/slides/06.png", "PH/PH_2026-12-04_Fri_EDU_carousel_writing-quotes-journalists-use/slides/07.png", "PH/PH_2026-12-04_Fri_EDU_carousel_writing-quotes-journalists-use/slides/08.png"], "cap": {"instagram": "\"We are thrilled to announce…\" is the most deleted sentence in PR. 😅\n\nQuotes journalists actually use:\n01 Pass the \"thrilled\" test\n02 Give an opinion, not a summary\n03 One number, said like a person\n04 Under 40 words\n\nBefore/after examples in the carousel.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PRwriting #PRtipsPH #PressReleasePH #MSMEPH #PRtipsPH\n\nSources:\n• Cision, State of the Media 2025\n", "facebook": "Quotes that journalists actually use, with before & after examples. Save this before your next release 👇\n\nQuotes journalists actually use:\n01 Pass the \"thrilled\" test\n02 Give an opinion, not a summary\n03 One number, said like a person\n04 Under 40 words\n\nBefore/after examples in the carousel.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/ph?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_ph_202612&utm_content=ph_20261204_edu\n\n#VRITIMES #PRwriting #PRtipsPH\n\nSources:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n", "linkedin": "The quote is the only part of a press release where a person speaks. Most companies waste it.\nHow to write one a journalist will actually use.\n\nCision's 2025 State of the Media found 72% of journalists call press releases the most useful resource from PR teams. What makes a release usable is that parts of it can be lifted as is, and the quote is the most common candidate.\nFour rules we apply:\n\n1. The \"thrilled\" test: if the quote fits any company's release, rewrite it.\n2. Opinion over summary: explain why it matters or what happens next.\n3. One number, phrased the way a person would say it.\n4. Under 40 words, two sentences: the point, then the reason.\n\nWhat's the worst quote you've been asked to approve? (No names, please.)\n\nMore on VRITIMES: https://www.vritimes.com/ph?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_ph_202612&utm_content=ph_20261204_edu\n\n#VRITIMES #PRwriting #PRtipsPH #PressReleasePH #MSMEPH\n\nSources:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n"}, "sources": [{"name": "Cision", "title": "2025 State of the Media Report (press release, 7 May 2025)", "year": 2025, "url": "https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/"}], "pdf": "PH/PH_2026-12-04_Fri_EDU_carousel_writing-quotes-journalists-use/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "ph_20261207_edu", "date": "2026-12-07", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "PR calendar 2027 for Philippine brands", "hook": "Your 2027 PR calendar can be built today. 🗓️", "cta": "Save for your 2027 planning", "times": {"linkedin": "08:30 PHT", "instagram_facebook": "12:00 PHT"}, "dir": "PH/PH_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-philippines", "imgs": ["PH/PH_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-philippines/slides/01.png", "PH/PH_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-philippines/slides/02.png", "PH/PH_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-philippines/slides/03.png", "PH/PH_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-philippines/slides/04.png", "PH/PH_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-philippines/slides/05.png", "PH/PH_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-philippines/slides/06.png", "PH/PH_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-philippines/slides/07.png", "PH/PH_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-philippines/slides/08.png", "PH/PH_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-philippines/slides/09.png"], "cap": {"instagram": "Your 2027 PR calendar can be built today. 🗓️\n\nQ1: annual results, Holy Week (publish before), summer stories\nQ2: Independence Day (12 Jun), back-to-school\nQ3: MSME Development Month (July), National Heroes Day, \"ber\" months\nQ4: 11.11, 12.12, Bonifacio Day, Christmas slowdown\n\nWorkflow: T-14 research → T-7 final release → T-3 pitch → Day 0 → T+3 recap.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PRcalendar #Planning2027 #PressReleasePH #MSMEPH #PRtipsPH\n\nSources:\n• DTI, 2023 MSME Statistics\n", "facebook": "Started planning 2027? Here's a quarter-by-quarter PR calendar for Philippine brands 👇\n\nQ1: annual results, Holy Week (publish before), summer stories\nQ2: Independence Day (12 Jun), back-to-school\nQ3: MSME Development Month (July), National Heroes Day, \"ber\" months\nQ4: 11.11, 12.12, Bonifacio Day, Christmas slowdown\n\nWorkflow: T-14 research → T-7 final release → T-3 pitch → Day 0 → T+3 recap.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/ph?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_ph_202612&utm_content=ph_20261207_edu\n\n#VRITIMES #PRcalendar #Planning2027\n\nSources:\n• DTI, 2023 MSME Statistics — https://dti.gov.ph/businesses/msmes/msmeresources/msme-statistics\n", "linkedin": "The brands that show up in the news around big moments prepared their releases weeks before.\nHere is a 2027 PR calendar framework for the Philippines.\n\nWith 1,246,373 enterprises in the country (DTI, 2023), competition for attention around peak moments is real. Preparation, not volume, decides who gets covered.\nA quarterly framework to adapt:\n\n1. Q1: annual milestones, Holy Week (newsrooms slow, so publish before), summer and graduation angles.\n2. Q2: Independence Day on 12 June, back-to-school and mid-year customer data.\n3. Q3: MSME Development Month in July, National Heroes Day, and the start of the \"ber\" months for Christmas planning.\n4. Q4: 11.11 and 12.12, Bonifacio Day and the Christmas slowdown. Publish early.\n5. For every moment: T-14 research, T-7 final release, T-3 pitch, Day 0 publish, T+3 recap.\n\nWhich moment matters most for your brand next year?\n\nMore on VRITIMES: https://www.vritimes.com/ph?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_ph_202612&utm_content=ph_20261207_edu\n\n#VRITIMES #PRcalendar #Planning2027 #PressReleasePH #MSMEPH\n\nSources:\n• DTI, 2023 MSME Statistics — https://dti.gov.ph/businesses/msmes/msmeresources/msme-statistics\n"}, "sources": [{"name": "DTI", "title": "2023 Philippine MSME Statistics", "year": 2024, "url": "https://dti.gov.ph/businesses/msmes/msmeresources/msme-statistics"}], "pdf": "PH/PH_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-philippines/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "ph_20261209_fun", "date": "2026-12-09", "day": "Wed", "pillar": "FUN", "format": "reel", "title": "How much do Filipinos trust the news?", "hook": "Only 38% of Filipinos trust most news most of the time. 📰", "cta": "Share with your comms team", "times": {"linkedin": "08:30 PHT", "instagram_facebook": "20:00 PHT"}, "dir": "PH/PH_2026-12-09_Wed_FUN_reels_trust-in-news-philippines-vs-region", "imgs": ["PH/PH_2026-12-09_Wed_FUN_reels_trust-in-news-philippines-vs-region/cover.png"], "cap": {"instagram": "Only 38% of Filipinos trust most news most of the time. 📰\n\nReuters Institute Digital News Report 2025, trust in news:\n🇹🇭 55% · 🇸🇬 45% · 🇦🇺 43%\n🇵🇭 38% · 🇲🇾 37% · 🇮🇩 36%\n\nLow trust means audiences look for proof.\nReleases with real data, named spokespeople and sources stand out.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #MediaPH #FunFact #PressReleasePH #MSMEPH #PRtipsPH\n\nSources:\n• Reuters Institute, Digital News Report 2025\n", "facebook": "Fun fact: only 38% of Filipinos trust most news most of the time. See how we compare with the region 👀\n\nReuters Institute Digital News Report 2025, trust in news:\n🇹🇭 55% · 🇸🇬 45% · 🇦🇺 43%\n🇵🇭 38% · 🇲🇾 37% · 🇮🇩 36%\n\nLow trust means audiences look for proof.\nReleases with real data, named spokespeople and sources stand out.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/ph?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_ph_202612&utm_content=ph_20261209_fun\n\n#VRITIMES #MediaPH #FunFact\n\nSources:\n• Reuters Institute, Digital News Report 2025 — https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf\n", "linkedin": "Trust in news in the Philippines sits at 38%, according to the Reuters Institute Digital News Report 2025.\nThat changes how brands should communicate.\n\nFor context, the same survey puts Thailand at 55%, Singapore at 45%, Australia at 43%, Malaysia at 37% and Indonesia at 36%.\nIn a lower-trust environment, claims are discounted and proof is rewarded. For brand announcements, that means:\n\n1. Lead with verifiable data, not adjectives.\n2. Name a real spokesperson who can be contacted.\n3. Cite your sources and link to them.\n4. Get published by established media, then share that coverage on social.\n\nHow does your team build credibility into announcements?\n\nMore on VRITIMES: https://www.vritimes.com/ph?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_ph_202612&utm_content=ph_20261209_fun\n\n#VRITIMES #MediaPH #FunFact #PressReleasePH #MSMEPH\n\nSources:\n• Reuters Institute, Digital News Report 2025 — https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf\n"}, "sources": [{"name": "Reuters Institute", "title": "Digital News Report 2025", "year": 2025, "url": "https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf"}], "pdf": null, "mp4": "PH/PH_2026-12-09_Wed_FUN_reels_trust-in-news-philippines-vs-region/reel_draft.mp4", "script": "PH/PH_2026-12-09_Wed_FUN_reels_trust-in-news-philippines-vs-region/reel_script.md", "price": null}, {"id": "ph_20261211_promo", "date": "2026-12-11", "day": "Fri", "pillar": "PROMO", "format": "single", "title": "Publish your holiday news before the Christmas slowdown", "hook": "Christmas is coming and newsrooms are slowing down. Is your announcement out? 🎄", "cta": "Check current pricing via the link", "times": {"linkedin": "08:30 PHT", "instagram_facebook": "12:00 PHT"}, "dir": "PH/PH_2026-12-11_Fri_PROMO_single_publish-before-christmas-slowdown", "imgs": ["PH/PH_2026-12-11_Fri_PROMO_single_publish-before-christmas-slowdown/image.png"], "cap": {"instagram": "Christmas is coming and newsrooms are slowing down. Is your announcement out? 🎄\n\nGet in before 12.12 and the holiday rush:\n✓ Published before peak shopping days\n✓ Backlink to your promo/product page\n✓ Distribution report to review results\n\nLatest plans & pricing: link in bio.\n\nCheck current plans & pricing via the link in bio.\n\n#VRITIMES #Pasko #MSMEPH #PressReleasePH #MSMEPH #PRtipsPH\n\nSources:\n• vritimes.com/ph/service/pricing\n", "facebook": "Huwag hintayin ang Christmas break 😅 Publish your holiday news early. See VRITIMES plans here 👇\n\nGet in before 12.12 and the holiday rush:\n✓ Published before peak shopping days\n✓ Backlink to your promo/product page\n✓ Distribution report to review results\n\nLatest plans & pricing: link in bio.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/ph?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_ph_202612&utm_content=ph_20261211_promo\n\n#VRITIMES #Pasko #MSMEPH\n\nSources:\n• vritimes.com/ph/service/pricing — https://www.vritimes.com/ph/service/pricing\n", "linkedin": "A holiday announcement published after newsrooms go on Christmas mode has very little news value.\nThe window is now.\n\nBetween 12.12, the 8 December holiday and Christmas, newsrooms run lean and inboxes run full. Releases that land before the slowdown have a better chance of being picked up and shared.\nWhat you can do this week with VRITIMES:\n\n1. Distribute your holiday promo, year-end results or January announcement with guaranteed media placement (count depends on plan).\n2. Point the backlink to your promo or product page.\n3. Use the distribution report to review the campaign and plan Q1.\n\nCurrent plans and pricing are on our official page.\n\nMore on VRITIMES: https://www.vritimes.com/ph?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_ph_202612&utm_content=ph_20261211_promo\n\n#VRITIMES #Pasko #MSMEPH #PressReleasePH #MSMEPH\n\nSources:\n• vritimes.com/ph/service/pricing — https://www.vritimes.com/ph/service/pricing\n"}, "sources": [{"name": "VRITIMES", "title": "Pricing page (PH) — PRICE_UNVERIFIED in this run", "year": 2026, "url": "https://www.vritimes.com/ph/service/pricing"}], "pdf": null, "mp4": null, "script": null, "price": "PRICE_UNVERIFIED"}]}, "SG": {"name": "Singapore", "grid": "SG/grid_preview_SG.png", "csv": "SG/00_calendar_SG.csv", "posts": [{"id": "sg_20261116_edu", "date": "2026-11-16", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "Anatomy of a press release editors actually publish", "hook": "Is your press release being read by editors… or opened and closed? 👀", "cta": "Save as your pre-send checklist", "times": {"linkedin": "08:30 SGT", "instagram_facebook": "12:30 SGT"}, "dir": "SG/SG_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release", "imgs": ["SG/SG_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/01.png", "SG/SG_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/02.png", "SG/SG_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/03.png", "SG/SG_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/04.png", "SG/SG_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/05.png", "SG/SG_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/06.png", "SG/SG_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/07.png", "SG/SG_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/08.png"], "cap": {"instagram": "Is your press release being read by editors… or opened and closed? 👀\n\nEditors decide in seconds. Here's what the ones that get published have in common:\n\n01 Headline = news (subject + action + impact)\n02 Lead answers 5W1H in two sentences\n03 One quote with an opinion, not \"we're thrilled\"\n04 Body: inverted pyramid, data, photos, contact\n05 A 3-sentence boilerplate you keep updated\n\n72% of journalists still call press releases the most useful thing PR teams send (Cision, 2025).\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PressRelease #PRtips #SingaporeSME #PressReleaseSG #PRtips\n\nSources:\n• Cision, State of the Media 2025\n", "facebook": "Before you hit \"send\", check your press release against this anatomy. Five parts decide whether an editor runs it 👇\n\nEditors decide in seconds. Here's what the ones that get published have in common:\n\n01 Headline = news (subject + action + impact)\n02 Lead answers 5W1H in two sentences\n03 One quote with an opinion, not \"we're thrilled\"\n04 Body: inverted pyramid, data, photos, contact\n05 A 3-sentence boilerplate you keep updated\n\n72% of journalists still call press releases the most useful thing PR teams send (Cision, 2025).\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/sg?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_sg_202611&utm_content=sg_20261116_edu\n\n#VRITIMES #PressRelease #PRtips\n\nSources:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n", "linkedin": "72% of journalists say press releases are the most useful resource PR teams provide.\nThe format isn't the problem. Most releases just can't be used as they are.\n\nCision's 2025 State of the Media report (3,000+ journalists, 19 countries) is often quoted as proof that \"releases still work\". The part that gets skipped: journalists use the releases that save them work, not the ones that create more.\nFor Singapore teams, the releases that end up published tend to share the same anatomy:\n\n1. The headline is news: subject + action + impact, 10–14 words, ideally with a number or a location.\n2. The lead answers 5W1H in two sentences. If it doesn't, the editor stops there.\n3. The quote carries a point of view or data, not a line about being thrilled.\n4. The body uses an inverted pyramid with comparative numbers, high-res photos and a contact who responds.\n5. A three-sentence boilerplate refreshed every quarter, because journalists copy it verbatim.\n\nWhich part does your team skip most often: headline, lead or quote? The full carousel is in the PDF above.\n\nMore on VRITIMES: https://www.vritimes.com/sg?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_sg_202611&utm_content=sg_20261116_edu\n\n#VRITIMES #PressRelease #PRtips #SingaporeSME #PressReleaseSG\n\nSources:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n"}, "sources": [{"name": "Cision", "title": "2025 State of the Media Report (press release, 7 May 2025)", "year": 2025, "url": "https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/"}], "pdf": "SG/SG_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "sg_20261118_fun", "date": "2026-11-18", "day": "Wed", "pillar": "FUN", "format": "carousel", "title": "The first press release came out of a train crash", "hook": "The world's first press release was born from… a train crash. 🚆", "cta": "Share with someone in PR", "times": {"linkedin": "08:30 SGT", "instagram_facebook": "20:00 SGT"}, "dir": "SG/SG_2026-11-18_Wed_FUN_carousel_first-press-release-1906", "imgs": ["SG/SG_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/01.png", "SG/SG_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/02.png", "SG/SG_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/03.png", "SG/SG_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/04.png", "SG/SG_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/05.png", "SG/SG_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/06.png"], "cap": {"instagram": "The world's first press release was born from… a train crash. 🚆\n\n28 October 1906, Atlantic City (USA).\nRailways usually stayed silent and kept reporters out.\n\nIvy Lee wrote an official statement and handed it to the press instead.\nThe New York Times printed it word for word on 30 October 1906.\n\nStill true today: speak first, use facts, make reporters' jobs easier.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PRhistory #FunFact #SingaporeSME #PressReleaseSG #PRtips\n\nSources:\n• Billy Penn (2023); Museum of Public Relations\n", "facebook": "A fun fact for marketing and PR teams: the first press release appeared in 1906, after a train crash. The story is in this carousel 👇\n\n28 October 1906, Atlantic City (USA).\nRailways usually stayed silent and kept reporters out.\n\nIvy Lee wrote an official statement and handed it to the press instead.\nThe New York Times printed it word for word on 30 October 1906.\n\nStill true today: speak first, use facts, make reporters' jobs easier.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/sg?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_sg_202611&utm_content=sg_20261118_fun\n\n#VRITIMES #PRhistory #FunFact\n\nSources:\n• Billy Penn (2023); Museum of Public Relations — https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/\n", "linkedin": "The release often called the first ever didn't announce a product. It came out of a crisis.\nThe lessons still apply to businesses today.\n\nIn October 1906, a train run by a Pennsylvania Railroad subsidiary came off a bridge in Atlantic City. The industry norm was to restrict access and say nothing.\nIvy Lee did the opposite. He drafted an official statement, shared it with reporters and gave them access to the site. The New York Times ran it word for word on 30 October 1906.\nThree principles from that day we still see working:\n\n1. Whoever speaks first with facts frames the story.\n2. A statement that can be quoted as is gets used more than a claim.\n3. Access and convenience for journalists are part of the strategy, not a bonus.\n\nWhich of these do brands break most often in a crisis?\n\nMore on VRITIMES: https://www.vritimes.com/sg?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_sg_202611&utm_content=sg_20261118_fun\n\n#VRITIMES #PRhistory #FunFact #SingaporeSME #PressReleaseSG\n\nSources:\n• Billy Penn (2023); Museum of Public Relations — https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/\n"}, "sources": [{"name": "Billy Penn / Museum of Public Relations", "title": "Ivy Lee, the 1906 Atlantic City train wreck and the first press release", "year": 2023, "url": "https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/"}], "pdf": "SG/SG_2026-11-18_Wed_FUN_carousel_first-press-release-1906/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "sg_20261120_viral", "date": "2026-11-20", "day": "Fri", "pillar": "VIRAL", "format": "reel", "title": "POV: you sent your press release as a PDF attachment", "hook": "POV: you sent your press release as a PDF attachment 📎😶", "cta": "Send to the team still using PDFs", "times": {"linkedin": "08:30 SGT", "instagram_facebook": "20:00 SGT"}, "dir": "SG/SG_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment", "imgs": ["SG/SG_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment/cover.png"], "cap": {"instagram": "POV: you sent your press release as a PDF attachment 📎😶\n\nDownload → open → copy-paste. Every extra step costs you.\n69% of journalists prefer pitches under 200 words (Muck Rack, 2025).\n\nDo this instead:\n✓ Release text in the email body\n✓ Release headline = subject line\n✓ Photos and documents by link\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PRlife #PressRelease #SingaporeSME #PressReleaseSG #PRtips\n\nSources:\n• Muck Rack, State of Journalism 2025\n", "facebook": "Who still sends press releases as PDF attachments? 😅 Watch to the end for a version journalists actually prefer.\n\nDownload → open → copy-paste. Every extra step costs you.\n69% of journalists prefer pitches under 200 words (Muck Rack, 2025).\n\nDo this instead:\n✓ Release text in the email body\n✓ Release headline = subject line\n✓ Photos and documents by link\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/sg?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_sg_202611&utm_content=sg_20261120_viral\n\n#VRITIMES #PRlife #PressRelease\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "A small habit that stops good releases being read: sending them as PDF attachments.\nIt sounds trivial. The impact isn't.\n\nMuck Rack's State of Journalism 2025 found 69% of journalists prefer pitches under 200 words. Journalists want to decide quickly, without extra steps.\nA PDF attachment adds three of them: download, open, copy. Pair it with a generic subject line and the odds of being read drop sharply.\n\n1. Paste the release text straight into the email body.\n2. Use the release headline as the subject line.\n3. Share photos and supporting documents by link.\n4. If you use a distribution platform, make sure the release lives on a web page that can be accessed and quoted.\n\nDoes your organisation still insist on PDFs because they look \"more official\"? Tell us below.\n\nMore on VRITIMES: https://www.vritimes.com/sg?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_sg_202611&utm_content=sg_20261120_viral\n\n#VRITIMES #PRlife #PressRelease #SingaporeSME #PressReleaseSG\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": null, "mp4": "SG/SG_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment/reel_draft.mp4", "script": "SG/SG_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment/reel_script.md", "price": null}, {"id": "sg_20261123_edu", "date": "2026-11-23", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "A pitch email under 200 words that gets replies", "hook": "Is your pitch email too long? 69% of journalists prefer under 200 words. ✂️", "cta": "Save the template", "times": {"linkedin": "08:30 SGT", "instagram_facebook": "12:30 SGT"}, "dir": "SG/SG_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words", "imgs": ["SG/SG_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/01.png", "SG/SG_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/02.png", "SG/SG_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/03.png", "SG/SG_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/04.png", "SG/SG_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/05.png", "SG/SG_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/06.png", "SG/SG_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/07.png"], "cap": {"instagram": "Is your pitch email too long? 69% of journalists prefer under 200 words. ✂️\n\nThe 4-line structure:\n1️⃣ Why it matters to their beat\n2️⃣ The news in one sentence + a number\n3️⃣ What you can offer: data, spokesperson, photos\n4️⃣ Release link + contact\n\nFollow-up? Once, 3–7 days later.\nFull template on slide 6.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #MediaRelations #PRtips #SingaporeSME #PressReleaseSG #PRtips\n\nSources:\n• Muck Rack, State of Journalism 2025\n", "facebook": "Here's a pitch email template under 200 words. Four lines, ready for your team to use 👇\n\nThe 4-line structure:\n1️⃣ Why it matters to their beat\n2️⃣ The news in one sentence + a number\n3️⃣ What you can offer: data, spokesperson, photos\n4️⃣ Release link + contact\n\nFollow-up? Once, 3–7 days later.\nFull template on slide 6.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/sg?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_sg_202611&utm_content=sg_20261123_edu\n\n#VRITIMES #MediaRelations #PRtips\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "The pitches journalists reply to are usually shorter than you think.\nAccording to Muck Rack, 69% of journalists prefer pitches under 200 words.\n\nThe most common mistake we see: pasting the whole release into the pitch. A pitch is an invitation to read, not the release itself.\nThe same Muck Rack State of Journalism 2025 data settles the follow-up question too: 50% of journalists say one follow-up is ideal, and 51% want it 3–7 days later.\nA four-line structure your team can use straight away:\n\n1. Relevance: why this topic fits their beat or readers.\n2. The news in one sentence, with a number.\n3. The offer: data, a spokesperson or photos that are ready now.\n4. A link to the full release and a contact who responds.\n\nThe full template is on slide 6. How long are your team's pitches right now?\n\nMore on VRITIMES: https://www.vritimes.com/sg?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_sg_202611&utm_content=sg_20261123_edu\n\n#VRITIMES #MediaRelations #PRtips #SingaporeSME #PressReleaseSG\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": "SG/SG_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "sg_20261125_fun", "date": "2026-11-25", "day": "Wed", "pillar": "FUN", "format": "single", "title": "SMEs employ 71% of Singapore's workforce", "hook": "SMEs employ 71% of Singapore's workforce. Yet most of their news never gets published. 🤔", "cta": "Tag an SME founder whose story deserves coverage", "times": {"linkedin": "08:30 SGT", "instagram_facebook": "20:00 SGT"}, "dir": "SG/SG_2026-11-25_Wed_FUN_single_smes-employ-71-percent-of-workforce", "imgs": ["SG/SG_2026-11-25_Wed_FUN_single_smes-employ-71-percent-of-workforce/image.png"], "cap": {"instagram": "SMEs employ 71% of Singapore's workforce. Yet most of their news never gets published. 🤔\n\nFrom MTI (Minister Grace Fu, Nov 2024):\n• SMEs = 99% of Singapore's businesses\n• They employ 71% of the total workforce\n\nA regional expansion, a new grant-funded product, 30 new hires: all newsworthy.\nThey just rarely reach a newsroom in a usable format.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #SingaporeSME #FunFact #SingaporeSME #PressReleaseSG #PRtips\n\nSources:\n• MTI Singapore (Nov 2024)\n", "facebook": "Fun fact: SMEs employ 71% of Singapore's workforce. If you run one, your news deserves coverage too 💙\n\nFrom MTI (Minister Grace Fu, Nov 2024):\n• SMEs = 99% of Singapore's businesses\n• They employ 71% of the total workforce\n\nA regional expansion, a new grant-funded product, 30 new hires: all newsworthy.\nThey just rarely reach a newsroom in a usable format.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/sg?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_sg_202611&utm_content=sg_20261125_fun\n\n#VRITIMES #SingaporeSME #FunFact\n\nSources:\n• MTI Singapore (Nov 2024) — https://mti.gov.sg/Newsroom/Speeches/2024/11/Keynote-Speech-by-Minister-Grace-Fu-on-A-New-Vision-for-the-Growth-of-SMEs-at-the-17th-Asia-Pacific\n", "linkedin": "SMEs make up 99% of Singapore's businesses and employ 71% of its workforce.\nThey account for a much smaller share of business coverage.\n\nThe figure, cited by MTI in November 2024, usually frames policy discussions. We read it as a communications gap: tens of thousands of firms whose milestones never reach a journalist.\nNot because they lack news value, but because they are not packaged as news. A first overseas office, a new product or a sizeable hiring round is a strong story when it comes with clear numbers and a quotable spokesperson.\n\nIf you run an SME: which milestone from this year should the market know about?\n\nMore on VRITIMES: https://www.vritimes.com/sg?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_sg_202611&utm_content=sg_20261125_fun\n\n#VRITIMES #SingaporeSME #FunFact #SingaporeSME #PressReleaseSG\n\nSources:\n• MTI Singapore (Nov 2024) — https://mti.gov.sg/Newsroom/Speeches/2024/11/Keynote-Speech-by-Minister-Grace-Fu-on-A-New-Vision-for-the-Growth-of-SMEs-at-the-17th-Asia-Pacific\n"}, "sources": [{"name": "Ministry of Trade and Industry", "title": "Keynote by Minister Grace Fu on a New Vision for the Growth of SMEs (Nov 2024)", "year": 2024, "url": "https://mti.gov.sg/Newsroom/Speeches/2024/11/Keynote-Speech-by-Minister-Grace-Fu-on-A-New-Vision-for-the-Growth-of-SMEs-at-the-17th-Asia-Pacific"}], "pdf": null, "mp4": null, "script": null, "price": null}, {"id": "sg_20261127_promo", "date": "2026-11-27", "day": "Fri", "pillar": "PROMO", "format": "single", "title": "Write, distribute and see results in one dashboard", "hook": "Black Friday can discount anything. Your credibility isn't on sale. 😉", "cta": "See plans at vritimes.com/sg", "times": {"linkedin": "08:30 SGT", "instagram_facebook": "12:30 SGT"}, "dir": "SG/SG_2026-11-27_Fri_PROMO_single_one-dashboard-write-distribute-report", "imgs": ["SG/SG_2026-11-27_Fri_PROMO_single_one-dashboard-write-distribute-report/image.png"], "cap": {"instagram": "Black Friday can discount anything. Your credibility isn't on sale. 😉\n\nVRITIMES puts it all in one dashboard:\n✓ Write and submit your press release\n✓ Guaranteed media placement per release (count depends on plan)\n✓ Backlink + sharing on VRITIMES social channels\n✓ Post-distribution report\n\nLatest plans and pricing: link in bio.\n\nSee the latest plans via the link in bio.\n\n#VRITIMES #PressRelease #SMEs #SingaporeSME #PressReleaseSG #PRtips\n\nSources:\n• vritimes.com/sg/service\n• vritimes.com/sg/service/pricing\n", "facebook": "Press releases without the admin: write, distribute and see the results in one dashboard. Plans here 👇\n\nVRITIMES puts it all in one dashboard:\n✓ Write and submit your press release\n✓ Guaranteed media placement per release (count depends on plan)\n✓ Backlink + sharing on VRITIMES social channels\n✓ Post-distribution report\n\nLatest plans and pricing: link in bio.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/sg?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_sg_202611&utm_content=sg_20261127_promo\n\n#VRITIMES #PressRelease #SMEs\n\nSources:\n• vritimes.com/sg/service — https://www.vritimes.com/sg/service\n• vritimes.com/sg/service/pricing — https://www.vritimes.com/sg/service/pricing\n", "linkedin": "Plenty of marketing teams still distribute releases with a contact spreadsheet, one-by-one emails and screenshots as a report.\nThere's a tidier way.\n\nVRITIMES is built for start-ups and SMEs that want their releases published without building a media database from scratch.\nThe workflow sits in one dashboard:\n\n1. Write and upload your press release.\n2. Distribution with guaranteed media placement per release (the number of outlets depends on the plan).\n3. A backlink to your site and sharing on VRITIMES social channels.\n4. A post-distribution report ready to forward to your manager or client.\n\nCurrent plans and pricing are always on our official page.\n\nMore on VRITIMES: https://www.vritimes.com/sg?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_sg_202611&utm_content=sg_20261127_promo\n\n#VRITIMES #PressRelease #SMEs #SingaporeSME #PressReleaseSG\n\nSources:\n• vritimes.com/sg/service — https://www.vritimes.com/sg/service\n• vritimes.com/sg/service/pricing — https://www.vritimes.com/sg/service/pricing\n"}, "sources": [{"name": "VRITIMES", "title": "Service page (SG)", "year": 2026, "url": "https://www.vritimes.com/sg/service"}, {"name": "VRITIMES", "title": "Pricing page (SG) — PRICE_UNVERIFIED in this run", "year": 2026, "url": "https://www.vritimes.com/sg/service/pricing"}], "pdf": null, "mp4": null, "script": null, "price": "PRICE_UNVERIFIED"}, {"id": "sg_20261130_edu", "date": "2026-11-30", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "Press releases for SEO? Read Google's policy first", "hook": "Sending press releases for backlinks? Google has a policy on that. 🔗", "cta": "Save & send to your SEO team", "times": {"linkedin": "08:30 SGT", "instagram_facebook": "12:30 SGT"}, "dir": "SG/SG_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo", "imgs": ["SG/SG_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/01.png", "SG/SG_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/02.png", "SG/SG_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/03.png", "SG/SG_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/04.png", "SG/SG_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/05.png", "SG/SG_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/06.png", "SG/SG_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/07.png"], "cap": {"instagram": "Sending press releases for backlinks? Google has a policy on that. 🔗\n\nGoogle lists optimised anchor text in press releases distributed on other sites as link spam.\n\nThe safe way:\n✓ Anchor = brand name / URL\n✓ 1–2 links to a relevant page\n✓ News that earns follow-up coverage\n\nThe real value: referral traffic, brand mentions and organic coverage.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #SEO #DigitalPR #SingaporeSME #PressReleaseSG #PRtips\n\nSources:\n• Google Search Central, Spam policies\n• Google Search Central, Qualify outbound links\n", "facebook": "Lots of teams send press releases just for backlinks. Before you do, here is what Google actually says 👇\n\nGoogle lists optimised anchor text in press releases distributed on other sites as link spam.\n\nThe safe way:\n✓ Anchor = brand name / URL\n✓ 1–2 links to a relevant page\n✓ News that earns follow-up coverage\n\nThe real value: referral traffic, brand mentions and organic coverage.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/sg?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_sg_202611&utm_content=sg_20261130_edu\n\n#VRITIMES #SEO #DigitalPR\n\nSources:\n• Google Search Central, Spam policies — https://developers.google.com/search/docs/essentials/spam-policies\n• Google Search Central, Qualify outbound links — https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links\n", "linkedin": "\"Send a press release to get backlinks\" is a tactic Google names specifically in its spam policies.\nHere is how to use releases for SEO without the risk.\n\nIn its Spam policies documentation, Google Search Central lists links with optimised anchor text in articles, guest posts or press releases distributed on other sites as an example of link spam. It also asks for paid or placed links to be qualified with rel=\"sponsored\" or nofollow.\nDoes that make releases useless for SEO? Quite the opposite, as long as you measure the right things:\n\n1. Referral traffic from readers who click through.\n2. Brand mentions on news sites that strengthen how your entity is recognised.\n3. Organic coverage from journalists who find the release and write their own story. That is where the biggest SEO value sits.\n4. Safe practice: brand/URL anchors, one main link, and news genuinely worth citing.\n\nHow does your team measure the SEO impact of releases today?\n\nMore on VRITIMES: https://www.vritimes.com/sg?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_sg_202611&utm_content=sg_20261130_edu\n\n#VRITIMES #SEO #DigitalPR #SingaporeSME #PressReleaseSG\n\nSources:\n• Google Search Central, Spam policies — https://developers.google.com/search/docs/essentials/spam-policies\n• Google Search Central, Qualify outbound links — https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links\n"}, "sources": [{"name": "Google Search Central", "title": "Spam policies for Google web search (link spam)", "year": 2025, "url": "https://developers.google.com/search/docs/essentials/spam-policies"}, {"name": "Google Search Central", "title": "Qualify your outbound links to Google", "year": 2025, "url": "https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links"}], "pdf": "SG/SG_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "sg_20261202_viral", "date": "2026-12-02", "day": "Wed", "pillar": "VIRAL", "format": "reel", "title": "Red flags in a press release", "hook": "Red flags in a press release 🚩 (editors notice, trust us)", "cta": "Comment the red flag you see most", "times": {"linkedin": "08:30 SGT", "instagram_facebook": "20:00 SGT"}, "dir": "SG/SG_2026-12-02_Wed_VIRAL_reels_red-flags-in-a-press-release", "imgs": ["SG/SG_2026-12-02_Wed_VIRAL_reels_red-flags-in-a-press-release/cover.png"], "cap": {"instagram": "Red flags in a press release 🚩 (editors notice, trust us)\n\n🚩 A headline with no verb\n🚩 The news buried in paragraph four\n🚩 \"World's first\" with no proof\n🚩 A 600-word pitch (69% of journalists prefer under 200 words)\n🚩 Media contact: info@\n\n✅ Green flag: news first, proof attached, a real person to call.\n\nSend this to whoever writes your releases. Link in bio.\n\n#VRITIMES #PRlife #MarketingSG #SingaporeSME #PressReleaseSG #PRtips\n\nSources:\n• Muck Rack, State of Journalism 2025\n", "facebook": "🚩 Five red flags editors spot in a press release. Which one have you seen lately?\n\n🚩 A headline with no verb\n🚩 The news buried in paragraph four\n🚩 \"World's first\" with no proof\n🚩 A 600-word pitch (69% of journalists prefer under 200 words)\n🚩 Media contact: info@\n\n✅ Green flag: news first, proof attached, a real person to call.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/sg?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_sg_202612&utm_content=sg_20261202_viral\n\n#VRITIMES #PRlife #MarketingSG\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "Five red flags that make editors stop reading a press release.\nAll of them are easy to fix before you send.\n\nNone of these are about writing talent. They are process gaps that a two-minute review would catch.\n\n1. A headline with no verb: if nothing happens, there is no news.\n2. The news buried below the fold: lead with it.\n3. Unverified superlatives such as \"world's first\": journalists check, and credibility drops when they can't.\n4. Long pitches: Muck Rack (2025) found 69% of journalists prefer pitches under 200 words.\n5. A generic contact: name a person who will answer the phone today.\n\nWhich red flag do you see most often?\n\nMore on VRITIMES: https://www.vritimes.com/sg?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_sg_202612&utm_content=sg_20261202_viral\n\n#VRITIMES #PRlife #MarketingSG #SingaporeSME #PressReleaseSG\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": null, "mp4": "SG/SG_2026-12-02_Wed_VIRAL_reels_red-flags-in-a-press-release/reel_draft.mp4", "script": "SG/SG_2026-12-02_Wed_VIRAL_reels_red-flags-in-a-press-release/reel_script.md", "price": null}, {"id": "sg_20261204_edu", "date": "2026-12-04", "day": "Fri", "pillar": "EDU", "format": "carousel", "title": "Measuring PR: AVE is dead, here is what to report instead", "hook": "Still reporting PR in AVE? The industry standard says stop. 📉", "cta": "Save for your next PR report", "times": {"linkedin": "08:30 SGT", "instagram_facebook": "12:30 SGT"}, "dir": "SG/SG_2026-12-04_Fri_EDU_carousel_measuring-pr-ave-is-dead", "imgs": ["SG/SG_2026-12-04_Fri_EDU_carousel_measuring-pr-ave-is-dead/slides/01.png", "SG/SG_2026-12-04_Fri_EDU_carousel_measuring-pr-ave-is-dead/slides/02.png", "SG/SG_2026-12-04_Fri_EDU_carousel_measuring-pr-ave-is-dead/slides/03.png", "SG/SG_2026-12-04_Fri_EDU_carousel_measuring-pr-ave-is-dead/slides/04.png", "SG/SG_2026-12-04_Fri_EDU_carousel_measuring-pr-ave-is-dead/slides/05.png", "SG/SG_2026-12-04_Fri_EDU_carousel_measuring-pr-ave-is-dead/slides/06.png", "SG/SG_2026-12-04_Fri_EDU_carousel_measuring-pr-ave-is-dead/slides/07.png"], "cap": {"instagram": "Still reporting PR in AVE? The industry standard says stop. 📉\n\nAMEC's Barcelona Principles 3.0: \"AVEs are not the value of communication.\"\n4.0 (2025): invalid measures such as AVEs should not be used.\n\nReport this instead:\n✓ Coverage quality, not just count\n✓ Key message pick-up\n✓ What audiences did next: visits, sign-ups, enquiries\n✓ What you'll change next time\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PRmeasurement #PRtips #SingaporeSME #PressReleaseSG #PRtips\n\nSources:\n• AMEC, Barcelona Principles 3.0 (2020)\n• AMEC, Barcelona Principles 4.0 (2025)\n", "facebook": "Your PR report probably doesn't need AVE. Here's a simpler one-page version that shows real value 👇\n\nAMEC's Barcelona Principles 3.0: \"AVEs are not the value of communication.\"\n4.0 (2025): invalid measures such as AVEs should not be used.\n\nReport this instead:\n✓ Coverage quality, not just count\n✓ Key message pick-up\n✓ What audiences did next: visits, sign-ups, enquiries\n✓ What you'll change next time\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/sg?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_sg_202612&utm_content=sg_20261204_edu\n\n#VRITIMES #PRmeasurement #PRtips\n\nSources:\n• AMEC, Barcelona Principles 3.0 (2020) — https://carma.com/tms/barcelona-principles-get-a-facelift/\n• AMEC, Barcelona Principles 4.0 (2025) — https://www.observer.at/wp-content/uploads/2025/06/AMEC-Barcelona-Principles-4.0-Launch-Presentation-Final.pdf\n", "linkedin": "If your PR report leads with advertising value equivalency, it is measuring the wrong thing.\nThe industry framework has said so for years, and more bluntly in 2025.\n\nAMEC's Barcelona Principles 3.0 (2020) state that \"AVEs are not the value of communication\". The 2025 update, Barcelona Principles 4.0, goes further: invalid measures such as AVEs should not be used.\nA one-page report we recommend for SME and start-up teams:\n\n1. The objective, agreed before the release went out.\n2. Coverage by quality: target audience and tier, not just article count.\n3. Key message pick-up: did the point you wanted actually appear?\n4. Outcomes: referral visits, sign-ups, enquiries.\n5. One thing you will change next time.\n\nWhat does your management actually ask for in a PR report?\n\nMore on VRITIMES: https://www.vritimes.com/sg?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_sg_202612&utm_content=sg_20261204_edu\n\n#VRITIMES #PRmeasurement #PRtips #SingaporeSME #PressReleaseSG\n\nSources:\n• AMEC, Barcelona Principles 3.0 (2020) — https://carma.com/tms/barcelona-principles-get-a-facelift/\n• AMEC, Barcelona Principles 4.0 (2025) — https://www.observer.at/wp-content/uploads/2025/06/AMEC-Barcelona-Principles-4.0-Launch-Presentation-Final.pdf\n"}, "sources": [{"name": "AMEC (via CARMA)", "title": "Barcelona Principles 3.0", "year": 2020, "url": "https://carma.com/tms/barcelona-principles-get-a-facelift/"}, {"name": "AMEC", "title": "Barcelona Principles 4.0 launch presentation", "year": 2025, "url": "https://www.observer.at/wp-content/uploads/2025/06/AMEC-Barcelona-Principles-4.0-Launch-Presentation-Final.pdf"}], "pdf": "SG/SG_2026-12-04_Fri_EDU_carousel_measuring-pr-ave-is-dead/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "sg_20261207_edu", "date": "2026-12-07", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "PR calendar 2027 for Singapore brands", "hook": "Your 2027 PR calendar can be built today. 🗓️", "cta": "Save for your 2027 planning", "times": {"linkedin": "08:30 SGT", "instagram_facebook": "12:30 SGT"}, "dir": "SG/SG_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-singapore", "imgs": ["SG/SG_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-singapore/slides/01.png", "SG/SG_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-singapore/slides/02.png", "SG/SG_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-singapore/slides/03.png", "SG/SG_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-singapore/slides/04.png", "SG/SG_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-singapore/slides/05.png", "SG/SG_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-singapore/slides/06.png", "SG/SG_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-singapore/slides/07.png", "SG/SG_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-singapore/slides/08.png", "SG/SG_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-singapore/slides/09.png"], "cap": {"instagram": "Your 2027 PR calendar can be built today. 🗓️\n\nQ1: Chinese New Year, Budget 2027, annual results\nQ2: mid-year data, hiring, trade shows\nQ3: National Day (9 Aug), partnerships & funding\nQ4: 11.11, Black Friday, 12.12, year-end slowdown\n\nWorkflow: T-14 research → T-7 final release → T-3 pitch → Day 0 → T+3 recap.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PRcalendar #Planning2027 #SingaporeSME #PressReleaseSG #PRtips\n\nSources:\n• MTI Singapore (Nov 2024)\n", "facebook": "Started on 2027 yet? Here's a quarter-by-quarter PR calendar for Singapore brands 👇\n\nQ1: Chinese New Year, Budget 2027, annual results\nQ2: mid-year data, hiring, trade shows\nQ3: National Day (9 Aug), partnerships & funding\nQ4: 11.11, Black Friday, 12.12, year-end slowdown\n\nWorkflow: T-14 research → T-7 final release → T-3 pitch → Day 0 → T+3 recap.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/sg?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_sg_202612&utm_content=sg_20261207_edu\n\n#VRITIMES #PRcalendar #Planning2027\n\nSources:\n• MTI Singapore (Nov 2024) — https://mti.gov.sg/Newsroom/Speeches/2024/11/Keynote-Speech-by-Minister-Grace-Fu-on-A-New-Vision-for-the-Growth-of-SMEs-at-the-17th-Asia-Pacific\n", "linkedin": "The brands that appear in the news around big moments prepared their releases weeks earlier.\nHere is a 2027 PR calendar framework for Singapore.\n\nWith SMEs making up 99% of Singapore's businesses (MTI, 2024), news days around Budget, National Day and year-end are crowded. Preparation, not volume, decides who gets covered.\nA quarterly framework to adapt:\n\n1. Q1: Chinese New Year (publish before the slowdown), Budget 2027 commentary and annual results.\n2. Q2: mid-year customer data, hiring and regional expansion, and pre-announcements for trade shows.\n3. Q3: National Day community stories, plus partnership and funding news.\n4. Q4: 11.11, Black Friday and 12.12, then plan January announcements before the mid-December slowdown.\n5. For every moment: T-14 research, T-7 final release, T-3 pitch, Day 0 publish, T+3 recap.\n\nWhich moment matters most for your brand next year?\n\nMore on VRITIMES: https://www.vritimes.com/sg?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_sg_202612&utm_content=sg_20261207_edu\n\n#VRITIMES #PRcalendar #Planning2027 #SingaporeSME #PressReleaseSG\n\nSources:\n• MTI Singapore (Nov 2024) — https://mti.gov.sg/Newsroom/Speeches/2024/11/Keynote-Speech-by-Minister-Grace-Fu-on-A-New-Vision-for-the-Growth-of-SMEs-at-the-17th-Asia-Pacific\n"}, "sources": [{"name": "Ministry of Trade and Industry", "title": "Keynote by Minister Grace Fu on a New Vision for the Growth of SMEs (Nov 2024)", "year": 2024, "url": "https://mti.gov.sg/Newsroom/Speeches/2024/11/Keynote-Speech-by-Minister-Grace-Fu-on-A-New-Vision-for-the-Growth-of-SMEs-at-the-17th-Asia-Pacific"}], "pdf": "SG/SG_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-singapore/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "sg_20261209_fun", "date": "2026-12-09", "day": "Wed", "pillar": "FUN", "format": "reel", "title": "How much does Singapore trust the news?", "hook": "45% of Singaporeans trust most news most of the time. That's high for the region. 📰", "cta": "Share with your comms team", "times": {"linkedin": "08:30 SGT", "instagram_facebook": "20:00 SGT"}, "dir": "SG/SG_2026-12-09_Wed_FUN_reels_singapore-trust-in-news", "imgs": ["SG/SG_2026-12-09_Wed_FUN_reels_singapore-trust-in-news/cover.png"], "cap": {"instagram": "45% of Singaporeans trust most news most of the time. That's high for the region. 📰\n\nReuters Institute Digital News Report 2025, trust in news:\n🇹🇭 55% · 🇸🇬 45% · 🇦🇺 43%\n🇵🇭 38% · 🇲🇾 37% · 🇮🇩 36%\n\nHigher trust means earned media coverage carries real weight.\nWorth getting right.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #MediaSG #FunFact #SingaporeSME #PressReleaseSG #PRtips\n\nSources:\n• Reuters Institute, Digital News Report 2025\n", "facebook": "Fun fact: 45% of Singaporeans trust most news most of the time. See how that compares with the region 👀\n\nReuters Institute Digital News Report 2025, trust in news:\n🇹🇭 55% · 🇸🇬 45% · 🇦🇺 43%\n🇵🇭 38% · 🇲🇾 37% · 🇮🇩 36%\n\nHigher trust means earned media coverage carries real weight.\nWorth getting right.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/sg?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_sg_202612&utm_content=sg_20261209_fun\n\n#VRITIMES #MediaSG #FunFact\n\nSources:\n• Reuters Institute, Digital News Report 2025 — https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf\n", "linkedin": "Trust in news in Singapore is 45%, the second highest of the six Asia-Pacific markets we work in, according to the Reuters Institute Digital News Report 2025.\nThat makes earned coverage especially valuable.\n\nFor comparison: Thailand 55%, Australia 43%, the Philippines 38%, Malaysia 37% and Indonesia 36%.\nWhen audiences trust established media, being covered by it lends credibility that paid placements rarely match. Practical implications:\n\n1. Invest in news value: data, clear impact, a named spokesperson.\n2. Target the outlets your customers actually read.\n3. Reuse coverage in sales decks, newsletters and social, with links to the source.\n\nHow does your team put earned coverage to work after it is published?\n\nMore on VRITIMES: https://www.vritimes.com/sg?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_sg_202612&utm_content=sg_20261209_fun\n\n#VRITIMES #MediaSG #FunFact #SingaporeSME #PressReleaseSG\n\nSources:\n• Reuters Institute, Digital News Report 2025 — https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf\n"}, "sources": [{"name": "Reuters Institute", "title": "Digital News Report 2025", "year": 2025, "url": "https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf"}], "pdf": null, "mp4": "SG/SG_2026-12-09_Wed_FUN_reels_singapore-trust-in-news/reel_draft.mp4", "script": "SG/SG_2026-12-09_Wed_FUN_reels_singapore-trust-in-news/reel_script.md", "price": null}, {"id": "sg_20261211_promo", "date": "2026-12-11", "day": "Fri", "pillar": "PROMO", "format": "single", "title": "Line up January news before the year-end slowdown", "hook": "Mid-December, Singapore newsrooms slow down. Your January news shouldn't. 📅", "cta": "Check current pricing via the link", "times": {"linkedin": "08:30 SGT", "instagram_facebook": "12:30 SGT"}, "dir": "SG/SG_2026-12-11_Fri_PROMO_single_plan-january-news-before-slowdown", "imgs": ["SG/SG_2026-12-11_Fri_PROMO_single_plan-january-news-before-slowdown/image.png"], "cap": {"instagram": "Mid-December, Singapore newsrooms slow down. Your January news shouldn't. 📅\n\nGet ahead before the break:\n✓ Plan & prep your release before year-end\n✓ Backlink to your launch/product page\n✓ Distribution report to review results\n\nLatest plans & pricing: link in bio.\n\nCheck current plans & pricing via the link in bio.\n\n#VRITIMES #SGbusiness #SingaporeSME #SingaporeSME #PressReleaseSG #PRtips\n\nSources:\n• vritimes.com/sg/service/pricing\n", "facebook": "Finish 2026 with your January news ready to go. See VRITIMES plans here 👇\n\nGet ahead before the break:\n✓ Plan & prep your release before year-end\n✓ Backlink to your launch/product page\n✓ Distribution report to review results\n\nLatest plans & pricing: link in bio.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/sg?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_sg_202612&utm_content=sg_20261211_promo\n\n#VRITIMES #SGbusiness #SingaporeSME\n\nSources:\n• vritimes.com/sg/service/pricing — https://www.vritimes.com/sg/service/pricing\n", "linkedin": "The first two weeks of January are crowded with announcements that were all prepared in December.\nIf yours isn't ready yet, now is the time.\n\nFrom mid-December, many newsrooms and comms teams run lean. Teams that finalise January releases before the break go into the new year with momentum instead of a backlog.\nWhat you can do this week with VRITIMES:\n\n1. Prepare and distribute your year-end results or January announcement with guaranteed media placement (count depends on plan).\n2. Point the backlink to your launch or product page.\n3. Use the distribution report to review results and plan Q1.\n\nCurrent plans and pricing are on our official page.\n\nMore on VRITIMES: https://www.vritimes.com/sg?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_sg_202612&utm_content=sg_20261211_promo\n\n#VRITIMES #SGbusiness #SingaporeSME #SingaporeSME #PressReleaseSG\n\nSources:\n• vritimes.com/sg/service/pricing — https://www.vritimes.com/sg/service/pricing\n"}, "sources": [{"name": "VRITIMES", "title": "Pricing page (SG) — PRICE_UNVERIFIED in this run", "year": 2026, "url": "https://www.vritimes.com/sg/service/pricing"}], "pdf": null, "mp4": null, "script": null, "price": "PRICE_UNVERIFIED"}]}, "AU": {"name": "Australia", "grid": "AU/grid_preview_AU.png", "csv": "AU/00_calendar_AU.csv", "posts": [{"id": "au_20261116_edu", "date": "2026-11-16", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "Anatomy of a press release editors actually publish", "hook": "Is your press release being read by editors… or opened and closed? 👀", "cta": "Save as your pre-send checklist", "times": {"linkedin": "08:00 AEDT", "instagram_facebook": "12:00 AEDT"}, "dir": "AU/AU_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release", "imgs": ["AU/AU_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/01.png", "AU/AU_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/02.png", "AU/AU_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/03.png", "AU/AU_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/04.png", "AU/AU_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/05.png", "AU/AU_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/06.png", "AU/AU_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/07.png", "AU/AU_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/08.png"], "cap": {"instagram": "Is your press release being read by editors… or opened and closed? 👀\n\nEditors decide in seconds. Here's what the ones that get published have in common:\n\n01 Headline = news (subject + action + impact)\n02 Lead answers 5W1H in two sentences\n03 One quote with an opinion, not \"we're thrilled\"\n04 Body: inverted pyramid, data, photos, contact\n05 A 3-sentence boilerplate you keep updated\n\n72% of journalists still call press releases the most useful thing PR teams send (Cision, 2025).\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PressRelease #PRtips #AusBiz #SmallBusinessAustralia #PRtips\n\nSources:\n• Cision, State of the Media 2025\n", "facebook": "Before you hit \"send\", check your press release against this anatomy. Five parts decide whether an editor runs it 👇\n\nEditors decide in seconds. Here's what the ones that get published have in common:\n\n01 Headline = news (subject + action + impact)\n02 Lead answers 5W1H in two sentences\n03 One quote with an opinion, not \"we're thrilled\"\n04 Body: inverted pyramid, data, photos, contact\n05 A 3-sentence boilerplate you keep updated\n\n72% of journalists still call press releases the most useful thing PR teams send (Cision, 2025).\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/au?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_au_202611&utm_content=au_20261116_edu\n\n#VRITIMES #PressRelease #PRtips\n\nSources:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n", "linkedin": "72% of journalists say press releases are the most useful resource PR teams provide.\nThe format isn't the problem. Most releases just can't be used as they are.\n\nCision's 2025 State of the Media report (3,000+ journalists, 19 countries) is often quoted as proof that \"releases still work\". The part that gets skipped: journalists use the releases that save them work, not the ones that create more.\nFor Australian teams, the releases that end up published tend to share the same anatomy:\n\n1. The headline is news: subject + action + impact, 10–14 words, ideally with a number or a location.\n2. The lead answers 5W1H in two sentences. If it doesn't, the editor stops there.\n3. The quote carries a point of view or data, not a line about being thrilled.\n4. The body uses an inverted pyramid with comparative numbers, high-res photos and a contact who responds.\n5. A three-sentence boilerplate refreshed every quarter, because journalists copy it verbatim.\n\nWhich part does your team skip most often: headline, lead or quote? The full carousel is in the PDF above.\n\nMore on VRITIMES: https://www.vritimes.com/au?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_au_202611&utm_content=au_20261116_edu\n\n#VRITIMES #PressRelease #PRtips #AusBiz #SmallBusinessAustralia\n\nSources:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n"}, "sources": [{"name": "Cision", "title": "2025 State of the Media Report (press release, 7 May 2025)", "year": 2025, "url": "https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/"}], "pdf": "AU/AU_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "au_20261118_fun", "date": "2026-11-18", "day": "Wed", "pillar": "FUN", "format": "carousel", "title": "The first press release came out of a train crash", "hook": "The world's first press release was born from… a train crash. 🚆", "cta": "Share with someone in PR", "times": {"linkedin": "08:00 AEDT", "instagram_facebook": "19:30 AEDT"}, "dir": "AU/AU_2026-11-18_Wed_FUN_carousel_first-press-release-1906", "imgs": ["AU/AU_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/01.png", "AU/AU_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/02.png", "AU/AU_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/03.png", "AU/AU_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/04.png", "AU/AU_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/05.png", "AU/AU_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/06.png"], "cap": {"instagram": "The world's first press release was born from… a train crash. 🚆\n\n28 October 1906, Atlantic City (USA).\nRailways usually stayed silent and kept reporters out.\n\nIvy Lee wrote an official statement and handed it to the press instead.\nThe New York Times printed it word for word on 30 October 1906.\n\nStill true today: speak first, use facts, make reporters' jobs easier.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PRhistory #FunFact #AusBiz #SmallBusinessAustralia #PRtips\n\nSources:\n• Billy Penn (2023); Museum of Public Relations\n", "facebook": "A fun fact for marketing and PR teams: the first press release appeared in 1906, after a train crash. The story is in this carousel 👇\n\n28 October 1906, Atlantic City (USA).\nRailways usually stayed silent and kept reporters out.\n\nIvy Lee wrote an official statement and handed it to the press instead.\nThe New York Times printed it word for word on 30 October 1906.\n\nStill true today: speak first, use facts, make reporters' jobs easier.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/au?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_au_202611&utm_content=au_20261118_fun\n\n#VRITIMES #PRhistory #FunFact\n\nSources:\n• Billy Penn (2023); Museum of Public Relations — https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/\n", "linkedin": "The release often called the first ever didn't announce a product. It came out of a crisis.\nThe lessons still apply to businesses today.\n\nIn October 1906, a train run by a Pennsylvania Railroad subsidiary came off a bridge in Atlantic City. The industry norm was to restrict access and say nothing.\nIvy Lee did the opposite. He drafted an official statement, shared it with reporters and gave them access to the site. The New York Times ran it word for word on 30 October 1906.\nThree principles from that day we still see working:\n\n1. Whoever speaks first with facts frames the story.\n2. A statement that can be quoted as is gets used more than a claim.\n3. Access and convenience for journalists are part of the strategy, not a bonus.\n\nWhich of these do brands break most often in a crisis?\n\nMore on VRITIMES: https://www.vritimes.com/au?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_au_202611&utm_content=au_20261118_fun\n\n#VRITIMES #PRhistory #FunFact #AusBiz #SmallBusinessAustralia\n\nSources:\n• Billy Penn (2023); Museum of Public Relations — https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/\n"}, "sources": [{"name": "Billy Penn / Museum of Public Relations", "title": "Ivy Lee, the 1906 Atlantic City train wreck and the first press release", "year": 2023, "url": "https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/"}], "pdf": "AU/AU_2026-11-18_Wed_FUN_carousel_first-press-release-1906/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "au_20261120_viral", "date": "2026-11-20", "day": "Fri", "pillar": "VIRAL", "format": "reel", "title": "POV: you sent your press release as a PDF attachment", "hook": "POV: you sent your press release as a PDF attachment 📎😶", "cta": "Send to the team still using PDFs", "times": {"linkedin": "08:00 AEDT", "instagram_facebook": "19:30 AEDT"}, "dir": "AU/AU_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment", "imgs": ["AU/AU_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment/cover.png"], "cap": {"instagram": "POV: you sent your press release as a PDF attachment 📎😶\n\nDownload → open → copy-paste. Every extra step costs you.\n69% of journalists prefer pitches under 200 words (Muck Rack, 2025).\n\nDo this instead:\n✓ Release text in the email body\n✓ Release headline = subject line\n✓ Photos and documents by link\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PRlife #PressRelease #AusBiz #SmallBusinessAustralia #PRtips\n\nSources:\n• Muck Rack, State of Journalism 2025\n", "facebook": "Who still sends press releases as PDF attachments? 😅 Watch to the end for a version journalists actually prefer.\n\nDownload → open → copy-paste. Every extra step costs you.\n69% of journalists prefer pitches under 200 words (Muck Rack, 2025).\n\nDo this instead:\n✓ Release text in the email body\n✓ Release headline = subject line\n✓ Photos and documents by link\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/au?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_au_202611&utm_content=au_20261120_viral\n\n#VRITIMES #PRlife #PressRelease\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "A small habit that stops good releases being read: sending them as PDF attachments.\nIt sounds trivial. The impact isn't.\n\nMuck Rack's State of Journalism 2025 found 69% of journalists prefer pitches under 200 words. Journalists want to decide quickly, without extra steps.\nA PDF attachment adds three of them: download, open, copy. Pair it with a generic subject line and the odds of being read drop sharply.\n\n1. Paste the release text straight into the email body.\n2. Use the release headline as the subject line.\n3. Share photos and supporting documents by link.\n4. If you use a distribution platform, make sure the release lives on a web page that can be accessed and quoted.\n\nDoes your organisation still insist on PDFs because they look \"more official\"? Tell us below.\n\nMore on VRITIMES: https://www.vritimes.com/au?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_au_202611&utm_content=au_20261120_viral\n\n#VRITIMES #PRlife #PressRelease #AusBiz #SmallBusinessAustralia\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": null, "mp4": "AU/AU_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment/reel_draft.mp4", "script": "AU/AU_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment/reel_script.md", "price": null}, {"id": "au_20261123_edu", "date": "2026-11-23", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "A pitch email under 200 words that gets replies", "hook": "Is your pitch email too long? 69% of journalists prefer under 200 words. ✂️", "cta": "Save the template", "times": {"linkedin": "08:00 AEDT", "instagram_facebook": "12:00 AEDT"}, "dir": "AU/AU_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words", "imgs": ["AU/AU_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/01.png", "AU/AU_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/02.png", "AU/AU_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/03.png", "AU/AU_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/04.png", "AU/AU_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/05.png", "AU/AU_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/06.png", "AU/AU_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/07.png"], "cap": {"instagram": "Is your pitch email too long? 69% of journalists prefer under 200 words. ✂️\n\nThe 4-line structure:\n1️⃣ Why it matters to their beat\n2️⃣ The news in one sentence + a number\n3️⃣ What you can offer: data, spokesperson, photos\n4️⃣ Release link + contact\n\nFollow-up? Once, 3–7 days later.\nFull template on slide 6.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #MediaRelations #PRtips #AusBiz #SmallBusinessAustralia #PRtips\n\nSources:\n• Muck Rack, State of Journalism 2025\n", "facebook": "Here's a pitch email template under 200 words. Four lines, ready for your team to use 👇\n\nThe 4-line structure:\n1️⃣ Why it matters to their beat\n2️⃣ The news in one sentence + a number\n3️⃣ What you can offer: data, spokesperson, photos\n4️⃣ Release link + contact\n\nFollow-up? Once, 3–7 days later.\nFull template on slide 6.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/au?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_au_202611&utm_content=au_20261123_edu\n\n#VRITIMES #MediaRelations #PRtips\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "The pitches journalists reply to are usually shorter than you think.\nAccording to Muck Rack, 69% of journalists prefer pitches under 200 words.\n\nThe most common mistake we see: pasting the whole release into the pitch. A pitch is an invitation to read, not the release itself.\nThe same Muck Rack State of Journalism 2025 data settles the follow-up question too: 50% of journalists say one follow-up is ideal, and 51% want it 3–7 days later.\nA four-line structure your team can use straight away:\n\n1. Relevance: why this topic fits their beat or readers.\n2. The news in one sentence, with a number.\n3. The offer: data, a spokesperson or photos that are ready now.\n4. A link to the full release and a contact who responds.\n\nThe full template is on slide 6. How long are your team's pitches right now?\n\nMore on VRITIMES: https://www.vritimes.com/au?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_au_202611&utm_content=au_20261123_edu\n\n#VRITIMES #MediaRelations #PRtips #AusBiz #SmallBusinessAustralia\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": "AU/AU_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "au_20261125_fun", "date": "2026-11-25", "day": "Wed", "pillar": "FUN", "format": "single", "title": "Australia has 2.74 million small businesses", "hook": "Australia has 2,741,087 small businesses. Most of their news never gets a run. 🤔", "cta": "Tag a small business owner whose story deserves coverage", "times": {"linkedin": "08:00 AEDT", "instagram_facebook": "19:30 AEDT"}, "dir": "AU/AU_2026-11-25_Wed_FUN_single_2-7-million-small-businesses", "imgs": ["AU/AU_2026-11-25_Wed_FUN_single_2-7-million-small-businesses/image.png"], "cap": {"instagram": "Australia has 2,741,087 small businesses. Most of their news never gets a run. 🤔\n\nFrom the Australian Small Business and Family Enterprise Ombudsman:\n• 2,741,087 actively trading small businesses (30 June 2026)\n• Up 3.2% on a year earlier\n• 97% of all actively trading businesses\n\nA new site, a first export deal, 20 new hires: genuinely newsworthy.\nUsually just not written up in a way a newsroom can use.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #SmallBusinessAustralia #FunFact #AusBiz #SmallBusinessAustralia #PRtips\n\nSources:\n• ASBFEO (2026)\n", "facebook": "Fun fact: Australia has more than 2.7 million small businesses. If yours is one of them, your news deserves a run too.\n\nFrom the Australian Small Business and Family Enterprise Ombudsman:\n• 2,741,087 actively trading small businesses (30 June 2026)\n• Up 3.2% on a year earlier\n• 97% of all actively trading businesses\n\nA new site, a first export deal, 20 new hires: genuinely newsworthy.\nUsually just not written up in a way a newsroom can use.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/au?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_au_202611&utm_content=au_20261125_fun\n\n#VRITIMES #SmallBusinessAustralia #FunFact\n\nSources:\n• ASBFEO (2026) — https://www.asbfeo.gov.au/contribution-australian-business-numbers\n", "linkedin": "There were 2,741,087 actively trading small businesses in Australia at 30 June 2026, 97% of all businesses.\nTheir share of business coverage is a fraction of that.\n\nASBFEO's figures are mostly used in policy debates. We see a communications gap: millions of businesses with milestones that never reach a journalist.\nNot because they lack news value, but because they aren't packaged as news. A second location, a first export contract or a hiring round is a solid local story when it comes with clear numbers and a spokesperson who will take a call.\n\nIf you run a small business: what from this year deserved a story?\n\nMore on VRITIMES: https://www.vritimes.com/au?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_au_202611&utm_content=au_20261125_fun\n\n#VRITIMES #SmallBusinessAustralia #FunFact #AusBiz #SmallBusinessAustralia\n\nSources:\n• ASBFEO (2026) — https://www.asbfeo.gov.au/contribution-australian-business-numbers\n"}, "sources": [{"name": "ASBFEO", "title": "Contribution to Australian business numbers", "year": 2026, "url": "https://www.asbfeo.gov.au/contribution-australian-business-numbers"}], "pdf": null, "mp4": null, "script": null, "price": null}, {"id": "au_20261127_promo", "date": "2026-11-27", "day": "Fri", "pillar": "PROMO", "format": "single", "title": "Write, distribute and see results in one dashboard", "hook": "Black Friday can discount plenty. Credibility isn't one of them.", "cta": "See plans at vritimes.com/au", "times": {"linkedin": "08:00 AEDT", "instagram_facebook": "12:00 AEDT"}, "dir": "AU/AU_2026-1
