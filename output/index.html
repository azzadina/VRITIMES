los:\n\n01 Judul = berita (subjek + aksi + dampak)\n02 Lead menjawab 5W1H dalam 2 kalimat\n03 Satu kutipan yang punya opini, bukan \"kami bangga\"\n04 Badan rilis: piramida terbalik, data, foto, kontak\n05 Boilerplate 3 kalimat yang selalu diperbarui\n\nFakta: 72% jurnalis masih menyebut rilis pers sebagai sumber paling berguna dari tim PR (Cision, 2025).\n\nSimpan dan bagikan ke tim Anda 👇\nSelengkapnya: https://www.vritimes.com/id?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_id_202611&utm_content=id_20261116_edu\n\n#VRITIMES #RilisPers #TipsPR\n\nSumber:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n", "linkedin": "72% jurnalis menyebut rilis pers sebagai sumber paling berguna dari tim PR.\nMasalahnya bukan formatnya. Masalahnya, kebanyakan rilis tidak bisa langsung dipakai.\n\nData dari Cision State of the Media 2025 (survei 3.000+ jurnalis di 19 negara) ini sering dibaca sebagai \"rilis masih efektif\". Yang jarang dibahas: jurnalis memakai rilis yang meringankan kerja mereka, bukan yang menambah pekerjaan.\nPola rilis yang akhirnya dimuat hampir selalu sama:\n\n1. Judul adalah berita: subjek + aksi + dampak, 10–14 kata, idealnya ada angka atau lokasi.\n2. Lead menjawab 5W1H dalam dua kalimat. Kalau belum, editor berhenti di situ.\n3. Kutipan berisi sudut pandang atau data, bukan ucapan bangga.\n4. Badan rilis memakai piramida terbalik, menyertakan pembanding angka, foto beresolusi tinggi, dan kontak yang aktif.\n5. Boilerplate tiga kalimat yang diperbarui tiap kuartal, karena jurnalis menyalinnya apa adanya.\n\nMana yang paling sering terlewat di tim Anda: judul, lead, atau kutipan? Carousel lengkapnya ada di PDF di atas.\n\nPelajari VRITIMES: https://www.vritimes.com/id?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_id_202611&utm_content=id_2026111  VRITIMES: https://www.vritimes.com/id?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_id_202611&utm_content=id_20261118_fun\n\n#VRITIMES #SejarahPR #FunFact #RilisPers #UMKM\n\nSumber:\n• Billy Penn (2023); Museum of Public Relations — https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/\n"}, "sources": [{"name": "Billy Penn / Museum of Public Relations", "title": "Ivy Lee, the 1906 Atlantic City train wreck and the first press release", "year": 2023, "url": "https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/"}], "pdf": "ID/ID_2026-11-18_Wed_FUN_carousel_rilis-pers-pertama-1906/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "id_20261120_viral", "date": "2026-11-20", "day": "Fri", "pillar": "VIRAL", "format": "reel", "title": "POV: kirim rilis pers sebagai lampiran PDF", "hook": "POV: kamu kirim rilis pers sebagai lampiran PDF 📎😶", "cta": "Kirim ke tim yang masih pakai PDF", "times": {"linkedin": "08:30 WIB", "instagram_facebook": "19:30 WIB"}, "dir": "ID/ID_2026-11-20_Fri_VIRAL_reels_pov-rilis-lampiran-pdf", "imgs": ["ID/ID_2026-11-20_Fri_VIRAL_reels_pov-rilis-lampiran-pdf/cover.png"], "cap": {"instagram": "POV: kamu kirim rilis pers sebagai lampiran PDF 📎😶\n\nJurnalis harus unduh → buka → copy-paste sendiri.\nSementara 69% jurnalis lebih suka pitch di bawah 200 kata (Muck Rack, 2025).\n\nYang lebih baik:\n✓ Teks rilis langsung di badan email\n✓ Judul rilis = subjek email\n✓ Foto & dokumen lewat link\n\nSimpan post ini & kirim ke tim marketing/PR kamu. Link di bio.\n\n#VRITIMES #PRlife #RilisPers #RilisPers #UMKM #TipsPR\n\nSumber:\n• Muck Rack, State of Journalism 2025\n", "facebook": "Siapa di sini yang masih kirim rilis pers sebagai lampiran PDF? 😅 Tonton sampai habis, ada cara yang lebih ramah untuk jurnalis.\n\nJurnalis harus unduh → buka → copy-paste sendiri.\nSementara 69% jurnalis lebih suka pitch di bawah 200 kata (Muck Rack, 2025).\n\nYang lebih baik:\n✓  Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "Pitch yang dibalas jurnalis biasanya lebih pendek dari yang Anda kira.\nMenurut Muck Rack, 69% jurnalis lebih suka pitch di bawah 200 kata.\n\nKesalahan paling umum yang kami lihat: pitch berisi seluruh rilis. Padahal pitch adalah undangan untuk membaca, bukan rilis itu sendiri.\nData yang sama dari Muck Rack State of Journalism 2025 juga menjawab soal follow-up: 50% jurnalis menganggap satu kali follow-up itu ideal, dan 51% ingin jaraknya 3–7 hari.\nStruktur empat baris yang bisa langsung dipakai tim Anda:\n\n1. Relevansi: kenapa topik ini cocok untuk rubrik atau pembacanya.\n2. Berita dalam satu kalimat, lengkap dengan angka.\n3. Penawaran: data, narasumber, atau foto yang siap.\n4. Link rilis lengkap dan kontak yang aktif.\n\nTemplate lengkapnya ada di slide 6. Berapa panjang pitch tim Anda saat ini?\n\nPelajari VRITIMES: https://www.vritimes.com/id?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_id_202611&utm_content=id_20261123_edu\n\n#VRITIMES #MediaRelations #TipsPR #RilisPers #UMKM\n\nSumber:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": "ID/ID_2026-11-23_Mon_EDU_carousel_pitch-email-200-kata/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "id_20261125_fun", "date": "2026-11-25", "day": "Wed", "pillar": "FUN", "format": "single", "title": "UMKM menyerap hampir 97% tenaga kerja", "hook": "Hampir 97% tenaga kerja Indonesia ada di UMKM. Tapi berapa yang pernah masuk berita? 🤔", "cta": "Tag pemilik UMKM yang layak diliput", "times": {"linkedin": "08:30 WIB", "instagram_facebook": "19:30 WIB"}, "dir": "ID/ID_2026-11-25_Wed_FUN_s , padahal saling melengkapi. Audiens menemukan berita di feed, tetapi menimbang kredibilitasnya dari sumber.\nBagi brand, implikasinya praktis:\n\n1. Rilis yang dimuat media memberi sumber yang bisa dirujuk dan diverifikasi.\n2. Liputan itu perlu dibagikan ulang di kanal sosial, termasuk format video pendek (TikTok dipakai 34% responden untuk berita).\n3. Pesan harus konsisten di media dan di sosial agar tidak menimbulkan keraguan.\n\nBagaimana tim Anda membagikan liputan media di kanal sosial?\n\nPelajari VRITIMES: https://www.vritimes.com/id?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_id_202612&utm_content=id_20261209_fun\n\n#VRITIMES #MediaIndonesia #FunFact #RilisPers #UMKM\n\nSumber:\n• Reuters Institute, Digital News Report 2025 — https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf\n"}, "sources": [{"name": "Reuters Institute", "title": "Digital News Report 2025", "year": 2025, "url": "https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf"}], "pdf": null, "mp4": "ID/ID_2026-12-09_Wed_FUN_reels_dari-mana-orang-indonesia-dapat-berita/reel_draft.mp4", "script": "ID/ID_2026-12-09_Wed_FUN_reels_dari-mana-orang-indonesia-dapat-berita/reel_script.md", "price": null}, {"id": "id_20261211_promo", "date": "2026-12-11", "day": "Fri", "pillar": "PROMO", "format": "single", "title": "Umumkan promo 12.12 sebelum 12.12", "hook": "Harbolnas tinggal hitungan hari. Rilis promo kamu sudah siap? 🛒", "cta": "Cek harga terbaru di link", "times": {"linkedin": "08:30 WIB", "instagram_facebook": "12:00 WIB"}, "dir": "ID/ID_2026-12-11_Fri_PROMO_single_umumkan-promo-sebelum-harbolnas", "imgs": ["ID/ID_2026-12-11_Fri_PROMO_single_umumkan-promo-sebelum-harbolnas/image.png"], "cap": {"instagram": "Harbolnas tinggal hitungan hari. Rilis promo kamu sudah siap? 🛒\n\nHarbolnas 2025 dilaporkan mencatat transaksi Rp36,4 triliun (ANTARA).\nDi momen sebesar itu, yang muncul duluan di me #VRITIMES #Harbolnas #UMKM #RilisPers #UMKM\n\nSumber:\n• vritimes.com/id/service/pricing — https://www.vritimes.com/id/service/pricing\n• ANTARA (2025) — https://en.antaranews.com/news/398479/homepage-v2.html\n"}, "sources": [{"name": "VRITIMES", "title": "Pricing page (ID) — PRICE_UNVERIFIED in this run", "year": 2026, "url": "https://www.vritimes.com/id/service/pricing"}, {"name": "ANTARA News", "title": "Harbolnas 2025 transactions reach Rp36.4 trillion", "year": 2025, "url": "https://en.antaranews.com/news/398479/homepage-v2.html"}], "pdf": null, "mp4": null, "script": null, "price": "PRICE_UNVERIFIED"}]}, "MY": {"name": "Malaysia", "grid": "MY/grid_preview_MY.png", "csv": "MY/00_calendar_MY.csv", "posts": [{"id": "my_20261116_edu", "date": "2026-11-16", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "Anatomy of a press release editors actually publish", "hook": "Is your press release being read by editors… or opened and closed? 👀", "cta": "Save as your pre-send checklist", "times": {"linkedin": "08:30 MYT", "instagram_facebook": "12:30 MYT"}, "dir": "MY/MY_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release", "imgs": ["MY/MY_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/01.png", "MY/MY_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/02.png", "MY/MY_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/03.png", "MY/MY_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/04.png", "MY/MY_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/05.png", "MY/MY_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/06.png", "MY/MY_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/07.png", "MY/MY_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/08.png"], "cap": {"instagram": "Is your press release being read by editors… or opened and closed? 👀\n\nEditors decide in seconds. Here's what the ones that get published have in common:\n\n01 Headline = news (subject + action + impact)\n02 Lead answers 5W1H in two sentences\n03 One quote with an opinion, not \"we're thrilled\"\n04 Body: inverted pyramid, data, photos, contact\n05 A 3-sentence boilerplate you keep updated\n\n72% of journalists still call press releases the most useful thing PR teams send (Cision, 2025).\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PressRelease #PRtips #PressReleaseMalaysia #MalaysiaSME #PRtips\n\nSources:\n• Cision, State of the Media 2025\n", "facebook": "Before you hit \"send\", check your press release against this anatomy. Five parts decide whether an editor runs it 👇\n\nEditors decide in seconds. Here's what the ones that get published have in common:\n\n01 Headline = news (subject + action + impact)\n02 Lead answers 5W1H in two sentences\n03 One quote with an opinion, not \"we're thrilled\"\n04 Body: inverted pyramid, data, photos, contact\n05 A 3-sentence boilerplate you keep updated\n\n72% of journalists still call press releases the most useful thing PR teams send (Cision, 2025).\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/my?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_my_202611&utm_content=my_20261116_edu\n\n#VRITIMES #PressRelease #PRtips\n\nSources:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n", "linkedin": "72% of journalists say press releases are the most useful resource PR teams provide.\nThe format isn't the problem. Most releases just can't be used as they are.\n\nCision's 2025 State of the Media report (3,000+ journalists, 19 countries) is often quoted as proof that \"releases still work\". The part that gets skipped: journalists use the releases that save them work, not the ones that create more.\nFor Malaysian teams, the releases that end up published tend to share the same anatomy:\n\n1. The headline is news: subject + action + impact, 10–14 words, ideally with a number or a location.\n2. The lead answers 5W1H in two sentences. If it doesn't, the editor stops there.\n3. The quote carries a point of view or data, not a line about being thrilled.\n4. The body uses an inverted pyramid with comparative numbers, high-res photos and a contact who responds.\n5. A three-sentence boilerplate refreshed every quarter, because journalists copy it verbatim.\n\nWhich part does your team skip most often: headline, lead or quote? The full carousel is in the PDF above.\n\nMore on VRITIMES: https://www.vritimes.com/my?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_my_202611&utm_content=my_20261116_edu\n\n#VRITIMES #PressRelease #PRtips #PressReleaseMalaysia #MalaysiaSME\n\nSources:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n"}, "sources": [{"name": "Cision", "title": "2025 State of the Media Report (press release, 7 May 2025)", "year": 2025, "url": "https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/"}], "pdf": "MY/MY_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "my_20261118_fun", "date": "2026-11-18", "day": "Wed", "pillar": "FUN", "format": "carousel", "title": "The first press release came out of a train crash", "hook": "The world's first press release was born from… a train crash. 🚆", "cta": "Share with someone in PR", "times": {"linkedin": "08:30 MYT", "instagram_facebook": "20:30 MYT"}, "dir": "MY/MY_2026-11-18_Wed_FUN_carousel_first-press-release-1906", "imgs": ["MY/MY_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/01.png", "MY/MY_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/02.png", "MY/MY_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/03.png", "MY/MY_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/04.png", "MY/MY_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/05.png", "MY/MY_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/06.png"], "cap": {"instagram": "The world's first press release was born from… a train crash. 🚆\n\n28 October 1906, Atlantic City (USA).\nRailways usually stayed silent and kept reporters out.\n\nIvy Lee wrote an official statement and handed it to the press instead.\nThe New York Times printed it word for word on 30 October 1906.\n\nStill true today: speak first, use facts, make reporters' jobs easier.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PRhistory #FunFact #PressReleaseMalaysia #MalaysiaSME #PRtips\n\nSources:\n• Billy Penn (2023); Museum of Public Relations\n", "facebook": "A fun fact for marketing and PR teams: the first press release appeared in 1906, after a train crash. The story is in this carousel 👇\n\n28 October 1906, Atlantic City (USA).\nRailways usually stayed silent and kept reporters out.\n\nIvy Lee wrote an official statement and handed it to the press instead.\nThe New York Times printed it word for word on 30 October 1906.\n\nStill true today: speak first, use facts, make reporters' jobs easier.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/my?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_my_202611&utm_content=my_20261118_fun\n\n#VRITIMES #PRhistory #FunFact\n\nSources:\n• Billy Penn (2023); Museum of Public Relations — https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/\n", "linkedin": "The release often called the first ever didn't announce a product. It came out of a crisis.\nThe lessons still apply to businesses today.\n\nIn October 1906, a train run by a Pennsylvania Railroad subsidiary came off a bridge in Atlantic City. The industry norm was to restrict access and say nothing.\nIvy Lee did the opposite. He drafted an official statement, shared it with reporters and gave them access to the site. The New York Times ran it word for word on 30 October 1906.\nThree principles from that day we still see working:\n\n1. Whoever speaks first with facts frames the story.\n2. A statement that can be quoted as is gets used more than a claim.\n3. Access and convenience for journalists are part of the strategy, not a bonus.\n\nWhich of these do brands break most often in a crisis?\n\nMore on VRITIMES: https://www.vritimes.com/my?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_my_202611&utm_content=my_20261118_fun\n\n#VRITIMES #PRhistory #FunFact #PressReleaseMalaysia #MalaysiaSME\n\nSources:\n• Billy Penn (2023); Museum of Public Relations — https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/\n"}, "sources": [{"name": "Billy Penn / Museum of Public Relations", "title": "Ivy Lee, the 1906 Atlantic City train wreck and the first press release", "year": 2023, "url": "https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/"}], "pdf": "MY/MY_2026-11-18_Wed_FUN_carousel_first-press-release-1906/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "my_20261120_viral", "date": "2026-11-20", "day": "Fri", "pillar": "VIRAL", "format": "reel", "title": "POV: you sent your press release as a PDF attachment", "hook": "POV: you sent your press release as a PDF attachment 📎😶", "cta": "Send to the team still using PDFs", "times": {"linkedin": "08:30 MYT", "instagram_facebook": "20:30 MYT"}, "dir": "MY/MY_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment", "imgs": ["MY/MY_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment/cover.png"], "cap": {"instagram": "POV: you sent your press release as a PDF attachment 📎😶\n\nDownload → open → copy-paste. Every extra step costs you.\n69% of journalists prefer pitches under 200 words (Muck Rack, 2025).\n\nDo this instead:\n✓ Release text in the email body\n✓ Release headline = subject line\n✓ Photos and documents by link\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PRlife #PressRelease #PressReleaseMalaysia #MalaysiaSME #PRtips\n\nSources:\n• Muck Rack, State of Journalism 2025\n", "facebook": "Who still sends press releases as PDF attachments? 😅 Watch to the end for a version journalists actually prefer.\n\nDownload → open → copy-paste. Every extra step costs you.\n69% of journalists prefer pitches under 200 words (Muck Rack, 2025).\n\nDo this instead:\n✓ Release text in the email body\n✓ Release headline = subject line\n✓ Photos and documents by link\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/my?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_my_202611&utm_content=my_20261120_viral\n\n#VRITIMES #PRlife #PressRelease\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "A small habit that stops good releases being read: sending them as PDF attachments.\nIt sounds trivial. The impact isn't.\n\nMuck Rack's State of Journalism 2025 found 69% of journalists prefer pitches under 200 words. Journalists want to decide quickly, without extra steps.\nA PDF attachment adds three of them: download, open, copy. Pair it with a generic subject line and the odds of being read drop sharply.\n\n1. Paste the release text straight into the email body.\n2. Use the release headline as the subject line.\n3. Share photos and supporting documents by link.\n4. If you use a distribution platform, make sure the release lives on a web page that can be accessed and quoted.\n\nDoes your organisation still insist on PDFs because they look \"more official\"? Tell us below.\n\nMore on VRITIMES: https://www.vritimes.com/my?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_my_202611&utm_content=my_20261120_viral\n\n#VRITIMES #PRlife #PressRelease #PressReleaseMalaysia #MalaysiaSME\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": null, "mp4": "MY/MY_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment/reel_draft.mp4", "script": "MY/MY_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment/reel_script.md", "price": null}, {"id": "my_20261123_edu", "date": "2026-11-23", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "A pitch email under 200 words that gets replies", "hook": "Is your pitch email too long? 69% of journalists prefer under 200 words. ✂️", "cta": "Save the template", "times": {"linkedin": "08:30 MYT", "instagram_facebook": "12:30 MYT"}, "dir": "MY/MY_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words", "imgs": ["MY/MY_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/01.png", "MY/MY_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/02.png", "MY/MY_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/03.png", "MY/MY_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/04.png", "MY/MY_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/05.png", "MY/MY_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/06.png", "MY/MY_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/07.png"], "cap": {"instagram": "Is your pitch email too long? 69% of journalists prefer under 200 words. ✂️\n\nThe 4-line structure:\n1️⃣ Why it matters to their beat\n2️⃣ The news in one sentence + a number\n3️⃣ What you can offer: data, spokesperson, photos\n4️⃣ Release link + contact\n\nFollow-up? Once, 3–7 days later.\nFull template on slide 6.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #MediaRelations #PRtips #PressReleaseMalaysia #MalaysiaSME #PRtips\n\nSources:\n• Muck Rack, State of Journalism 2025\n", "facebook": "Here's a pitch email template under 200 words. Four lines, ready for your team to use 👇\n\nThe 4-line structure:\n1️⃣ Why it matters to their beat\n2️⃣ The news in one sentence + a number\n3️⃣ What you can offer: data, spokesperson, photos\n4️⃣ Release link + contact\n\nFollow-up? Once, 3–7 days later.\nFull template on slide 6.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/my?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_my_202611&utm_content=my_20261123_edu\n\n#VRITIMES #MediaRelations #PRtips\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "The pitches journalists reply to are usually shorter than you think.\nAccording to Muck Rack, 69% of journalists prefer pitches under 200 words.\n\nThe most common mistake we see: pasting the whole release into the pitch. A pitch is an invitation to read, not the release itself.\nThe same Muck Rack State of Journalism 2025 data settles the follow-up question too: 50% of journalists say one follow-up is ideal, and 51% want it 3–7 days later.\nA four-line structure your team can use straight away:\n\n1. Relevance: why this topic fits their beat or readers.\n2. The news in one sentence, with a number.\n3. The offer: data, a spokesperson or photos that are ready now.\n4. A link to the full release and a contact who responds.\n\nThe full template is on slide 6. How long are your team's pitches right now?\n\nMore on VRITIMES: https://www.vritimes.com/my?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_my_202611&utm_content=my_20261123_edu\n\n#VRITIMES #MediaRelations #PRtips #PressReleaseMalaysia #MalaysiaSME\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": "MY/MY_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "my_20261125_fun", "date": "2026-11-25", "day": "Wed", "pillar": "FUN", "format": "single", "title": "MSMEs made up 39.7% of Malaysia's GDP in 2025", "hook": "MSMEs made up 39.7% of Malaysia's GDP in 2025. How many made the news? 🤔", "cta": "Tag an SME owner whose story deserves coverage", "times": {"linkedin": "08:30 MYT", "instagram_facebook": "20:30 MYT"}, "dir": "MY/MY_2026-11-25_Wed_FUN_single_msmes-39-7-percent-of-gdp", "imgs": ["MY/MY_2026-11-25_Wed_FUN_single_msmes-39-7-percent-of-gdp/image.png"], "cap": {"instagram": "MSMEs made up 39.7% of Malaysia's GDP in 2025. How many made the news? 🤔\n\nFrom DOSM's MSMEs Performance 2025:\n• MSME GDP grew 5.7%\n• MSMEs = 39.7% of national GDP\n• And 96.1% of all establishments (OECD, citing DOSM 2024)\n\nNew outlets, first exports, 50 new hires: these are local news stories.\nThey just rarely get written in a format newsrooms can use.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #MalaysiaSME #FunFact #PressReleaseMalaysia #MalaysiaSME #PRtips\n\nSources:\n• DOSM, MSMEs Performance 2025\n• OECD, Financing SMEs & Entrepreneurs 2026\n", "facebook": "Fun fact: MSMEs made up 39.7% of Malaysia's GDP in 2025. If your business is one of them, your story deserves coverage too 💙\n\nFrom DOSM's MSMEs Performance 2025:\n• MSME GDP grew 5.7%\n• MSMEs = 39.7% of national GDP\n• And 96.1% of all establishments (OECD, citing DOSM 2024)\n\nNew outlets, first exports, 50 new hires: these are local news stories.\nThey just rarely get written in a format newsrooms can use.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/my?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_my_202611&utm_content=my_20261125_fun\n\n#VRITIMES #MalaysiaSME #FunFact\n\nSources:\n• DOSM, MSMEs Performance 2025 — https://www.dosm.gov.my/portal-main/release-content/micro-small--medium-enterprises-msmes-performance-2025\n• OECD, Financing SMEs & Entrepreneurs 2026 — https://www.oecd.org/en/publications/financing-smes-and-entrepreneurs-2026_bb7fc5c4-en/malaysia_ebf7a4e9-en.html\n", "linkedin": "Malaysian MSMEs contributed 39.7% of GDP in 2025 and account for 96.1% of business establishments.\nTheir share of business headlines is far smaller.\n\nDOSM's latest MSME release usually gets read as an economic indicator. We read it as a communications gap: hundreds of thousands of businesses with stories that never reach a journalist.\nNot because they aren't newsworthy, but because they aren't packaged as news. A third outlet, a first export contract or 50 new hires is a strong local story when it comes with clear numbers and a quotable spokesperson.\n\nIf you run an SME: which story from this year should the public know about?\n\nMore on VRITIMES: https://www.vritimes.com/my?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_my_202611&utm_content=my_20261125_fun\n\n#VRITIMES #MalaysiaSME #FunFact #PressReleaseMalaysia #MalaysiaSME\n\nSources:\n• DOSM, MSMEs Performance 2025 — https://www.dosm.gov.my/portal-main/release-content/micro-small--medium-enterprises-msmes-performance-2025\n• OECD, Financing SMEs & Entrepreneurs 2026 — https://www.oecd.org/en/publications/financing-smes-and-entrepreneurs-2026_bb7fc5c4-en/malaysia_ebf7a4e9-en.html\n"}, "sources": [{"name": "DOSM", "title": "Micro, Small & Medium Enterprises (MSMEs) Performance 2025", "year": 2026, "url": "https://www.dosm.gov.my/portal-main/release-content/micro-small--medium-enterprises-msmes-performance-2025"}, {"name": "OECD (citing DOSM)", "title": "Financing SMEs and Entrepreneurs 2026: Malaysia", "year": 2026, "url": "https://www.oecd.org/en/publications/financing-smes-and-entrepreneurs-2026_bb7fc5c4-en/malaysia_ebf7a4e9-en.html"}], "pdf": null, "mp4": null, "script": null, "price": null}, {"id": "my_20261127_promo", "date": "2026-11-27", "day": "Fri", "pillar": "PROMO", "format": "single", "title": "Write, distribute and see results in one dashboard", "hook": "Black Friday can discount anything. Your credibility isn't one of them. 😉", "cta": "See plans at vritimes.com/my", "times": {"linkedin": "08:30 MYT", "instagram_facebook": "12:30 MYT"}, "dir": "MY/MY_2026-11-27_Fri_PROMO_single_one-dashboard-write-distribute-report", "imgs": ["MY/MY_2026-11-27_Fri_PROMO_single_one-dashboard-write-distribute-report/image.png"], "cap": {"instagram": "Black Friday can discount anything. Your credibility isn't one of them. 😉\n\nVRITIMES puts it all in one dashboard:\n✓ Write and submit your press release\n✓ Guaranteed media placement per release (count depends on plan)\n✓ Backlink + sharing on VRITIMES social channels\n✓ Post-distribution report\n\nLatest plans and pricing: link in bio.\n\nSee the latest plans via the link in bio.\n\n#VRITIMES #PressRelease #SMEs #PressReleaseMalaysia #MalaysiaSME #PRtips\n\nSources:\n• vritimes.com/my/service\n• vritimes.com/my/service/pricing\n", "facebook": "Press releases without the admin: write, distribute and see the results in one dashboard. Plans here 👇\n\nVRITIMES puts it all in one dashboard:\n✓ Write and submit your press release\n✓ Guaranteed media placement per release (count depends on plan)\n✓ Backlink + sharing on VRITIMES social channels\n✓ Post-distribution report\n\nLatest plans and pricing: link in bio.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/my?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_my_202611&utm_content=my_20261127_promo\n\n#VRITIMES #PressRelease #SMEs\n\nSources:\n• vritimes.com/my/service — https://www.vritimes.com/my/service\n• vritimes.com/my/service/pricing — https://www.vritimes.com/my/service/pricing\n", "linkedin": "Plenty of marketing teams still distribute releases with a contact spreadsheet, one-by-one emails and screenshots as a report.\nThere's a tidier way.\n\nVRITIMES is built for start-ups and SMEs that want their releases published without building a media database from scratch.\nThe workflow sits in one dashboard:\n\n1. Write and upload your press release.\n2. Distribution with guaranteed media placement per release (the number of outlets depends on the plan).\n3. A backlink to your site and sharing on VRITIMES social channels.\n4. A post-distribution report ready to forward to your manager or client.\n\nCurrent plans and pricing are always on our official page.\n\nMore on VRITIMES: https://www.vritimes.com/my?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_my_202611&utm_content=my_20261127_promo\n\n#VRITIMES #PressRelease #SMEs #PressReleaseMalaysia #MalaysiaSME\n\nSources:\n• vritimes.com/my/service — https://www.vritimes.com/my/service\n• vritimes.com/my/service/pricing — https://www.vritimes.com/my/service/pricing\n"}, "sources": [{"name": "VRITIMES", "title": "Service page (MY)", "year": 2026, "url": "https://www.vritimes.com/my/service"}, {"name": "VRITIMES", "title": "Pricing page (MY) — PRICE_UNVERIFIED in this run", "year": 2026, "url": "https://www.vritimes.com/my/service/pricing"}], "pdf": null, "mp4": null, "script": null, "price": "PRICE_UNVERIFIED"}, {"id": "my_20261130_edu", "date": "2026-11-30", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "Press releases for SEO? Read Google's policy first", "hook": "Sending press releases for backlinks? Google has a policy on that. 🔗", "cta": "Save & send to your SEO team", "times": {"linkedin": "08:30 MYT", "instagram_facebook": "12:30 MYT"}, "dir": "MY/MY_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo", "imgs": ["MY/MY_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/01.png", "MY/MY_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/02.png", "MY/MY_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/03.png", "MY/MY_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/04.png", "MY/MY_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/05.png", "MY/MY_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/06.png", "MY/MY_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/07.png"], "cap": {"instagram": "Sending press releases for backlinks? Google has a policy on that. 🔗\n\nGoogle lists optimised anchor text in press releases distributed on other sites as link spam.\n\nThe safe way:\n✓ Anchor = brand name / URL\n✓ 1–2 links to a relevant page\n✓ News that earns follow-up coverage\n\nThe real value: referral traffic, brand mentions and organic coverage.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #SEO #DigitalPR #PressReleaseMalaysia #MalaysiaSME #PRtips\n\nSources:\n• Google Search Central, Spam policies\n• Google Search Central, Qualify outbound links\n", "facebook": "Lots of teams send press releases just for backlinks. Before you do, here is what Google actually says 👇\n\nGoogle lists optimised anchor text in press releases distributed on other sites as link spam.\n\nThe safe way:\n✓ Anchor = brand name / URL\n✓ 1–2 links to a relevant page\n✓ News that earns follow-up coverage\n\nThe real value: referral traffic, brand mentions and organic coverage.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/my?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_my_202611&utm_content=my_20261130_edu\n\n#VRITIMES #SEO #DigitalPR\n\nSources:\n• Google Search Central, Spam policies — https://developers.google.com/search/docs/essentials/spam-policies\n• Google Search Central, Qualify outbound links — https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links\n", "linkedin": "\"Send a press release to get backlinks\" is a tactic Google names specifically in its spam policies.\nHere is how to use releases for SEO without the risk.\n\nIn its Spam policies documentation, Google Search Central lists links with optimised anchor text in articles, guest posts or press releases distributed on other sites as an example of link spam. It also asks for paid or placed links to be qualified with rel=\"sponsored\" or nofollow.\nDoes that make releases useless for SEO? Quite the opposite, as long as you measure the right things:\n\n1. Referral traffic from readers who click through.\n2. Brand mentions on news sites that strengthen how your entity is recognised.\n3. Organic coverage from journalists who find the release and write their own story. That is where the biggest SEO value sits.\n4. Safe practice: brand/URL anchors, one main link, and news genuinely worth citing.\n\nHow does your team measure the SEO impact of releases today?\n\nMore on VRITIMES: https://www.vritimes.com/my?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_my_202611&utm_content=my_20261130_edu\n\n#VRITIMES #SEO #DigitalPR #PressReleaseMalaysia #MalaysiaSME\n\nSources:\n• Google Search Central, Spam policies — https://developers.google.com/search/docs/essentials/spam-policies\n• Google Search Central, Qualify outbound links — https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links\n"}, "sources": [{"name": "Google Search Central", "title": "Spam policies for Google web search (link spam)", "year": 2025, "url": "https://developers.google.com/search/docs/essentials/spam-policies"}, {"name": "Google Search Central", "title": "Qualify your outbound links to Google", "year": 2025, "url": "https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links"}], "pdf": "MY/MY_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "my_20261202_viral", "date": "2026-12-02", "day": "Wed", "pillar": "VIRAL", "format": "reel", "title": "Things your brand should ghost before 2027", "hook": "Things your brand should ghost before 2027 👻 (we give you permission)", "cta": "Comment the one you're ghosting first", "times": {"linkedin": "08:30 MYT", "instagram_facebook": "20:30 MYT"}, "dir": "MY/MY_2026-12-02_Wed_VIRAL_reels_things-your-brand-should-ghost-before-2027", "imgs": ["MY/MY_2026-12-02_Wed_VIRAL_reels_things-your-brand-should-ghost-before-2027/cover.png"], "cap": {"instagram": "Things your brand should ghost before 2027 👻 (we give you permission)\n\n👻 \"Leading\", \"revolutionary\", \"world-class\" headlines\n👻 Quotes that say nothing\n👻 Following up every day (50% of journalists say once is ideal)\n👻 Reporting PR in AVE (Barcelona Principles 4.0 says no)\n👻 Hoping a journalist sees your post\n\nWhich one are you ghosting first?\n\nSend this to your team before the 2027 planning meeting. Link in bio.\n\n#VRITIMES #PRlife #MarketingMalaysia #PressReleaseMalaysia #MalaysiaSME #PRtips\n\nSources:\n• AMEC, Barcelona Principles 4.0 (2025)\n• Muck Rack, State of Journalism 2025\n", "facebook": "Bye bye to these five PR habits before 2027 👋 Which one are you ditching first?\n\n👻 \"Leading\", \"revolutionary\", \"world-class\" headlines\n👻 Quotes that say nothing\n👻 Following up every day (50% of journalists say once is ideal)\n👻 Reporting PR in AVE (Barcelona Principles 4.0 says no)\n👻 Hoping a journalist sees your post\n\nWhich one are you ghosting first?\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/my?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_my_202612&utm_content=my_20261202_viral\n\n#VRITIMES #PRlife #MarketingMalaysia\n\nSources:\n• AMEC, Barcelona Principles 4.0 (2025) — https://www.observer.at/wp-content/uploads/2025/06/AMEC-Barcelona-Principles-4.0-Launch-Presentation-Final.pdf\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "Five PR habits worth retiring before 2027.\nA light video, a serious point.\n\nMost of these survive because nobody questions them in the planning meeting. A quick audit:\n\n1. Superlatives in headlines. Editors look for a number, a place or an impact, not \"leading\".\n2. Empty quotes. If it couldn't appear in an article, cut it.\n3. Daily follow-ups. Muck Rack (2025) found 50% of journalists say one follow-up is ideal, and 51% want it 3–7 days later.\n4. AVE reports. AMEC's Barcelona Principles 4.0 (2025) say invalid measures such as AVEs should not be used. Report outcomes and business impact instead.\n5. Waiting for a journalist to stumble on your social post instead of sending news to the right desk.\n\nWhich one is hardest to drop in your organisation?\n\nMore on VRITIMES: https://www.vritimes.com/my?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_my_202612&utm_content=my_20261202_viral\n\n#VRITIMES #PRlife #MarketingMalaysia #PressReleaseMalaysia #MalaysiaSME\n\nSources:\n• AMEC, Barcelona Principles 4.0 (2025) — https://www.observer.at/wp-content/uploads/2025/06/AMEC-Barcelona-Principles-4.0-Launch-Presentation-Final.pdf\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "AMEC", "title": "Barcelona Principles 4.0 launch presentation", "year": 2025, "url": "https://www.observer.at/wp-content/uploads/2025/06/AMEC-Barcelona-Principles-4.0-Launch-Presentation-Final.pdf"}, {"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": null, "mp4": "MY/MY_2026-12-02_Wed_VIRAL_reels_things-your-brand-should-ghost-before-2027/reel_draft.mp4", "script": "MY/MY_2026-12-02_Wed_VIRAL_reels_things-your-brand-should-ghost-before-2027/reel_script.md", "price": null}, {"id": "my_20261204_edu", "date": "2026-12-04", "day": "Fri", "pillar": "EDU", "format": "carousel", "title": "Crisis communication: the first 24 hours", "hook": "The first 24 hours of a crisis decide the headline. Here's the playbook. ⏱️", "cta": "Save this for the day you need it", "times": {"linkedin": "08:30 MYT", "instagram_facebook": "12:30 MYT"}, "dir": "MY/MY_2026-12-04_Fri_EDU_carousel_crisis-communication-first-24-hours", "imgs": ["MY/MY_2026-12-04_Fri_EDU_carousel_crisis-communication-first-24-hours/slides/01.png", "MY/MY_2026-12-04_Fri_EDU_carousel_crisis-communication-first-24-hours/slides/02.png", "MY/MY_2026-12-04_Fri_EDU_carousel_crisis-communication-first-24-hours/slides/03.png", "MY/MY_2026-12-04_Fri_EDU_carousel_crisis-communication-first-24-hours/slides/04.png", "MY/MY_2026-12-04_Fri_EDU_carousel_crisis-communication-first-24-hours/slides/05.png", "MY/MY_2026-12-04_Fri_EDU_carousel_crisis-communication-first-24-hours/slides/06.png", "MY/MY_2026-12-04_Fri_EDU_carousel_crisis-communication-first-24-hours/slides/07.png", "MY/MY_2026-12-04_Fri_EDU_carousel_crisis-communication-first-24-hours/slides/08.png"], "cap": {"instagram": "The first 24 hours of a crisis decide the headline. Here's the playbook. ⏱️\n\n0–1h: confirm facts, name one spokesperson\n1–3h: holding statement (know / doing / next update)\n3–6h: BM + English, identical facts\n6–24h: update exactly when you promised\n\nNever: \"no comment\", deleting comments, public blame, guessed numbers.\n\nOnly 37% of Malaysians trust most news most of the time (Reuters Institute, 2025). Rumours fill silence.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #CrisisComms #PRtips #PressReleaseMalaysia #MalaysiaSME #PRtips\n\nSources:\n• Billy Penn (2023); Museum of Public Relations\n• Reuters Institute, Digital News Report 2025\n", "facebook": "Hopefully you'll never need it, but save this: a 24-hour crisis communication playbook for SMEs 👇\n\n0–1h: confirm facts, name one spokesperson\n1–3h: holding statement (know / doing / next update)\n3–6h: BM + English, identical facts\n6–24h: update exactly when you promised\n\nNever: \"no comment\", deleting comments, public blame, guessed numbers.\n\nOnly 37% of Malaysians trust most news most of the time (Reuters Institute, 2025). Rumours fill silence.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/my?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_my_202612&utm_content=my_20261204_edu\n\n#VRITIMES #CrisisComms #PRtips\n\nSources:\n• Billy Penn (2023); Museum of Public Relations — https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/\n• Reuters Institute, Digital News Report 2025 — https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf\n", "linkedin": "In a crisis, the story is written in the first 24 hours, with or without you.\nA practical playbook for Malaysian SMEs.\n\nReuters Institute's Digital News Report 2025 puts trust in news in Malaysia at 37%. In a low-trust environment rumours spread faster, and a clear, sourced statement becomes the thing journalists can rely on.\nThe timeline we recommend:\n\n1. 0–1 hour: confirm facts with the people closest to the issue. One spokesperson, one approver.\n2. 1–3 hours: a holding statement covering what you know, what you're doing and when the next update will come.\n3. 3–6 hours: publish in Bahasa Malaysia and English simultaneously with identical facts.\n4. 6–24 hours: update on the schedule you promised, even if the update is \"investigation ongoing\".\n5. Avoid: \"no comment\", deleting criticism, blaming individuals publicly, or guessing numbers.\n\nDoes your company have a holding statement template ready? If not, slide 3 is a start.\n\nMore on VRITIMES: https://www.vritimes.com/my?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_my_202612&utm_content=my_20261204_edu\n\n#VRITIMES #CrisisComms #PRtips #PressReleaseMalaysia #MalaysiaSME\n\nSources:\n• Billy Penn (2023); Museum of Public Relations — https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/\n• Reuters Institute, Digital News Report 2025 — https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf\n"}, "sources": [{"name": "Billy Penn / Museum of Public Relations", "title": "Ivy Lee, the 1906 Atlantic City train wreck and the first press release", "year": 2023, "url": "https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/"}, {"name": "Reuters Institute", "title": "Digital News Report 2025", "year": 2025, "url": "https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf"}], "pdf": "MY/MY_2026-12-04_Fri_EDU_carousel_crisis-communication-first-24-hours/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "my_20261207_edu", "date": "2026-12-07", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "PR calendar 2027 for Malaysian brands", "hook": "Your 2027 PR calendar can be built today. 🗓️", "cta": "Save for your 2027 planning", "times": {"linkedin": "08:30 MYT", "instagram_facebook": "12:30 MYT"}, "dir": "MY/MY_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-malaysia", "imgs": ["MY/MY_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-malaysia/slides/01.png", "MY/MY_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-malaysia/slides/02.png", "MY/MY_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-malaysia/slides/03.png", "MY/MY_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-malaysia/slides/04.png", "MY/MY_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-malaysia/slides/05.png", "MY/MY_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-malaysia/slides/06.png", "MY/MY_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-malaysia/slides/07.png", "MY/MY_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-malaysia/slides/08.png", "MY/MY_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-malaysia/slides/09.png"], "cap": {"instagram": "Your 2027 PR calendar can be built today. 🗓️\n\nQ1: Chinese New Year, Ramadan & Hari Raya (dates est.)\nQ2: mid-year data, hiring, product launches\nQ3: DOSM MSME release (late July), Merdeka (31 Aug), Malaysia Day (16 Sep)\nQ4: Budget 2028, Deepavali, 11.11 & 12.12\n\nWorkflow: T-14 research → T-7 final release → T-3 pitch → Day 0 → T+3 recap.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PRcalendar #Planning2027 #PressReleaseMalaysia #MalaysiaSME #PRtips\n\nSources:\n• DOSM, MSMEs Performance 2025\n", "facebook": "Started on 2027 yet? Here's a quarter-by-quarter PR calendar for Malaysian brands 👇\n\nQ1: Chinese New Year, Ramadan & Hari Raya (dates est.)\nQ2: mid-year data, hiring, product launches\nQ3: DOSM MSME release (late July), Merdeka (31 Aug), Malaysia Day (16 Sep)\nQ4: Budget 2028, Deepavali, 11.11 & 12.12\n\nWorkflow: T-14 research → T-7 final release → T-3 pitch → Day 0 → T+3 recap.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/my?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_my_202612&utm_content=my_20261207_edu\n\n#VRITIMES #PRcalendar #Planning2027\n\nSources:\n• DOSM, MSMEs Performance 2025 — https://www.dosm.gov.my/portal-main/release-content/micro-small--medium-enterprises-msmes-performance-2025\n", "linkedin": "The brands that appear in the news around big moments usually prepared their releases weeks before.\nHere is a 2027 PR calendar framework for Malaysia.\n\nRecurring data releases are underrated news hooks. DOSM's MSME report, which put MSMEs at 39.7% of GDP in 2025, lands every year. A reaction release with your own numbers on publication day is an easy win.\nA quarterly framework to adapt:\n\n1. Q1: Chinese New Year, Ramadan and Hari Raya (2027 dates are estimates), plus your annual milestones.\n2. Q2: mid-year data, hiring and expansion, and product launches ahead of mid-year sales.\n3. Q3: DOSM's MSME release in late July, then Merdeka and Malaysia Day with community programmes.\n4. Q4: Budget 2028 commentary, Deepavali, 11.11 and 12.12. Send promo releases before peak days.\n5. For every moment: T-14 research, T-7 final release, T-3 pitch, Day 0 publish, T+3 recap.\n\nWhich moment matters most for your brand next year?\n\nMore on VRITIMES: https://www.vritimes.com/my?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_my_202612&utm_content=my_20261207_edu\n\n#VRITIMES #PRcalendar #Planning2027 #PressReleaseMalaysia #MalaysiaSME\n\nSources:\n• DOSM, MSMEs Performance 2025 — https://www.dosm.gov.my/portal-main/release-content/micro-small--medium-enterprises-msmes-performance-2025\n"}, "sources": [{"name": "DOSM", "title": "Micro, Small & Medium Enterprises (MSMEs) Performance 2025", "year": 2026, "url": "https://www.dosm.gov.my/portal-main/release-content/micro-small--medium-enterprises-msmes-performance-2025"}], "pdf": "MY/MY_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-malaysia/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "my_20261209_fun", "date": "2026-12-09", "day": "Wed", "pillar": "FUN", "format": "reel", "title": "How Malaysians get their news", "hook": "40% of Malaysians now use TikTok for news. But trust is another story. 📱", "cta": "Share with your social media team", "times": {"linkedin": "08:30 MYT", "instagram_facebook": "20:30 MYT"}, "dir": "MY/MY_2026-12-09_Wed_FUN_reels_how-malaysians-get-their-news", "imgs": ["MY/MY_2026-12-09_Wed_FUN_reels_how-malaysians-get-their-news/cover.png"], "cap": {"instagram": "40% of Malaysians now use TikTok for news. But trust is another story. 📱\n\nReuters Institute Digital News Report 2025:\n• TikTok is the fastest-growing network for news: 40%\n• Only 37% trust most news most of the time\n\nDiscovery happens in the feed. Trust is checked at the source.\nYou need both: published in the media, shared on social.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #MediaMalaysia #FunFact #PressReleaseMalaysia #MalaysiaSME #PRtips\n\nSources:\n• Reuters Institute, Digital News Report 2025\n", "facebook": "Fun fact: 40% of Malaysians now get news on TikTok. But how much do they trust it? Watch to the end 👀\n\nReuters Institute Digital News Report 2025:\n• TikTok is the fastest-growing network for news: 40%\n• Only 37% trust most news most of the time\n\nDiscovery happens in the feed. Trust is checked at the source.\nYou need both: published in the media, shared on social.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/my?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_my_202612&utm_content=my_20261209_fun\n\n#VRITIMES #MediaMalaysia #FunFact\n\nSources:\n• Reuters Institute, Digital News Report 2025 — https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf\n", "linkedin": "Reuters Institute's 2025 data shows 40% of Malaysians use TikTok for news, while only 37% trust most news most of the time.\nWhat does that mean for brand communications?\n\nThe two numbers look contradictory but work together. Audiences discover stories in the feed, then judge credibility by the source.\nFor brands, the implications are practical:\n\n1. Coverage in established media gives people a source they can check.\n2. That coverage should be reshared on your social channels, including short video.\n3. The message must match across media and social, or doubt creeps in.\n\nHow does your team reuse media coverage on social today?\n\nMore on VRITIMES: https://www.vritimes.com/my?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_my_202612&utm_content=my_20261209_fun\n\n#VRITIMES #MediaMalaysia #FunFact #PressReleaseMalaysia #MalaysiaSME\n\nSources:\n• Reuters Institute, Digital News Report 2025 — https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf\n"}, "sources": [{"name": "Reuters Institute", "title": "Digital News Report 2025", "year": 2025, "url": "https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf"}], "pdf": null, "mp4": "MY/MY_2026-12-09_Wed_FUN_reels_how-malaysians-get-their-news/reel_draft.mp4", "script": "MY/MY_2026-12-09_Wed_FUN_reels_how-malaysians-get-their-news/reel_script.md", "price": null}, {"id": "my_20261211_promo", "date": "2026-12-11", "day": "Fri", "pillar": "PROMO", "format": "single", "title": "Get your year-end news out before 12.12", "hook": "12.12 is tomorrow. Next year's announcements can start today. 🛒", "cta": "Check current pricing via the link", "times": {"linkedin": "08:30 MYT", "instagram_facebook": "12:30 MYT"}, "dir": "MY/MY_2026-12-11_Fri_PROMO_single_announce-before-12-12-and-year-end", "imgs": ["MY/MY_2026-12-11_Fri_PROMO_single_announce-before-12-12-and-year-end/image.png"], "cap": {"instagram": "12.12 is tomorrow. Next year's announcements can start today. 🛒\n\nYear-end newsrooms fill up fast. Get in early:\n✓ Published before peak shopping & holiday days\n✓ Backlink to your promo/product page\n✓ Distribution report to review results\n\nLatest plans & pricing: link in bio.\n\nCheck current plans & pricing via the link in bio.\n\n#VRITIMES #12dot12 #MalaysiaSME #PressReleaseMalaysia #MalaysiaSME #PRtips\n\nSources:\n• vritimes.com/my/service/pricing\n", "facebook": "Don't let your year-end news land after everyone's gone on leave 😅 See VRITIMES plans here 👇\n\nYear-end newsrooms fill up fast. Get in early:\n✓ Published before peak shopping & holiday days\n✓ Backlink to your promo/product page\n✓ Distribution report to review results\n\nLatest plans & pricing: link in bio.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/my?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_my_202612&utm_content=my_20261211_promo\n\n#VRITIMES #12dot12 #MalaysiaSME\n\nSources:\n• vritimes.com/my/service/pricing — https://www.vritimes.com/my/service/pricing\n", "linkedin": "A year-end release published after the peak has almost no news value.\nThe window is now, and it closes with the holidays.\n\nBetween 12.12, Christmas and New Year, newsrooms run lean and inboxes run full. Releases that land before the slowdown have a far better chance of being picked up and shared.\nWhat you can do this week with VRITIMES:\n\n1. Distribute your year-end promo, results or January announcement with guaranteed media placement (count depends on plan).\n2. Point the backlink to your promo or product page.\n3. Use the distribution report to review the campaign and plan Q1.\n\nCurrent plans and pricing are on our official page.\n\nMore on VRITIMES: https://www.vritimes.com/my?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_my_202612&utm_content=my_20261211_promo\n\n#VRITIMES #12dot12 #MalaysiaSME #PressReleaseMalaysia #MalaysiaSME\n\nSources:\n• vritimes.com/my/service/pricing — https://www.vritimes.com/my/service/pricing\n"}, "sources": [{"name": "VRITIMES", "title": "Pricing page (MY) — PRICE_UNVERIFIED in this run", "year": 2026, "url": "https://www.vritimes.com/my/service/pricing"}], "pdf": null, "mp4": null, "script": null, "price": "PRICE_UNVERIFIED"}]}, "PH": {"name": "Philippines", "grid": "PH/grid_preview_PH.png", "csv": "PH/00_calendar_PH.csv", "posts": [{"id": "ph_20261116_edu", "date": "2026-11-16", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "Anatomy of a press release editors actually publish", "hook": "Is your press release being read by editors… or opened and closed? 👀", "cta": "Save as your pre-send checklist", "times": {"linkedin": "08:30 PHT", "instagram_facebook": "12:00 PHT"}, "dir": "PH/PH_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release", "imgs": ["PH/PH_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/01.png", "PH/PH_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/02.png", "PH/PH_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/03.png", "PH/PH_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/04.png", "PH/PH_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/05.png", "PH/PH_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/06.png", "PH/PH_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/07.png", "PH/PH_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/slides/08.png"], "cap": {"instagram": "Is your press release being read by editors… or opened and closed? 👀\n\nEditors decide in seconds. Here's what the ones that get published have in common:\n\n01 Headline = news (subject + action + impact)\n02 Lead answers 5W1H in two sentences\n03 One quote with an opinion, not \"we're thrilled\"\n04 Body: inverted pyramid, data, photos, contact\n05 A 3-sentence boilerplate you keep updated\n\n72% of journalists still call press releases the most useful thing PR teams send (Cision, 2025).\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PressRelease #PRtips #PressReleasePH #MSMEPH #PRtipsPH\n\nSources:\n• Cision, State of the Media 2025\n", "facebook": "Before you hit \"send\", check your press release against this anatomy. Five parts decide whether an editor runs it 👇\n\nEditors decide in seconds. Here's what the ones that get published have in common:\n\n01 Headline = news (subject + action + impact)\n02 Lead answers 5W1H in two sentences\n03 One quote with an opinion, not \"we're thrilled\"\n04 Body: inverted pyramid, data, photos, contact\n05 A 3-sentence boilerplate you keep updated\n\n72% of journalists still call press releases the most useful thing PR teams send (Cision, 2025).\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/ph?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_ph_202611&utm_content=ph_20261116_edu\n\n#VRITIMES #PressRelease #PRtips\n\nSources:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n", "linkedin": "72% of journalists say press releases are the most useful resource PR teams provide.\nThe format isn't the problem. Most releases just can't be used as they are.\n\nCision's 2025 State of the Media report (3,000+ journalists, 19 countries) is often quoted as proof that \"releases still work\". The part that gets skipped: journalists use the releases that save them work, not the ones that create more.\nFor Philippine teams, the releases that end up published tend to share the same anatomy:\n\n1. The headline is news: subject + action + impact, 10–14 words, ideally with a number or a location.\n2. The lead answers 5W1H in two sentences. If it doesn't, the editor stops there.\n3. The quote carries a point of view or data, not a line about being thrilled.\n4. The body uses an inverted pyramid with comparative numbers, high-res photos and a contact who responds.\n5. A three-sentence boilerplate refreshed every quarter, because journalists copy it verbatim.\n\nWhich part does your team skip most often: headline, lead or quote? The full carousel is in the PDF above.\n\nMore on VRITIMES: https://www.vritimes.com/ph?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_ph_202611&utm_content=ph_20261116_edu\n\n#VRITIMES #PressRelease #PRtips #PressReleasePH #MSMEPH\n\nSources:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n"}, "sources": [{"name": "Cision", "title": "2025 State of the Media Report (press release, 7 May 2025)", "year": 2025, "url": "https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/"}], "pdf": "PH/PH_2026-11-16_Mon_EDU_carousel_anatomy-of-a-press-release/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "ph_20261118_fun", "date": "2026-11-18", "day": "Wed", "pillar": "FUN", "format": "carousel", "title": "The first press release came out of a train crash", "hook": "The world's first press release was born from… a train crash. 🚆", "cta": "Share with someone in PR", "times": {"linkedin": "08:30 PHT", "instagram_facebook": "20:00 PHT"}, "dir": "PH/PH_2026-11-18_Wed_FUN_carousel_first-press-release-1906", "imgs": ["PH/PH_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/01.png", "PH/PH_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/02.png", "PH/PH_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/03.png", "PH/PH_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/04.png", "PH/PH_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/05.png", "PH/PH_2026-11-18_Wed_FUN_carousel_first-press-release-1906/slides/06.png"], "cap": {"instagram": "The world's first press release was born from… a train crash. 🚆\n\n28 October 1906, Atlantic City (USA).\nRailways usually stayed silent and kept reporters out.\n\nIvy Lee wrote an official statement and handed it to the press instead.\nThe New York Times printed it word for word on 30 October 1906.\n\nStill true today: speak first, use facts, make reporters' jobs easier.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PRhistory #FunFact #PressReleasePH #MSMEPH #PRtipsPH\n\nSources:\n• Billy Penn (2023); Museum of Public Relations\n", "facebook": "A fun fact for marketing and PR teams: the first press release appeared in 1906, after a train crash. The story is in this carousel 👇\n\n28 October 1906, Atlantic City (USA).\nRailways usually stayed silent and kept reporters out.\n\nIvy Lee wrote an official statement and handed it to the press instead.\nThe New York Times printed it word for word on 30 October 1906.\n\nStill true today: speak first, use facts, make reporters' jobs easier.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/ph?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_ph_202611&utm_content=ph_20261118_fun\n\n#VRITIMES #PRhistory #FunFact\n\nSources:\n• Billy Penn (2023); Museum of Public Relations — https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/\n", "linkedin": "The release often called the first ever didn't announce a product. It came out of a crisis.\nThe lessons still apply to businesses today.\n\nIn October 1906, a train run by a Pennsylvania Railroad subsidiary came off a bridge in Atlantic City. The industry norm was to restrict access and say nothing.\nIvy Lee did the opposite. He drafted an official statement, shared it with reporters and gave them access to the site. The New York Times ran it word for word on 30 October 1906.\nThree principles from that day we still see working:\n\n1. Whoever speaks first with facts frames the story.\n2. A statement that can be quoted as is gets used more than a claim.\n3. Access and convenience for journalists are part of the strategy, not a bonus.\n\nWhich of these do brands break most often in a crisis?\n\nMore on VRITIMES: https://www.vritimes.com/ph?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_ph_202611&utm_content=ph_20261118_fun\n\n#VRITIMES #PRhistory #FunFact #PressReleasePH #MSMEPH\n\nSources:\n• Billy Penn (2023); Museum of Public Relations — https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/\n"}, "sources": [{"name": "Billy Penn / Museum of Public Relations", "title": "Ivy Lee, the 1906 Atlantic City train wreck and the first press release", "year": 2023, "url": "https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/"}], "pdf": "PH/PH_2026-11-18_Wed_FUN_carousel_first-press-release-1906/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "ph_20261120_viral", "date": "2026-11-20", "day": "Fri", "pillar": "VIRAL", "format": "reel", "title": "POV: you sent your press release as a PDF attachment", "hook": "POV: you sent your press release as a PDF attachment 📎😶", "cta": "Send to the team still using PDFs", "times": {"linkedin": "08:30 PHT", "instagram_facebook": "20:00 PHT"}, "dir": "PH/PH_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment", "imgs": ["PH/PH_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment/cover.png"], "cap": {"instagram": "POV: you sent your press release as a PDF attachment 📎😶\n\nDownload → open → copy-paste. Every extra step costs you.\n69% of journalists prefer pitches under 200 words (Muck Rack, 2025).\n\nDo this instead:\n✓ Release text in the email body\n✓ Release headline = subject line\n✓ Photos and documents by link\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PRlife #PressRelease #PressReleasePH #MSMEPH #PRtipsPH\n\nSources:\n• Muck Rack, State of Journalism 2025\n", "facebook": "Who still sends press releases as PDF attachments? 😅 Watch to the end for a version journalists actually prefer.\n\nDownload → open → copy-paste. Every extra step costs you.\n69% of journalists prefer pitches under 200 words (Muck Rack, 2025).\n\nDo this instead:\n✓ Release text in the email body\n✓ Release headline = subject line\n✓ Photos and documents by link\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/ph?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_ph_202611&utm_content=ph_20261120_viral\n\n#VRITIMES #PRlife #PressRelease\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "A small habit that stops good releases being read: sending them as PDF attachments.\nIt sounds trivial. The impact isn't.\n\nMuck Rack's State of Journalism 2025 found 69% of journalists prefer pitches under 200 words. Journalists want to decide quickly, without extra steps.\nA PDF attachment adds three of them: download, open, copy. Pair it with a generic subject line and the odds of being read drop sharply.\n\n1. Paste the release text straight into the email body.\n2. Use the release headline as the subject line.\n3. Share photos and supporting documents by link.\n4. If you use a distribution platform, make sure the release lives on a web page that can be accessed and quoted.\n\nDoes your organization still insist on PDFs because they look \"more official\"? Tell us below.\n\nMore on VRITIMES: https://www.vritimes.com/ph?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_ph_202611&utm_content=ph_20261120_viral\n\n#VRITIMES #PRlife #PressRelease #PressReleasePH #MSMEPH\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": null, "mp4": "PH/PH_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment/reel_draft.mp4", "script": "PH/PH_2026-11-20_Fri_VIRAL_reels_pov-press-release-pdf-attachment/reel_script.md", "price": null}, {"id": "ph_20261123_edu", "date": "2026-11-23", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "A pitch email under 200 words that gets replies", "hook": "Is your pitch email too long? 69% of journalists prefer under 200 words. ✂️", "cta": "Save the template", "times": {"linkedin": "08:30 PHT", "instagram_facebook": "12:00 PHT"}, "dir": "PH/PH_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words", "imgs": ["PH/PH_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/01.png", "PH/PH_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/02.png", "PH/PH_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/03.png", "PH/PH_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/04.png", "PH/PH_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/05.png", "PH/PH_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/06.png", "PH/PH_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/slides/07.png"], "cap": {"instagram": "Is your pitch email too long? 69% of journalists prefer under 200 words. ✂️\n\nThe 4-line structure:\n1️⃣ Why it matters to their beat\n2️⃣ The news in one sentence + a number\n3️⃣ What you can offer: data, spokesperson, photos\n4️⃣ Release link + contact\n\nFollow-up? Once, 3–7 days later.\nFull template on slide 6.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #MediaRelations #PRtips #PressReleasePH #MSMEPH #PRtipsPH\n\nSources:\n• Muck Rack, State of Journalism 2025\n", "facebook": "Here's a pitch email template under 200 words. Four lines, ready for your team to use 👇\n\nThe 4-line structure:\n1️⃣ Why it matters to their beat\n2️⃣ The news in one sentence + a number\n3️⃣ What you can offer: data, spokesperson, photos\n4️⃣ Release link + contact\n\nFollow-up? Once, 3–7 days later.\nFull template on slide 6.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/ph?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_ph_202611&utm_content=ph_20261123_edu\n\n#VRITIMES #MediaRelations #PRtips\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "The pitches journalists reply to are usually shorter than you think.\nAccording to Muck Rack, 69% of journalists prefer pitches under 200 words.\n\nThe most common mistake we see: pasting the whole release into the pitch. A pitch is an invitation to read, not the release itself.\nThe same Muck Rack State of Journalism 2025 data settles the follow-up question too: 50% of journalists say one follow-up is ideal, and 51% want it 3–7 days later.\nA four-line structure your team can use straight away:\n\n1. Relevance: why this topic fits their beat or readers.\n2. The news in one sentence, with a number.\n3. The offer: data, a spokesperson or photos that are ready now.\n4. A link to the full release and a contact who responds.\n\nThe full template is on slide 6. How long are your team's pitches right now?\n\nMore on VRITIMES: https://www.vritimes.com/ph?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_ph_202611&utm_content=ph_20261123_edu\n\n#VRITIMES #MediaRelations #PRtips #PressReleasePH #MSMEPH\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": "PH/PH_2026-11-23_Mon_EDU_carousel_pitch-email-under-200-words/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "ph_20261125_fun", "date": "2026-11-25", "day": "Wed", "pillar": "FUN", "format": "single", "title": "MSMEs are 99.6% of Philippine businesses", "hook": "99.6% of Philippine businesses are MSMEs. How many have been in the news? 🤔", "cta": "Tag a negosyante whose story deserves coverage", "times": {"linkedin": "08:30 PHT", "instagram_facebook": "20:00 PHT"}, "dir": "PH/PH_2026-11-25_Wed_FUN_single_msmes-99-6-percent-of-businesses", "imgs": ["PH/PH_2026-11-25_Wed_FUN_single_msmes-99-6-percent-of-businesses/image.png"], "cap": {"instagram": "99.6% of Philippine businesses are MSMEs. How many have been in the news? 🤔\n\nDTI 2023 MSME Statistics:\n• 1,246,373 business enterprises\n• 99.6% are MSMEs\n• MSMEs generated 6,351,466 jobs = 66.97% of employment\n\nNew branches, first exports, 50 new hires: these are real news stories.\nThey just rarely get written in a format newsrooms can use.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #MSMEPH #FunFact #PressReleasePH #MSMEPH #PRtipsPH\n\nSources:\n• DTI, 2023 MSME Statistics\n", "facebook": "Fun fact: 99.6% of businesses in the Philippines are MSMEs. If yours is one of them, your story deserves coverage too 💙\n\nDTI 2023 MSME Statistics:\n• 1,246,373 business enterprises\n• 99.6% are MSMEs\n• MSMEs generated 6,351,466 jobs = 66.97% of employment\n\nNew branches, first exports, 50 new hires: these are real news stories.\nThey just rarely get written in a format newsrooms can use.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/ph?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_ph_202611&utm_content=ph_20261125_fun\n\n#VRITIMES #MSMEPH #FunFact\n\nSources:\n• DTI, 2023 MSME Statistics — https://dti.gov.ph/businesses/msmes/msmeresources/msme-statistics\n", "linkedin": "MSMEs make up 99.6% of Philippine businesses and generate 66.97% of jobs.\nTheir share of business headlines is a fraction of that.\n\nDTI's 2023 figures (1,246,373 enterprises, 6,351,466 MSME jobs) are usually quoted in policy discussions. We read them as a communications gap: more than a million businesses with stories that never reach a reporter.\nNot because they lack news value, but because they aren't packaged as news. A third branch in Davao, a first export order or 50 new hires is a strong local story when it comes with clear numbers and a quotable spokesperson.\n\nIf you run an MSME: which story from this year should the public hear?\n\nMore on VRITIMES: https://www.vritimes.com/ph?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_ph_202611&utm_content=ph_20261125_fun\n\n#VRITIMES #MSMEPH #FunFact #PressReleasePH #MSMEPH\n\nSources:\n• DTI, 2023 MSME Statistics — https://dti.gov.ph/businesses/msmes/msmeresources/msme-statistics\n"}, "sources": [{"name": "DTI", "title": "2023 Philippine MSME Statistics", "year": 2024, "url": "https://dti.gov.ph/businesses/msmes/msmeresources/msme-statistics"}], "pdf": null, "mp4": null, "script": null, "price": null}, {"id": "ph_20261127_promo", "date": "2026-11-27", "day": "Fri", "pillar": "PROMO", "format": "single", "title": "Write, distribute and see resul , "PH/PH_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/07.png"], "cap": {"instagram": "Sending press releases for backlinks? Google has a policy on that. 🔗\n\nGoogle lists optimized anchor text in press releases distributed on other sites as link spam.\n\nThe safe way:\n✓ Anchor = brand name / URL\n✓ 1–2 links to a relevant page\n✓ News that earns follow-up coverage\n\nThe real value: referral traffic, brand mentions and organic coverage.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #SEO #DigitalPR #PressReleasePH #MSMEPH #PRtipsPH\n\nSources:\n• Google Search Central, Spam policies\n• Google Search Central, Qualify outbound links\n", "facebook": "Lots of teams send press releases just for backlinks. Before you do, here is what Google actually says 👇\n\nGoogle lists optimized anchor text in press releases distributed on other sites as link spam.\n\nThe safe way:\n✓ Anchor = brand name / URL\n✓ 1–2 links to a relevant page\n✓ News that earns follow-up coverage\n\nThe real value: referral traffic, brand mentions and organic coverage.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/ph?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_ph_202611&utm_content=ph_20261130_edu\n\n#VRITIMES #SEO #DigitalPR\n\nSources:\n• Google Search Central, Spam policies — https://developers.google.com/search/docs/essentials/spam-policies\n• Google Search Central, Qualify outbound links — https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links\n", "linkedin": "\"Send a press release to get backlinks\" is a tactic Google names specifically in its spam policies.\nHere is how to use releases for SEO without the risk.\n\nIn its Spam policies documentation, Google Search Central lists links with optimized anchor text in articles, guest posts or press releases distributed on other sites as an example of link spam. It also asks for paid or placed links to be qualified with rel=\"sponsored\" or nofollow.\nDoes that make releases useless for SEO? Quite the opposite, as long as you measure the right things:\n\n1. Referral traffic from readers who click through.\n2. Brand mentions on news sites that strengthen how your entity is recognized.\n3. Organic coverage from journalists who find the release and write their own story. That is where the biggest SEO value sits.\n4. Safe practice: brand/URL anchors, one main link, and news genuinely worth citing.\n\nHow does your team measure the SEO impact of releases today?\n\nMore on VRITIMES: https://www.vritimes.com/ph?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_ph_202611&utm_content=ph_20261130_edu\n\n#VRITIMES #SEO #DigitalPR #PressReleasePH #MSMEPH\n\nSources:\n• Google Search Central, Spam policies — https://developers.google.com/search/docs/essentials/spam-policies\n• Google Search Central, Qualify outbound links — https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links\n"}, "sources": [{"name": "Google Search Central", "title": "Spam policies for Google web search (link spam)", "year": 2025, "url": "https://developers.google.com/search/docs/essentials/spam-policies"}, {"name": "Google Search Central", "title": "Qualify your outbound links to Google", "year": 2025, "url": "https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links"}], "pdf": "PH/PH_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "ph_20261202_viral", "date": "2026-12-02", "day": "Wed", "pillar": "VIRAL", "format": "reel", "title": "Press release myth vs fact", "hook": "\"Press releases are dead na daw.\" Let's fact-check that. 🔍", "cta": "Comment the myth you used to believe", "times": {"linkedin": "08:30 PHT", "instagram_facebook": "20:00 PHT"}, "dir": "PH/PH_2026-12-02_Wed_VIRAL_reels_press-release-myth-vs-fact", "imgs": ["PH/PH_2026-12-02_Wed_VIRAL_reels_press-release-myth-vs-fact/cover.png"], "cap": {"instagram": "\"Press releases are dead na daw.\" Let's fact-check that. 🔍\n\n❌ Myth: press releases are dead\n✅ Fact: 72% of journalists call them the most useful thing PR sends (Cision, 2025)\n\n❌ Myth: longer pitch = more serious\n✅ Fact: 69% prefer under 200 words (Muck Rack, 2025)\n\n❌ Myth: follow up araw-araw\n✅ Fact: 50% say one follow-up is ideal\n\n❌ Myth: releases = easy SEO backlinks\n✅ Fact: Google calls optimized anchor text in releases link spam\n\nSend this to the tita who says press releases are old school 😄 Link in bio.\n\n#VRITIMES #PRlife #MarketingPH #PressReleasePH #MSMEPH #PRtipsPH\n\nSources:\n• Cision, State of the Media 2025\n• Muck Rack, State of Journalism 2025\n• Google Search Central, Spam policies\n", "facebook": "Myth vs fact: press release edition 😄 Which one did you believe before?\n\n❌ Myth: press releases are dead\n✅ Fact: 72% of journalists call them the most useful thing PR sends (Cision, 2025)\n\n❌ Myth: longer pitch = more serious\n✅ Fact: 69% prefer under 200 words (Muck Rack, 2025)\n\n❌ Myth: follow up araw-araw\n✅ Fact: 50% say one follow-up is ideal\n\n❌ Myth: releases = easy SEO backlinks\n✅ Fact: Google calls optimized anchor text in releases link spam\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/ph?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_ph_202612&utm_content=ph_20261202_viral\n\n#VRITIMES #PRlife #MarketingPH\n\nSources:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n• Google Search Central, Spam policies — https://developers.google.com/search/docs/essentials/spam-policies\n", "linkedin": "Four press release myths we still hear every week, and what the
