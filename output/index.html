ing on VRITIMES social channels.\n4. A post-distribution report ready to forward to your manager or client.\n\nCurrent plans and pricing are always on our official page.\n\nMore on VRITIMES: https://www.vritimes.com/au?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_au_202611&utm_content=au_20261127_promo\n\n#VRITIMES #PressRelease #SmallBusiness #AusBiz #SmallBusinessAustralia\n\nSources:\n• vritimes.com/au/service — https://www.vritimes.com/au/service\n• vritimes.com/au/service/pricing — https://www.vritimes.com/au/service/pricing\n"}, "sources": [{"name": "VRITIMES", "title": "Service page (AU)", "year": 2026, "url": "https://www.vritimes.com/au/service"}, {"name": "VRITIMES", "title": "Pricing page (AU) — PRICE_UNVERIFIED in this run", "year": 2026, "url": "https://www.vritimes.com/au/service/pricing"}], "pdf": null, "mp4": null, "script": null, "price": "PRICE_UNVERIFIED"}, {"id": "au_20261130_edu", "date": "2026-11-30", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "Press releases for SEO? Read Google's policy first", "hook": "Sending press releases for backlinks? Google has a policy on that. 🔗", "cta": "Save & send to your SEO team", "times": {"linkedin": "08:00 AEDT", "instagram_facebook": "12:00 AEDT"}, "dir": "AU/AU_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo", "imgs": ["AU/AU_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/01.png", "AU/AU_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/02.png", "AU/AU_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/03.png", "AU/AU_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/04.png", "AU/AU_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/05.png", "AU/AU_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/06.png", "AU/AU_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/slides/07.png"], "cap": {"instagram": "Sending press releases for backlinks? Google has a policy on that. 🔗\n\nGoogle lists optimised anchor text in press releases distributed on other sites as link spam.\n\nThe safe way:\n✓ Anchor = brand name / URL\n✓ 1–2 links to a relevant page\n✓ News that earns follow-up coverage\n\nThe real value: referral traffic, brand mentions and organic coverage.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #SEO #DigitalPR #AusBiz #SmallBusinessAustralia #PRtips\n\nSources:\n• Google Search Central, Spam policies\n• Google Search Central, Qualify outbound links\n", "facebook": "Lots of teams send press releases just for backlinks. Before you do, here is what Google actually says 👇\n\nGoogle lists optimised anchor text in press releases distributed on other sites as link spam.\n\nThe safe way:\n✓ Anchor = brand name / URL\n✓ 1–2 links to a relevant page\n✓ News that earns follow-up coverage\n\nThe real value: referral traffic, brand mentions and organic coverage.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/au?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_au_202611&utm_content=au_20261130_edu\n\n#VRITIMES #SEO #DigitalPR\n\nSources:\n• Google Search Central, Spam policies — https://developers.google.com/search/docs/essentials/spam-policies\n• Google Search Central, Qualify outbound links — https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links\n", "linkedin": "\"Send a press release to get backlinks\" is a tactic Google names specifically in its spam policies.\nHere is how to use releases for SEO without the risk.\n\nIn its Spam policies documentation, Google Search Central lists links with optimised anchor text in articles, guest posts or press releases distributed on other sites as an example of link spam. It also asks for paid or placed links to be qualified with rel=\"sponsored\" or nofollow.\nDoes that make releases useless for SEO? Quite the opposite, as long as you measure the right things:\n\n1. Referral traffic from readers who click through.\n2. Brand mentions on news sites that strengthen how your entity is recognised.\n3. Organic coverage from journalists who find the release and write their own story. That is where the biggest SEO value sits.\n4. Safe practice: brand/URL anchors, one main link, and news genuinely worth citing.\n\nHow does your team measure the SEO impact of releases today?\n\nMore on VRITIMES: https://www.vritimes.com/au?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_au_202611&utm_content=au_20261130_edu\n\n#VRITIMES #SEO #DigitalPR #AusBiz #SmallBusinessAustralia\n\nSources:\n• Google Search Central, Spam policies — https://developers.google.com/search/docs/essentials/spam-policies\n• Google Search Central, Qualify outbound links — https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links\n"}, "sources": [{"name": "Google Search Central", "title": "Spam policies for Google web search (link spam)", "year": 2025, "url": "https://developers.google.com/search/docs/essentials/spam-policies"}, {"name": "Google Search Central", "title": "Qualify your outbound links to Google", "year": 2025, "url": "https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links"}], "pdf": "AU/AU_2026-11-30_Mon_EDU_carousel_press-release-backlinks-seo/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "au_20261202_viral", "date": "2026-12-02", "day": "Wed", "pillar": "VIRAL", "format": "reel", "title": "Say bye bye to \"hope a journalist sees it\"", "hook": "Say bye bye to \"hope a journalist sees it\" 👋", "cta": "Comment which \"hope\" you're retiring", "times": {"linkedin": "08:00 AEDT", "instagram_facebook": "19:30 AEDT"}, "dir": "AU/AU_2026-12-02_Wed_VIRAL_reels_bye-bye-hope-a-journalist-sees-it", "imgs": ["AU/AU_2026-12-02_Wed_VIRAL_reels_bye-bye-hope-a-journalist-sees-it/cover.png"], "cap": {"instagram": "Say bye bye to \"hope a journalist sees it\" 👋\n\n\"Hope they find our LinkedIn post\" → send the news directly\n\"Hope they open the attachment\" → text in the email body\n\"Hope a long pitch looks serious\" → 69% prefer under 200 words\n\"Hope they reply if I chase daily\" → one follow-up, 3–7 days later\n\nHope isn't a media strategy. A process is.\n\nSend this to your marketing team. Link in bio.\n\n#VRITIMES #PRlife #MarketingAustralia #AusBiz #SmallBusinessAustralia #PRtips\n\nSources:\n• Muck Rack, State of Journalism 2025\n", "facebook": "Hope isn't a media strategy 👋 Here are four swaps that actually work.\n\n\"Hope they find our LinkedIn post\" → send the news directly\n\"Hope they open the attachment\" → text in the email body\n\"Hope a long pitch looks serious\" → 69% prefer under 200 words\n\"Hope they reply if I chase daily\" → one follow-up, 3–7 days later\n\nHope isn't a media strategy. A process is.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/au?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_au_202612&utm_content=au_20261202_viral\n\n#VRITIMES #PRlife #MarketingAustralia\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "Most small-business media strategies quietly rely on hope.\nFour hopes worth replacing with a process.\n\nMuck Rack's State of Journalism 2025 gives a useful baseline: 69% of journalists prefer pitches under 200 words, 50% say one follow-up is ideal, and 51% want it 3–7 days after the pitch.\n\n1. Instead of hoping a journalist finds your social post, send the news to the right person.\n2. Instead of hoping they open the attachment, put the release text in the email body.\n3. Instead of hoping length signals seriousness, keep the pitch under 200 words.\n4. Instead of chasing daily, follow up once, 3–7 days later.\n\nWhich \"hope\" is still in your team's media plan?\n\nMore on VRITIMES: https://www.vritimes.com/au?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_au_202612&utm_content=au_20261202_viral\n\n#VRITIMES #PRlife #MarketingAustralia #AusBiz #SmallBusinessAustralia\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": null, "mp4": "AU/AU_2026-12-02_Wed_VIRAL_reels_bye-bye-hope-a-journalist-sees-it/reel_draft.mp4", "script": "AU/AU_2026-12-02_Wed_VIRAL_reels_bye-bye-hope-a-journalist-sees-it/reel_script.md", "price": null}, {"id": "au_20261204_edu", "date": "2026-12-04", "day": "Fri", "pillar": "EDU", "format": "carousel", "title": "Press release embargoes, explained", "hook": "Embargoes can make your launch, or burn a media relationship. Here's how to use them properly. ⏰", "cta": "Save before your next launch", "times": {"linkedin": "08:00 AEDT", "instagram_facebook": "12:00 AEDT"}, "dir": "AU/AU_2026-12-04_Fri_EDU_carousel_press-release-embargoes-explained", "imgs": ["AU/AU_2026-12-04_Fri_EDU_carousel_press-release-embargoes-explained/slides/01.png", "AU/AU_2026-12-04_Fri_EDU_carousel_press-release-embargoes-explained/slides/02.png", "AU/AU_2026-12-04_Fri_EDU_carousel_press-release-embargoes-explained/slides/03.png", "AU/AU_2026-12-04_Fri_EDU_carousel_press-release-embargoes-explained/slides/04.png", "AU/AU_2026-12-04_Fri_EDU_carousel_press-release-embargoes-explained/slides/05.png", "AU/AU_2026-12-04_Fri_EDU_carousel_press-release-embargoes-explained/slides/06.png", "AU/AU_2026-12-04_Fri_EDU_carousel_press-release-embargoes-explained/slides/07.png", "AU/AU_2026-12-04_Fri_EDU_carousel_press-release-embargoes-explained/slides/08.png"], "cap": {"instagram": "Embargoes can make your launch, or burn a media relationship. Here's how to use them properly. ⏰\n\n01 It's an agreement, not a contract\n02 Use it for complex news that needs prep time\n03 Ask before you send the details\n04 Full date, time and timezone (AEDT!)\n05 Respect their workload: 62% of journalists took on more this year\n\nChecklist on slide 7.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #MediaRelations #PRtips #AusBiz #SmallBusinessAustralia #PRtips\n\nSources:\n• Muck Rack, State of Journalism 2025\n", "facebook": "Planning a launch? Here's how to use a press release embargo without upsetting journalists 👇\n\n01 It's an agreement, not a contract\n02 Use it for complex news that needs prep time\n03 Ask before you send the details\n04 Full date, time and timezone (AEDT!)\n05 Respect their workload: 62% of journalists took on more this year\n\nChecklist on slide 7.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/au?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_au_202612&utm_content=au_20261204_edu\n\n#VRITIMES #MediaRelations #PRtips\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "An embargo is one of the few tools that gives journalists more time to do a better story.\nUsed badly, it is also the fastest way to lose their trust.\n\nNewsrooms are stretched. Muck Rack's State of Journalism 2025 found 62% of journalists took on more responsibilities this year. An embargo helps when it gives them time to prepare; it hurts when it adds admin or confusion.\nHow we recommend using one:\n\n1. Reserve it for news that needs preparation: research, funding, launches with demos.\n2. Ask first. Share details only after the journalist agrees to the embargo.\n3. State the date, time and timezone in full, e.g. 6:00am AEDT, Tuesday 24 November 2026.\n4. Give reasonable lead time and send every asset in one package.\n5. Have a plan if it breaks early: publish your own version immediately.\n\nHave you had an embargo broken? What did you change afterwards?\n\nMore on VRITIMES: https://www.vritimes.com/au?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_au_202612&utm_content=au_20261204_edu\n\n#VRITIMES #MediaRelations #PRtips #AusBiz #SmallBusinessAustralia\n\nSources:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": "AU/AU_2026-12-04_Fri_EDU_carousel_press-release-embargoes-explained/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "au_20261207_edu", "date": "2026-12-07", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "PR calendar 2027 for Australian businesses", "hook": "Your 2027 PR calendar can be built today. 🗓️", "cta": "Save for your 2027 planning", "times": {"linkedin": "08:00 AEDT", "instagram_facebook": "12:00 AEDT"}, "dir": "AU/AU_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-australia", "imgs": ["AU/AU_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-australia/slides/01.png", "AU/AU_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-australia/slides/02.png", "AU/AU_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-australia/slides/03.png", "AU/AU_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-australia/slides/04.png", "AU/AU_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-australia/slides/05.png", "AU/AU_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-australia/slides/06.png", "AU/AU_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-australia/slides/07.png", "AU/AU_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-australia/slides/08.png", "AU/AU_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-australia/slides/09.png"], "cap": {"instagram": "Your 2027 PR calendar can be built today. 🗓️\n\nQ1: back-to-work news appetite, half-year results\nQ2: Federal Budget, EOFY (30 June)\nQ3: new financial year, partnerships & funding\nQ4: Black Friday, Cyber Monday, Christmas shutdown\n\nWorkflow: T-14 research → T-7 final release → T-3 pitch → Day 0 → T+3 recap.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #PRcalendar #Planning2027 #AusBiz #SmallBusinessAustralia #PRtips\n\nSources:\n• ASBFEO (2026)\n", "facebook": "Started on 2027 yet? Here's a quarter-by-quarter PR calendar for Australian businesses 👇\n\nQ1: back-to-work news appetite, half-year results\nQ2: Federal Budget, EOFY (30 June)\nQ3: new financial year, partnerships & funding\nQ4: Black Friday, Cyber Monday, Christmas shutdown\n\nWorkflow: T-14 research → T-7 final release → T-3 pitch → Day 0 → T+3 recap.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/au?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_au_202612&utm_content=au_20261207_edu\n\n#VRITIMES #PRcalendar #Planning2027\n\nSources:\n• ASBFEO (2026) — https://www.asbfeo.gov.au/contribution-australian-business-numbers\n", "linkedin": "The businesses that get coverage around big moments prepared their releases weeks earlier.\nA 2027 PR calendar framework for Australia.\n\nSmall businesses make up 97% of actively trading businesses in Australia (ASBFEO, 2026), and they all compete for the same news days. Preparation, not volume, decides who gets covered.\nA quarterly framework to adapt:\n\n1. Q1: the mid-January return to work, when newsrooms are hungry for news, plus half-year results.\n2. Q2: Federal Budget commentary (usually May) and EOFY angles.\n3. Q3: new financial year plans, hires and pricing, plus partnership and funding news.\n4. Q4: Black Friday and Cyber Monday, then publish before the Christmas shutdown.\n5. For every moment: T-14 research, T-7 final release, T-3 pitch, Day 0 publish, T+3 recap.\n\nWhich moment matters most for your business next year?\n\nMore on VRITIMES: https://www.vritimes.com/au?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_au_202612&utm_content=au_20261207_edu\n\n#VRITIMES #PRcalendar #Planning2027 #AusBiz #SmallBusinessAustralia\n\nSources:\n• ASBFEO (2026) — https://www.asbfeo.gov.au/contribution-australian-business-numbers\n"}, "sources": [{"name": "ASBFEO", "title": "Contribution to Australian business numbers", "year": 2026, "url": "https://www.asbfeo.gov.au/contribution-australian-business-numbers"}], "pdf": "AU/AU_2026-12-07_Mon_EDU_carousel_pr-calendar-2027-australia/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "au_20261209_fun", "date": "2026-12-09", "day": "Wed", "pillar": "FUN", "format": "reel", "title": "69% of Australians avoid the news sometimes or often", "hook": "69% of Australians avoid the news sometimes or often. Here's what that means for your announcement.", "cta": "Share with your comms team", "times": {"linkedin": "08:00 AEDT", "instagram_facebook": "19:30 AEDT"}, "dir": "AU/AU_2026-12-09_Wed_FUN_reels_australians-avoiding-the-news", "imgs": ["AU/AU_2026-12-09_Wed_FUN_reels_australians-avoiding-the-news/cover.png"], "cap": {"instagram": "69% of Australians avoid the news sometimes or often. Here's what that means for your announcement.\n\nDigital News Report: Australia 2025:\n• News avoidance: 69%\n• Trust in news: 43% (+3)\n• Social media has overtaken going direct to news sites\n\nIf people skim or skip, your news has to be clear, specific and easy to share.\n\nSave this and send it to your PR person. Link in bio.\n\n#VRITIMES #MediaAustralia #FunFact #AusBiz #SmallBusinessAustralia #PRtips\n\nSources:\n• University of Canberra, Digital News Report: Australia 2025\n• Reuters Institute, Digital News Report 2025\n", "facebook": "Fun fact: 69% of Australians avoid the news at least sometimes. Here's how to make your announcement worth stopping for.\n\nDigital News Report: Australia 2025:\n• News avoidance: 69%\n• Trust in news: 43% (+3)\n• Social media has overtaken going direct to news sites\n\nIf people skim or skip, your news has to be clear, specific and easy to share.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/au?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_au_202612&utm_content=au_20261209_fun\n\n#VRITIMES #MediaAustralia #FunFact\n\nSources:\n• University of Canberra, Digital News Report: Australia 2025 — https://www.canberra.edu.au/about-uc/media/media-releases/2025/june-2025/digital-news-report-dnr-australia-2025-shows-social-media-is-driving-changes-in-news-consumption-trends\n• Reuters Institute, Digital News Report 2025 — https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf\n", "linkedin": "News avoidance in Australia is 69%, according to the Digital News Report: Australia 2025.\nIf your audience is skimming, your announcement needs to work harder.\n\nThe same research found social media has overtaken going directly to news websites, while the Reuters Institute puts trust in news at 43%, up three points.\nFor business announcements, that suggests a few practical rules:\n\n1. Lead with one clear point in plain language.\n2. Use real numbers instead of adjectives.\n3. Make it easy to share: a clean web page, a strong image, a short summary.\n4. Reuse earned coverage on your own social channels, where people now find their news.\n\nHow are you adapting announcements for audiences who skim?\n\nMore on VRITIMES: https://www.vritimes.com/au?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_au_202612&utm_content=au_20261209_fun\n\n#VRITIMES #MediaAustralia #FunFact #AusBiz #SmallBusinessAustralia\n\nSources:\n• University of Canberra, Digital News Report: Australia 2025 — https://www.canberra.edu.au/about-uc/media/media-releases/2025/june-2025/digital-news-report-dnr-australia-2025-shows-social-media-is-driving-changes-in-news-consumption-trends\n• Reuters Institute, Digital News Report 2025 — https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf\n"}, "sources": [{"name": "University of Canberra", "title": "Digital News Report: Australia 2025 (media release)", "year": 2025, "url": "https://www.canberra.edu.au/about-uc/media/media-releases/2025/june-2025/digital-news-report-dnr-australia-2025-shows-social-media-is-driving-changes-in-news-consumption-trends"}, {"name": "Reuters Institute", "title": "Digital News Report 2025", "year": 2025, "url": "https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf"}], "pdf": null, "mp4": "AU/AU_2026-12-09_Wed_FUN_reels_australians-avoiding-the-news/reel_draft.mp4", "script": "AU/AU_2026-12-09_Wed_FUN_reels_australians-avoiding-the-news/reel_script.md", "price": null}, {"id": "au_20261211_promo", "date": "2026-12-11", "day": "Fri", "pillar": "PROMO", "format": "single", "title": "Get your news out before the Christmas shutdown", "hook": "The Christmas shutdown is a week away. Is your news out yet?", "cta": "Check current pricing via the link", "times": {"linkedin": "08:00 AEDT", "instagram_facebook": "12:00 AEDT"}, "dir": "AU/AU_2026-12-11_Fri_PROMO_single_publish-before-christmas-shutdown", "imgs": ["AU/AU_2026-12-11_Fri_PROMO_single_publish-before-christmas-shutdown/image.png"], "cap": {"instagram": "The Christmas shutdown is a week away. Is your news out yet?\n\nGet in before newsrooms wind down:\n✓ Published before the shutdown\n✓ Backlink to your launch/product page\n✓ Distribution report to review results\n\nCurrent plans & pricing: link in bio.\n\nCheck current plans & pricing via the link in bio.\n\n#VRITIMES #AusBiz #SmallBusinessAustralia #AusBiz #SmallBusinessAustralia #PRtips\n\nSources:\n• vritimes.com/au/service/pricing\n", "facebook": "Don't let your news land after everyone's gone to the beach. See VRITIMES plans here.\n\nGet in before newsrooms wind down:\n✓ Published before the shutdown\n✓ Backlink to your launch/product page\n✓ Distribution report to review results\n\nCurrent plans & pricing: link in bio.\n\nSave it and share it with your team 👇\nLearn more: https://www.vritimes.com/au?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_au_202612&utm_content=au_20261211_promo\n\n#VRITIMES #AusBiz #SmallBusinessAustralia\n\nSources:\n• vritimes.com/au/service/pricing — https://www.vritimes.com/au/service/pricing\n", "linkedin": "Announcements that land during the Christmas shutdown tend to disappear.\nIf it matters, publish before it.\n\nFrom mid-December, many Australian newsrooms run skeleton crews until mid-January. Releases that land before the wind-down have a better chance of being picked up and shared.\nWhat you can do this week with VRITIMES:\n\n1. Distribute your year-end results, holiday trading news or a January announcement with guaranteed media placement (count depends on plan).\n2. Point the backlink to your launch or product page.\n3. Use the distribution report to review results and plan Q1.\n\nCurrent plans and pricing are on our official page.\n\nMore on VRITIMES: https://www.vritimes.com/au?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_au_202612&utm_content=au_20261211_promo\n\n#VRITIMES #AusBiz #SmallBusinessAustralia #AusBiz #SmallBusinessAustralia\n\nSources:\n• vritimes.com/au/service/pricing — https://www.vritimes.com/au/service/pricing\n"}, "sources": [{"name": "VRITIMES", "title": "Pricing page (AU) — PRICE_UNVERIFIED in this run", "year": 2026, "url": "https://www.vritimes.com/au/service/pricing"}], "pdf": null, "mp4": null, "script": null, "price": "PRICE_UNVERIFIED"}]}, "TH": {"name": "Thailand", "grid": "TH/grid_preview_TH.png", "csv": "TH/00_calendar_TH.csv", "posts": [{"id": "th_20261116_edu", "date": "2026-11-16", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "ผ่ากายวิภาคข่าวประชาสัมพันธ์ที่บรรณาธิการเลือกลง", "hook": "ข่าวประชาสัมพันธ์ของคุณถูกอ่าน… หรือถูกเปิดแล้วปิดทันที? 👀", "cta": "บันทึกไว้เป็นเช็กลิสต์ก่อนส่งข่าว", "times": {"linkedin": "08:30 น.", "instagram_facebook": "12:00 น."}, "dir": "TH/TH_2026-11-16_Mon_EDU_carousel_kaiwiphak-khao-prachasamphan", "imgs": ["TH/TH_2026-11-16_Mon_EDU_carousel_kaiwiphak-khao-prachasamphan/slides/01.png", "TH/TH_2026-11-16_Mon_EDU_carousel_kaiwiphak-khao-prachasamphan/slides/02.png", "TH/TH_2026-11-16_Mon_EDU_carousel_kaiwiphak-khao-prachasamphan/slides/03.png", "TH/TH_2026-11-16_Mon_EDU_carousel_kaiwiphak-khao-prachasamphan/slides/04.png", "TH/TH_2026-11-16_Mon_EDU_carousel_kaiwiphak-khao-prachasamphan/slides/05.png", "TH/TH_2026-11-16_Mon_EDU_carousel_kaiwiphak-khao-prachasamphan/slides/06.png", "TH/TH_2026-11-16_Mon_EDU_carousel_kaiwiphak-khao-prachasamphan/slides/07.png", "TH/TH_2026-11-16_Mon_EDU_carousel_kaiwiphak-khao-prachasamphan/slides/08.png"], "cap": {"instagram": "ข่าวประชาสัมพันธ์ของคุณถูกอ่าน… หรือถูกเปิดแล้วปิดทันที? 👀\n\nบรรณาธิการตัดสินใจในไม่กี่วินาที นี่คือโครงสร้างของข่าวที่ได้ลง:\n\n01 พาดหัว = ข่าว (ใคร + ทำอะไร + ผลลัพธ์)\n02 ย่อหน้าแรกตอบ 5W1H ในสองประโยค\n03 คำพูดอ้างอิงที่มีมุมมอง ไม่ใช่แค่ “ภูมิใจ”\n04 เนื้อข่าว: ปิรามิดหัวกลับ ตัวเลข ภาพ ผู้ติดต่อ\n05 boilerplate 3 ประโยคที่อัปเดตเสมอ\n\nนักข่าว 72% ยังมองว่าข่าวประชาสัมพันธ์คือสิ่งที่มีประโยชน์ที่สุดจากทีม PR (Cision, 2025)\n\nกดบันทึกไว้ แล้วส่งต่อให้ทีมการตลาด/PR ของคุณ ลิงก์อยู่ในไบโอ\n\n#VRITIMES #ข่าวประชาสัมพันธ์ #PRtips #ข่าวประชาสัมพันธ์ #SMEไทย #PRtips\n\nแหล่งที่มา:\n• Cision, State of the Media 2025\n", "facebook": "ก่อนกดส่งข่าวประชาสัมพันธ์ ลองเช็กโครงสร้างทั้ง 5 ส่วนนี้ก่อน ส่วนเหล่านี้ตัดสินว่าบรรณาธิการจะเลือกลงหรือไม่ 👇\n\nบรรณาธิการตัดสินใจในไม่กี่วินาที นี่คือโครงสร้างของข่าวที่ได้ลง:\n\n01 พาดหัว = ข่าว (ใคร + ทำอะไร + ผลลัพธ์)\n02 ย่อหน้าแรกตอบ 5W1H ในสองประโยค\n03 คำพูดอ้างอิงที่มีมุมมอง ไม่ใช่แค่ “ภูมิใจ”\n04 เนื้อข่าว: ปิรามิดหัวกลับ ตัวเลข ภาพ ผู้ติดต่อ\n05 boilerplate 3 ประโยคที่อัปเดตเสมอ\n\nนักข่าว 72% ยังมองว่าข่าวประชาสัมพันธ์คือสิ่งที่มีประโยชน์ที่สุดจากทีม PR (Cision, 2025)\n\nบันทึกไว้และแชร์ให้ทีมของคุณ 👇\nดูเพิ่มเติม: https://www.vritimes.com/th?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_th_202611&utm_content=th_20261116_edu\n\n#VRITIMES #ข่าวประชาสัมพันธ์ #PRtips\n\nแหล่งที่มา:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n", "linkedin": "นักข่าว 72% ระบุว่าข่าวประชาสัมพันธ์คือทรัพยากรที่มีประโยชน์ที่สุดจากทีม PR\nปัญหาจึงไม่ใช่รูปแบบ แต่คือข่าวส่วนใหญ่ยังเอาไปใช้ต่อทันทีไม่ได้\n\nผลสำรวจ State of the Media 2025 ของ Cision (นักข่าวกว่า 3,000 คนใน 19 ประเทศ) มักถูกอ้างว่า “ข่าวประชาสัมพันธ์ยังได้ผล” แต่อีกด้านที่ไม่ค่อยถูกพูดถึงคือ นักข่าวเลือกใช้ข่าวที่ช่วยลดงาน ไม่ใช่ข่าวที่เพิ่มงาน\nข่าวที่ได้ลงมักมีโครงสร้างคล้ายกัน:\n\n1. พาดหัวเป็นข่าว: ใคร ทำอะไร ผลลัพธ์คืออะไร มีตัวเลขหรือสถานที่\n2. ย่อหน้าแรกตอบ 5W1H ภายในสองประโยค\n3. คำพูดอ้างอิงมีมุมมองหรือข้อมูล ไม่ใช่ถ้อยคำแสดงความภูมิใจ\n4. เนื้อข่าวเรียงแบบปิรามิดหัวกลับ มีตัวเลขเปรียบเทียบ ภาพความละเอียดสูง และผู้ติดต่อที่ตอบจริง\n5. boilerplate 3 ประโยคที่อัปเดตทุกไตรมาส\n\nทีมของคุณมักพลาดส่วนไหนบ่อยที่สุด พาดหัว ย่อหน้าแรก หรือคำพูดอ้างอิง? ดูฉบับเต็มได้ใน PDF ด้านบน\n\nข้อมูลเพิ่มเติมเกี่ยวกับ VRITIMES: https://www.vritimes.com/th?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_th_202611&utm_content=th_20261116_edu\n\n#VRITIMES #ข่าวประชาสัมพันธ์ #PRtips #ข่าวประชาสัมพันธ์ #SMEไทย\n\nแหล่งที่มา:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n"}, "sources": [{"name": "Cision", "title": "2025 State of the Media Report (press release, 7 May 2025)", "year": 2025, "url": "https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/"}], "pdf": "TH/TH_2026-11-16_Mon_EDU_carousel_kaiwiphak-khao-prachasamphan/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "th_20261118_fun", "date": "2026-11-18", "day": "Wed", "pillar": "FUN", "format": "carousel", "title": "ข่าวประชาสัมพันธ์ฉบับแรกเกิดจากอุบัติเหตุรถไฟ", "hook": "ข่าวประชาสัมพันธ์ฉบับแรกของโลกเกิดจาก… อุบัติเหตุรถไฟ 🚆", "cta": "แชร์ให้เพื่อนสาย PR", "times": {"linkedin": "08:30 น.", "instagram_facebook": "20:00 น."}, "dir": "TH/TH_2026-11-18_Wed_FUN_carousel_khao-prachasamphan-chabap-raek-1906", "imgs": ["TH/TH_2026-11-18_Wed_FUN_carousel_khao-prachasamphan-chabap-raek-1906/slides/01.png", "TH/TH_2026-11-18_Wed_FUN_carousel_khao-prachasamphan-chabap-raek-1906/slides/02.png", "TH/TH_2026-11-18_Wed_FUN_carousel_khao-prachasamphan-chabap-raek-1906/slides/03.png", "TH/TH_2026-11-18_Wed_FUN_carousel_khao-prachasamphan-chabap-raek-1906/slides/04.png", "TH/TH_2026-11-18_Wed_FUN_carousel_khao-prachasamphan-chabap-raek-1906/slides/05.png", "TH/TH_2026-11-18_Wed_FUN_carousel_khao-prachasamphan-chabap-raek-1906/slides/06.png"], "cap": {"instagram": "ข่าวประชาสัมพันธ์ฉบับแรกของโลกเกิดจาก… อุบัติเหตุรถไฟ 🚆\n\n28 ตุลาคม 1906 ที่ Atlantic City สหรัฐฯ\nบริษัทรถไฟยุคนั้นมักเงียบและกันนักข่าวออกไป\n\nIvy Lee กลับเขียนแถลงการณ์และแจกให้สื่อเอง\nThe New York Times ตีพิมพ์แบบคำต่อคำเมื่อ 30 ตุลาคม 1906\n\nบทเรียนที่ยังจริงอยู่: พูดก่อน ใช้ข้อเท็จจริง ทำให้งานนักข่าวง่ายขึ้น\n\nกดบันทึกไว้ แล้วส่งต่อให้ทีมการตลาด/PR ของคุณ ลิงก์อยู่ในไบโอ\n\n#VRITIMES #ประวัติศาสตร์PR #FunFact #ข่าวประชาสัมพันธ์ #SMEไทย #PRtips\n\nแหล่งที่มา:\n• Billy Penn (2023); Museum of Public Relations\n", "facebook": "เกร็ดความรู้สำหรับคนทำการตลาดและ PR: ข่าวประชาสัมพันธ์ฉบับแรกเกิดขึ้นในปี 1906 จากอุบัติเหตุรถไฟ อ่านเรื่องราวได้ในคารูเซลนี้ 👇\n\n28 ตุลาคม 1906 ที่ Atlantic City สหรัฐฯ\nบริษัทรถไฟยุคนั้นมักเงียบและกันนักข่าวออกไป\n\nIvy Lee กลับเขียนแถลงการณ์และแจกให้สื่อเอง\nThe New York Times ตีพิมพ์แบบคำต่อคำเมื่อ 30 ตุลาคม 1906\n\nบทเรียนที่ยังจริงอยู่: พูดก่อน ใช้ข้อเท็จจริง ทำให้งานนักข่าวง่ายขึ้น\n\nบันทึกไว้และแชร์ให้ทีมของคุณ 👇\nดูเพิ่มเติม: https://www.vritimes.com/th?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_th_202611&utm_content=th_20261118_fun\n\n#VRITIMES #ประวัติศาสตร์PR #FunFact\n\nแหล่งที่มา:\n• Billy Penn (2023); Museum of Public Relations — https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/\n", "linkedin": "ข่าวประชาสัมพันธ์ที่มักถูกเรียกว่าฉบับแรก ไม่ได้มาจากการเปิดตัวสินค้า แต่มาจากวิกฤต\nและบทเรียนนั้นยังใช้ได้กับธุรกิจวันนี้\n\nตุลาคม 1906 รถไฟของบริษัทในเครือ Pennsylvania Railroad ตกจากสะพานที่ Atlantic City ธรรมเนียมของอุตสาหกรรมตอนนั้นคือปิดข้อมูลและไม่ให้สัมภาษณ์\nIvy Lee ทำตรงกันข้าม เขาเขียนแถลงการณ์อย่างเป็นทางการ แจกให้นักข่าว และเปิดให้เข้าพื้นที่ The New York Times ตีพิมพ์แบบคำต่อคำเมื่อ 30 ตุลาคม 1906\nหลักสามข้อที่ยังเห็นผลจนถึงวันนี้:\n\n1. ใครพูดก่อนด้วยข้อเท็จจริง คนนั้นกำหนดกรอบของเรื่อง\n2. แถลงการณ์ที่หยิบไปอ้างได้ทันที ถูกใช้มากกว่าคำกล่าวอ้าง\n3. การอำนวยความสะดวกให้นักข่าวคือกลยุทธ์ ไม่ใช่ของแถม\n\nคุณคิดว่าแบรนด์มักละเลยหลักข้อไหนมากที่สุดเวลาเกิดวิกฤต?\n\nข้อมูลเพิ่มเติมเกี่ยวกับ VRITIMES: https://www.vritimes.com/th?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_th_202611&utm_content=th_20261118_fun\n\n#VRITIMES #ประวัติศาสตร์PR #FunFact #ข่าวประชาสัมพันธ์ #SMEไทย\n\nแหล่งที่มา:\n• Billy Penn (2023); Museum of Public Relations — https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/\n"}, "sources": [{"name": "Billy Penn / Museum of Public Relations", "title": "Ivy Lee, the 1906 Atlantic City train wreck and the first press release", "year": 2023, "url": "https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/"}], "pdf": "TH/TH_2026-11-18_Wed_FUN_carousel_khao-prachasamphan-chabap-raek-1906/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "th_20261120_viral", "date": "2026-11-20", "day": "Fri", "pillar": "VIRAL", "format": "reel", "title": "POV: ส่งข่าวประชาสัมพันธ์เป็นไฟล์ PDF แนบ", "hook": "POV: คุณส่งข่าวประชาสัมพันธ์เป็นไฟล์ PDF แนบ 📎😶", "cta": "ส่งต่อให้ทีมที่ยังแนบ PDF", "times": {"linkedin": "08:30 น.", "instagram_facebook": "20:00 น."}, "dir": "TH/TH_2026-11-20_Fri_VIRAL_reels_pov-song-khao-pen-pdf", "imgs": ["TH/TH_2026-11-20_Fri_VIRAL_reels_pov-song-khao-pen-pdf/cover.png"], "cap": {"instagram": "POV: คุณส่งข่าวประชาสัมพันธ์เป็นไฟล์ PDF แนบ 📎😶\n\nดาวน์โหลด → เปิด → คัดลอก ทุกขั้นตอนที่เพิ่มขึ้นคือโอกาสที่หายไป\nนักข่าว 69% ชอบ pitch ไม่เกิน 200 คำ (Muck Rack, 2025)\n\nทำแบบนี้แทน:\n✓ ใส่เนื้อข่าวในตัวอีเมล\n✓ ใช้พาดหัวข่าวเป็นหัวข้ออีเมล\n✓ ส่งภาพและเอกสารเป็นลิงก์\n\nกดบันทึกไว้ แล้วส่งต่อให้ทีมการตลาด/PR ของคุณ ลิงก์อยู่ในไบโอ\n\n#VRITIMES #ชีวิตคนทำPR #ข่าวประชาสัมพันธ์ #ข่าวประชาสัมพันธ์ #SMEไทย #PRtips\n\nแหล่งที่มา:\n• Muck Rack, State of Journalism 2025\n", "facebook": "ใครยังส่งข่าวประชาสัมพันธ์เป็น PDF แนบบ้าง 😅 ดูให้จบ มีวิธีที่นักข่าวชอบมากกว่า\n\nดาวน์โหลด → เปิด → คัดลอก ทุกขั้นตอนที่เพิ่มขึ้นคือโอกาสที่หายไป\nนักข่าว 69% ชอบ pitch ไม่เกิน 200 คำ (Muck Rack, 2025)\n\nทำแบบนี้แทน:\n✓ ใส่เนื้อข่าวในตัวอีเมล\n✓ ใช้พาดหัวข่าวเป็นหัวข้ออีเมล\n✓ ส่งภาพและเอกสารเป็นลิงก์\n\nบันทึกไว้และแชร์ให้ทีมของคุณ 👇\nดูเพิ่มเติม: https://www.vritimes.com/th?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_th_202611&utm_content=th_20261120_viral\n\n#VRITIMES #ชีวิตคนทำPR #ข่าวประชาสัมพันธ์\n\nแหล่งที่มา:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "นิสัยเล็กๆ ที่ทำให้ข่าวดีๆ ไม่ถูกอ่าน คือการส่งเป็นไฟล์ PDF แนบ\nฟังดูไม่สำคัญ แต่ผลกระทบไม่เล็ก\n\nMuck Rack (State of Journalism 2025) พบว่านักข่าว 69% ชอบ pitch ที่สั้นไม่เกิน 200 คำ นักข่าวต้องการตัดสินใจเร็วโดยไม่มีขั้นตอนเพิ่ม\nไฟล์ PDF แนบเพิ่มขั้นตอนถึงสามขั้น คือดาวน์โหลด เปิด และคัดลอก เมื่อรวมกับหัวข้ออีเมลกว้างๆ โอกาสถูกอ่านยิ่งลดลง\n\n1. วางเนื้อข่าวในตัวอีเมลโดยตรง\n2. ใช้พาดหัวข่าวเป็นหัวข้ออีเมล\n3. ส่งภาพและเอกสารประกอบเป็นลิงก์\n4. หากใช้แพลตฟอร์มกระจายข่าว ให้ข่าวอยู่บนหน้าเว็บที่เข้าถึงและอ้างอิงได้\n\nองค์กรของคุณยังยืนยันให้ส่ง PDF เพราะดู “เป็นทางการกว่า” หรือไม่?\n\nข้อมูลเพิ่มเติมเ ังส่ง\nเทมเพลตเต็มอยู่สไลด์ที่ 6\n\nกดบันทึกไว้ แล้วส่งต่อให้ทีมการตลาด/PR ของคุณ ลิงก์อยู่ในไบโอ\n\n#VRITIMES #MediaRelations #PRtips #ข่าวประชาสัมพันธ์ #SMEไทย #PRtips\n\nแหล่งที่มา:\n• Muck Rack, State of Journalism 2025\n", "facebook": "เทมเพลตอีเมล pitch ไม่เกิน 200 คำ แค่ 4 บรรทัด ทีมของคุณใช้ได้ทันที 👇\n\nโครงสร้าง 4 บรรทัด:\n1️⃣ ทำไมเกี่ยวกับคอลัมน์ของเขา\n2️⃣ ข่าวในประโยคเดียว + ตัวเลข\n3️⃣ สิ่งที่เสนอได้: ข้อมูล ผู้ให้สัมภาษณ์ ภาพ\n4️⃣ ลิงก์ข่าว + ช่องทางติดต่อ\n\nตามงาน? ครั้งเดียว 3–7 วันหลังส่ง\nเทมเพลตเต็มอยู่สไลด์ที่ 6\n\nบันทึกไว้และแชร์ให้ทีมของคุณ 👇\nดูเพิ่มเติม: https://www.vritimes.com/th?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_th_202611&utm_content=th_20261123_edu\n\n#VRITIMES #MediaRelations #PRtips\n\nแหล่งที่มา:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "pitch ที่นักข่าวตอบกลับ มักสั้นกว่าที่คุณคิด\nMuck Rack พบว่านักข่าว 69% ชอบ pitch ไม่เกิน 200 คำ\n\nความผิดพลาดที่พบบ่อยที่สุดคือการวางข่าวทั้งฉบับลงใน pitch ทั้งที่ pitch เป็นเพียงคำเชิญให้อ่าน\nข้อมูลเดียวกันจาก Muck Rack State of Journalism 2025 ยังตอบเรื่องการตามงาน: นักข่าว 50% มองว่าตามครั้งเดียวกำลังดี และ 51% อยากให้เว้น 3–7 วัน\nโครงสร้าง 4 บรรทัดที่ทีมใช้ได้ทันที:\n\n1. ความเกี่ยวข้อง: ทำไมเรื่องนี้เหมาะกับคอลัมน์หรือผู้อ่าน\n2. ข่าวในประโยคเดียว พร้อมตัวเลข\n3. ข้อเสนอ: ข้อมูล ผู้ให้สัมภาษณ์ หรือภาพที่พร้อมแล้ว\n4. ลิงก์ข่าวฉบับเต็มและผู้ติดต่อที่ตอบจริง\n\nเทมเพลตเต็มอยู่สไลด์ที่ 6 ตอนนี้ pitch ของทีมคุณยาวประมาณเท่าไร?\n\nข้อมูลเพิ่มเติมเกี่ยวกับ VRITIMES: https://www.vritimes.com/th?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_th_202611&utm_content=th_20261123_edu\n\n#VRITIMES #MediaRelations #PRtips #ข่าวประชาสัมพันธ์ #SMEไทย\n\nแหล่งที่มา:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "yea  3–7 วันหลังส่ง\n• เห็นข่าวตัวเองได้ลง = ฟินทั้งวัน\n\nข้อไหนคือคุณ? คอมเมนต์เลย 👇\n\nบันทึกไว้และแชร์ให้ทีมของคุณ 👇\nดูเพิ่มเติม: https://www.vritimes.com/th?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_th_202612&utm_content=th_20261202_viral\n\n#VRITIMES #ชีวิตคนทำPR #การตลาด\n\nแหล่งที่มา:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "คลิปขำๆ เกี่ยวกับนิสัยคนทำ PR แต่เบื้องหลังคือแนวปฏิบัติที่มีข้อมูลรองรับ\n\nนิสัยที่ดูเหมือน “เยอะ” ของคนทำ PR หลายข้อ จริงๆ แล้วสอดคล้องกับสิ่งที่นักข่าวต้องการ ในวันที่นักข่าวต้องรับงานมากขึ้น ความละเอียดของทีม PR ช่วยลดภาระของกองบรรณาธิการได้จริง\nMuck Rack State of Journalism 2025 ให้ตัวเลขที่ใช้อ้างอิงได้:\n\n1. นักข่าว 69% ชอบ pitch ไม่เกิน 200 คำ\n2. 50% บอกว่าตามงานครั้งเดียวกำลังดี\n3. 51% อยากให้ตามงานหลังส่ง 3–7 วัน\n4. ย่อหน้าแรกที่ตอบ 5W1H ช่วยให้บรรณาธิการตัดสินใจได้เร็ว\n\nนิสัยไหนของคุณที่คนรอบตัวว่าเยอะ แต่ได้ผลจริง? เล่าให้ฟังในคอมเมนต์ได้เลย เผื่อเป็นไอเดียให้คนทำ PR คนอื่นนำไปใช้ต่อ\n\nข้อมูลเพิ่มเติมเกี่ยวกับ VRITIMES: https://www.vritimes.com/th?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_th_202612&utm_content=th_20261202_viral\n\n#VRITIMES #ชีวิตคนทำPR #การตลาด #ข่าวประชาสัมพันธ์ #SMEไทย\n\nแหล่งที่มา:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": null, "mp4": "TH/TH_2026-12-02_Wed_VIRAL_reels_mai-mi-khrai-tham-khon-tham-pr/reel_draft.mp4", "script": "TH/TH_2026-12-02_Wed_VIRAL_reels_mai-mi-khrai-tham-khon-tham-pr/reel_script.md", "price": null}, {"id": "th_20261204_edu", "date": "2026-12-04", "day": "Fri", "pillar": "EDU", "format": "carousel", "title": "เขียน boilerplate ให้นักข่าวคัดลอกไปใช้ได้ทันที", "hook": "ย่อหน้าที่ st-technology-and-pr-journalist-partnerships-302448410/\n", "linkedin": "boilerplate คือย่อหน้าที่ถูกคัดลอกไปใช้บ่อยที่สุดในข่าวประชาสัมพันธ์\nแต่หลายบริษัทไม่ได้อัปเดตมาหลายปี\n\nCision (2025) พบว่านักข่าว 72% มองว่าข่าวประชาสัมพันธ์คือทรัพยากรที่มีประโยชน์ที่สุดจากทีม PR ส่วนหนึ่งเพราะมีข้อมูลที่หยิบไปใช้ได้ทันที และ boilerplate คือส่วนที่ถูกใช้แบบนั้นมากที่สุด\nสูตรที่เราแนะนำ:\n\n1. เราคือใคร ในหนึ่งประโยค\n2. ปีที่ก่อตั้งและที่ตั้ง\n3. ขนาดธุรกิจที่ตรวจสอบได้ เช่น จำนวนสาขาหรือพนักงาน\n4. จุดต่างที่สำคัญหนึ่งข้อ\n5. เว็บไซต์ทางการ\n6. ตัดคำโฆษณาอย่าง “ผู้นำระดับโลก” และอัปเดตทุกไตรมาส\n\nboilerplate ของบริษัทคุณอัปเดตครั้งล่าสุดเมื่อไร?\n\nข้อมูลเพิ่มเติมเกี่ยวกับ VRITIMES: https://www.vritimes.com/th?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_th_202612&utm_content=th_20261204_edu\n\n#VRITIMES #เขียนข่าว #PRtips #ข่าวประชาสัมพันธ์ #SMEไทย\n\nแหล่งที่มา:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n"}, "sources": [{"name": "Cision", "title": "2025 State of the Media Report (press release, 7 May 2025)", "year": 2025, "url": "https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/"}], "pdf": "TH/TH_2026-12-04_Fri_EDU_carousel_khian-boilerplate/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "th_20261207_edu", "date": "2026-12-07", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "ปฏิทิน PR ปี 2570 สำหรับแบรนด์ไทย", "hook": "ปฏิทิน PR ปี 2570 เริ่มวางได้ตั้งแต่วันนี้ 🗓️", "cta": "บันทึกไว้วางแผนปีหน้า", "times": {"linkedin": "08:30 น.", "instagram_facebook": "12:00 น."}, "dir": "TH/TH_2026-12-07_Mon_EDU_carousel_pathithin-pr-2570", "imgs": ["TH/TH_2026-12-07_Mon_EDU_carousel_pathithin-pr-2570/s : ตรุษจีน (วันที่ปี 2570 เป็นการประมาณ) และสรุปผลงานประจำปี\n2. Q2: สงกรานต์ ส่งข่าวก่อนวันหยุดยาว และข้อมูลครึ่งปี\n3. Q3: วันแม่แห่งชาติ พร้อมข่าวความร่วมมือและการระดมทุน\n4. Q4: 11.11 และ 12.12 แล้วตามด้วยวันพ่อและวันหยุดปลายปี ส่งข่าวล่วงหน้า\n5. ทุกโมเมนต์: T-14 หาข้อมูล T-7 ข่าวสมบูรณ์ T-3 pitch วันจริงเผยแพร่ T+3 สรุปผล\n\nโมเมนต์ไหนสำคัญที่สุดสำหรับแบรนด์ของคุณในปีหน้า?\n\nข้อมูลเพิ่มเติมเกี่ยวกับ VRITIMES: https://www.vritimes.com/th?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_th_202612&utm_content=th_20261207_edu\n\n#VRITIMES #ปฏิทินPR #วางแผน2027 #ข่าวประชาสัมพันธ์ #SMEไทย\n\nแหล่งที่มา:\n• สสว. ผ่านฐานเศรษฐกิจ (2569) — https://www.thansettakij.com/economy/668484\n"}, "sources": [{"name": "ฐานเศรษฐกิจ (อ้างอิง สสว.)", "title": "สสว. เผย GDP MSME ปี 2568", "year": 2026, "url": "https://www.thansettakij.com/economy/668484"}], "pdf": "TH/TH_2026-12-07_Mon_EDU_carousel_pathithin-pr-2570/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "th_20261209_fun", "date": "2026-12-09", "day": "Wed", "pillar": "FUN", "format": "reel", "title": "คนไทยรับข่าวจากไหน และเชื่อข่าวแค่ไหน", "hook": "คนไทย 49% ใช้ TikTok ดูข่าว และ 55% เชื่อถือข่าวส่วนใหญ่ 📱", "cta": "แชร์ให้ทีมโซเชียลมีเดีย", "times": {"linkedin": "08:30 น.", "instagram_facebook": "20:00 น."}, "dir": "TH/TH_2026-12-09_Wed_FUN_reels_khon-thai-rap-khao-jak-nai", "imgs": ["TH/TH_2026-12-09_Wed_FUN_reels_khon-thai-rap-khao-jak-nai/cover.png"], "cap": {"instagram": "คนไทย 49% ใช้ TikTok ดูข่าว และ 55% เชื่อถือข่าวส่วนใหญ่ 📱\n\nReuters Institute Digital News Report 2025:\n• 49% ใช้ TikTok เพื่อรับข่าว\n• 43% ชอบดูข่าวออนไลน์มากกว่าอ่าน (32%)\n• 55% เชื่อถือข่าวส่วนใหญ่ เกือบตลอดเวลา\n\nความน่าเชื่อถือมาจากสื่อ การเข้าถึงมาจากวิดีโอสั้น แบรนด์ต้องมีทั้งสองอย่าง\n\nกดบันทึกไว้ แล้วส่งต่อให้ทีมการตลาด/PR ของคุณ ลิงก์อยู่ในไบโอ\n\n#VRITIMES #สื่อไทย #FunFact #ข่าวประชาสัมพันธ์ #SMEไทย #PRtips\n\nแหล่งที่มา:\n• Reuters Institute, Digital News Report 2025\n", "facebook": "รู้หรือไม่: คนไทย 49% ดูข่าวผ่าน TikTok และระดับความเชื่อถือข่าวของไทยสูงที่สุดในภูมิภาคที่เราทำงานด้วย ดูให้จบ 👀\n\nReuters Institute Digital News Report 2025:\n• 49% ใช้ TikTok เพื่อรับข่าว\n• 43% ชอบดูข่าวออนไลน์มากกว่าอ่าน (32%)\n• 55% เชื่อถือข่าวส่วนใหญ่ เกือบตลอดเวลา\n\nความน่าเชื่อถือมาจากสื่อ การเข้าถึงมาจากวิดีโอสั้น แบรนด์ต้องมีทั้งสองอย่าง\n\nบันทึกไว้และแชร์ให้ทีมของคุณ 👇\nดูเพิ่มเติม: https://www.vritimes.com/th?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_th_202612&utm_content=th_20261209_fun\n\n#VRITIMES #สื่อไทย #FunFact\n\nแหล่งที่มา:\n• Reuters Institute, Digital News Report 2025 — https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf\n", "linkedin": "ตาม Reuters Institute Digital News Report 2025 คนไทย 49% ใช้ TikTok รับข่าว และ 55% เชื่อถือข่าวส่วนใหญ่ สูงที่สุดในหกตลาดเอเชียแปซิฟิกที่เราทำงานด้วย\nสิ่งนี้มีความหมายอย่างไรต่อการสื่อสารของแบรนด์?\n\nรายงานเดียวกันพบว่า 43% ชอบดูข่าวออนไลน์มากกว่าอ่าน (32%) ผู้ชมค้นพบเรื่องราวผ่านวิดีโอ แต่ยังให้ความเชื่อถือสื่อในระดับสูง\nสำหรับแบรนด์ แนวทางที่ใช้ได้จริงคือ:\n\n1. ให้ข่าวได้ลงสื่อที่น่าเชื่อถือก่อน เพื่อมีแหล่งอ้างอิง\n2. นำข่าวที่ได้ลงมาเล่าต่อในรูปแบบวิดีโอสั้น\n3. ใช้ข้อความหลักเดียวกันทั้งบนสื่อและโซเชียล\n\nทีมของคุณนำข่าวที่ได้ลงสื่อมาใช้ต่อบนโซเชียลอย่างไร?\n\nข้อมูลเพิ่มเติมเกี่ยวกับ VRITIMES: https://www.vritimes.com/th?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_th_202612&utm_content=th_20261209_fun\n\n#VRITIMES #สื่อไทย #FunFact #ข่าวประชาสัมพันธ์ #SMEไทย\n\nแหล่งที่มา:\n• Reuters Institute, Digital News Report 2025 — https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf\n"}, "sources": [{"name": "Reuters Institute", "title": "Digital News Report 2025", "year": 2025, "url": "https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2025-06/Digital_News-Report_2025.pdf"}], "pdf": null, "mp4": "TH/TH_2026-12-09_Wed_FUN_reels_khon-thai-rap-khao-jak-nai/reel_draf on_EDU_carousel_giai-phau-thong-cao-bao-chi/slides/08.png"], "cap": {"instagram": "Thông cáo báo chí của bạn được biên tập viên đọc… hay chỉ mở ra rồi đóng lại? 👀\n\nBiên tập viên quyết định trong vài giây. Đây là cấu trúc của những thông cáo được đăng:\n\n01 Tiêu đề = tin tức (chủ thể + hành động + tác động)\n02 Mở đầu trả lời 5W1H trong hai câu\n03 Một trích dẫn có quan điểm, không phải \"vô cùng tự hào\"\n04 Thân bài: kim tự tháp ngược, số liệu, ảnh, liên hệ\n05 Boilerplate 3 câu luôn được cập nhật\n\n72% nhà báo vẫn coi thông cáo báo chí là nguồn hữu ích nhất từ đội PR (Cision, 2025).\n\nLưu bài này và gửi cho người phụ trách PR của bạn. Link ở bio.\n\n#VRITIMES #thongcaobaochi #PRtips #thongcaobaochi #PR #doanhnghiepnhovavua\n\nNguồn:\n• Cision, State of the Media 2025\n", "facebook": "Trước khi bấm \"gửi\", hãy đối chiếu thông cáo báo chí của bạn với 5 phần quyết định việc biên tập viên có đăng hay không 👇\n\nBiên tập viên quyết định trong vài giây. Đây là cấu trúc của những thông cáo được đăng:\n\n01 Tiêu đề = tin tức (chủ thể + hành động + tác động)\n02 Mở đầu trả lời 5W1H trong hai câu\n03 Một trích dẫn có quan điểm, không phải \"vô cùng tự hào\"\n04 Thân bài: kim tự tháp ngược, số liệu, ảnh, liên hệ\n05 Boilerplate 3 câu luôn được cập nhật\n\n72% nhà báo vẫn coi thông cáo báo chí là nguồn hữu ích nhất từ đội PR (Cision, 2025).\n\nLưu lại và chia sẻ cho đội ngũ của bạn 👇\nXem thêm: https://www.vritimes.com/vn?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_vn_202611&utm_content=vn_20261116_edu\n\n#VRITIMES #thongcaobaochi #PRtips\n\nNguồn:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n", "linkedin": "72% nhà báo cho rằng thông cáo báo chí là nguồn hữu ích nhất mà đội PR cung cấp.\nVấn đề không nằm ở định dạng, mà ở chỗ phần lớn thông cáo chưa thể dùng ngay.\n\nBáo cáo State of the Media 2025 của Cision (khảo sát hơn 3.000 nhà báo tại 19 quốc gia) thường được trích dẫn như bằng chứng \"thông cáo vẫn hiệu quả\". Điều ít được nhắc tới: nhà báo dùng những thông cáo giúp họ bớt việc, chứ không phải thêm việc.\nNhững thông cáo được đăng thường có chung một cấu trúc:\n\n1. Tiêu đề là tin tức: chủ thể, hành động, tác động, có con số hoặc địa danh.\n2. Đoạn mở đầu trả lời 5W1H trong hai câu.\n3. Trích dẫn mang quan điểm hoặc số liệu, không phải lời bày tỏ tự hào.\n4. Thân bài theo kim tự tháp ngược, có số liệu so sánh, ảnh chất lượng cao và đầu mối liên hệ thực sự phản hồi.\n5. Boilerplate ba câu, cập nhật mỗi quý.\n\nĐội ngũ của bạn hay bỏ sót phần nào nhất: tiêu đề, mở đầu hay trích dẫn? Bản đầy đủ nằm trong file PDF phía trên.\n\nTìm hiểu VRITIMES: https://www.vritimes.com/vn?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_vn_202611&utm_content=vn_20261116_edu\n\n#VRITIMES #thongcaobaochi #PRtips #thongcaobaochi #PR\n\nNguồn:\n• Cision, State of the Media 2025 — https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/\n"}, "sources": [{"name": "Cision", "title": "2025 State of the Media Report (press release, 7 May 2025)", "year": 2025, "url": "https://www.cision.com/about/press-releases/2025-press-releases/cisions-2025-state-of-the-media-report-reveals-a-tipping-point-for-trust-technology-and-pr-journalist-partnerships-302448410/"}], "pdf": "VN/VN_2026-11-16_Mon_EDU_carousel_giai-phau-thong-cao-bao-chi/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "vn_20261118_fun", "date": "2026-11-18", "day": "Wed", "pillar": "FUN", "format": "carousel", "title": "Thông cáo báo chí đầu tiên ra đời từ một vụ tai nạn tàu hoả", "hook": "Thông cáo báo chí đầu tiên trên thế giới ra đời từ… một vụ tai nạn tàu hoả. 🚆", "cta": "Chia sẻ cho bạn bè làm PR", "times": {"linkedin": "08:30 (GMT+7)", "instagram_facebook": "20:00 (GMT+7)"}, "dir": "VN/VN_2026-11-18_Wed_FUN_carousel_thong-cao-bao-chi-dau-tien-1906", "imgs": ["VN/VN_2026-11-18_Wed_FUN_carousel_thong-cao-bao-chi-dau-tien-1906/slides/01.png", "VN/VN_2026-11-18_Wed_FUN_carousel_thong-cao-bao-chi-dau-tien-1906/slides/02.png", "VN/VN_2026-11-18_Wed_FUN_carousel_thong-cao-bao-chi-dau-tien-1906/slides/03.png", "VN/VN_2026-11-18_Wed_FUN_carousel_thong-cao-bao-chi-dau-tien-1906/slides/04.png", "VN/VN_2026-11-18_Wed_FUN_carousel_thong-cao-bao-chi-dau-tien-1906/slides/05.png", "VN/VN_2026-11-18_Wed_FUN_carousel_thong-cao-bao-chi-dau-tien-1906/slides/06.png"], "cap": {"instagram": "Thông cáo báo chí đầu tiên trên thế giới ra đời từ… một vụ tai nạn tàu hoả. 🚆\n\n28/10/1906, Atlantic City (Mỹ).\nCác hãng đường sắt khi đó thường im lặng và đuổi phóng viên đi.\n\nIvy Lee lại soạn tuyên bố chính thức và gửi cho báo chí.\nThe New York Times đăng nguyên văn vào ngày 30/10/1906.\n\nBài học vẫn đúng: lên tiếng trước, dùng sự thật, giúp nhà báo làm việc dễ hơn.\n\nLưu bài này và gửi cho người phụ trách PR của bạn. Link ở bio.\n\n#VRITIMES #lichsuPR #FunFact #thongcaobaochi #PR #doanhnghiepnhovavua\n\nNguồn:\n• Billy Penn (2023); Museum of Public Relations\n", "facebook": "Một sự thật thú vị cho dân marketing và PR: thông cáo báo chí đầu tiên xuất hiện năm 1906, sau một vụ tai nạn tàu hoả. Câu chuyện có trong carousel này 👇\n\n28/10/1906, Atlantic City (Mỹ).\nCác hãng đường sắt khi đó thường im lặng và đuổi phóng viên đi.\n\nIvy Lee lại soạn tuyên bố chính thức và gửi cho báo chí.\nThe New York Times đăng nguyên văn vào ngày 30/10/1906.\n\nBài học vẫn đúng: lên tiếng trước, dùng sự thật, giúp nhà báo làm việc dễ hơn.\n\nLưu lại và chia sẻ cho đội ngũ của bạn 👇\nXem thêm: https://www.vritimes.com/vn?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_vn_202611&utm_content=vn_20261118_fun\n\n#VRITIMES #lichsuPR #FunFact\n\nNguồn:\n• Billy Penn (2023); Museum of Public Relations — https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/\n", "linkedin": "Bản thông cáo thường được gọi là đầu tiên trong lịch sử không công bố sản phẩm mới. Nó ra đời từ một cuộc khủng hoảng.\nVà bài học vẫn áp dụng được cho doanh nghiệp hôm nay.\n\nTháng 10/1906, một đoàn tàu của công ty con thuộc Pennsylvania Railroad lao khỏi cầu ở Atlantic City. Thông lệ của ngành lúc đó là hạn chế tiếp cận và không bình luận.\nIvy Lee làm điều ngược lại. Ông soạn tuyên bố chính thức, chia sẻ với phóng viên và cho họ tới hiện trường. The New York Times đăng nguyên văn tuyên bố vào ngày 30/10/1906.\nBa nguyên tắc từ sự kiện đó vẫn hiệu quả đến nay:\n\n1. Ai lên tiếng trước bằng sự thật, người đó định hình câu chuyện.\n2. Một tuyên bố có thể trích dẫn nguyên văn được dùng nhiều hơn một lời khẳng định.\n3. Sự thuận tiện cho nhà báo là một phần chiến lược, không phải phần thưởng thêm.\n\nTheo bạn, thương hiệu hay vi phạm nguyên tắc nào nhất khi gặp khủng hoảng?\n\nTìm hiểu VRITIMES: https://www.vritimes.com/vn?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_vn_202611&utm_content=vn_20261118_fun\n\n#VRITIMES #lichsuPR #FunFact #thongcaobaochi #PR\n\nNguồn:\n• Billy Penn (2023); Museum of Public Relations — https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/\n"}, "sources": [{"name": "Billy Penn / Museum of Public Relations", "title": "Ivy Lee, the 1906 Atlantic City train wreck and the first press release", "year": 2023, "url": "https://billypenn.com/2023/11/05/ivy-lee-jersey-shore-train-crash-press-release/"}], "pdf": "VN/VN_2026-11-18_Wed_FUN_carousel_thong-cao-bao-chi-dau-tien-1906/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "vn_20261120_viral", "date": "2026-11-20", "day": "Fri", "pillar": "VIRAL", "format": "reel", "title": "POV: bạn gửi thông cáo báo chí bằng file PDF đính kèm", "hook": "POV: bạn gửi thông cáo báo chí bằng file PDF đính kèm 📎😶", "cta": "Gửi cho team vẫn còn dùng PDF", "times": {"linkedin": "08:30 (GMT+7)", "instagram_facebook": "20:00 (GMT+7)"}, "dir": "VN/VN_2026-11-20_Fri_VIRAL_reels_pov-gui-thong-cao-file-pdf", "imgs": ["VN/VN_2026-11-20_Fri_VIRAL_reels_pov-gui-thong-cao-file-pdf/cover.png"], "cap": {"instagram": "POV: bạn gửi thông cáo báo chí bằng file PDF đính kèm 📎😶\n\nTải về → mở ra → copy. Mỗi bước thừa là một cơ hội bị mất.\n69% nhà báo thích pitch dưới 200 từ (Muck Rack, 2025).\n\nThay vào đó:\n✓ Dán nội dung thông cáo vào thân email\n✓ Tiêu đề thông cáo = tiêu đề email\n✓ Ảnh và tài liệu gửi qua link\n\nLưu bài này và gửi cho người phụ trách PR của bạn. Link ở bio.\n\n#VRITIMES #doiPR #thongcaobaochi #thongcaobaochi #PR #doanhnghiepnhovavua\n\nNguồn:\n• Muck Rack, State of Journalism 2025\n", "facebook": "Ai còn gửi thông cáo báo chí bằng file PDF đính kèm không? 😅 Xem hết video nhé, có cách nhà báo thích hơn nhiều.\n\nTải về → mở ra → copy. Mỗi bước thừa là một cơ hội bị mất.\n69% nhà báo thích pitch dưới 200 từ (Muck Rack, 2025).\n\nThay vào đó:\n✓ Dán nội dung thông cáo vào thân email\n✓ Tiêu đề thông cáo = tiêu đề email\n✓ Ảnh và tài liệu gửi qua link\n\nLưu lại và chia sẻ cho đội ngũ của bạn 👇\nXem thêm: https://www.vritimes.com/vn?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_vn_202611&utm_content=vn_20261120_viral\n\n#VRITIMES #doiPR #thongcaobaochi\n\nNguồn:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "Một thói quen nhỏ khiến thông cáo hay không được đọc: gửi dưới dạng file PDF đính kèm.\nNghe có vẻ không đáng kể. Tác động thì có.\n\nMuck Rack (State of Journalism 2025) cho thấy 69% nhà báo thích pitch dưới 200 từ. Họ muốn quyết định nhanh, không thêm bước nào.\nFile PDF đính kèm thêm tới ba bước: tải về, mở, sao chép. Cộng với tiêu đề email chung chung, khả năng được đọc giảm rõ rệt.\n\n1. Dán nội dung thông cáo trực tiếp vào thân email.\n2. Dùng tiêu đề thông cáo làm tiêu đề email.\n3. Chia sẻ ảnh và tài liệu kèm theo qua link.\n4. Nếu dùng nền tảng phân phối, hãy đảm bảo thông cáo nằm trên một trang web có thể truy cập và trích dẫn.\n\nDoanh nghiệp của bạn có còn yêu cầu gửi PDF vì \"trông trang trọng hơn\" không?\n\nTìm hiểu VRITIMES: https://www.vritimes.com/vn?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_vn_202611&utm_content=vn_20261120_viral\n\n#VRITIMES #doiPR #thongcaobaochi #thongcaobaochi #PR\n\nNguồn:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": null, "mp4": "VN/VN_2026-11-20_Fri_VIRAL_reels_pov-gui-thong-cao-file-pdf/reel_draft.mp4", "script": "VN/VN_2026-11-20_Fri_VIRAL_reels_pov-gui-thong-cao-file-pdf/reel_script.md", "price": null}, {"id": "vn_20261123_edu", "date": "2026-11-23", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "Email pitch dưới 200 từ được nhà báo phản hồi", "hook": "Email pitch của bạn có quá dài không? 69% nhà báo thích dưới 200 từ. ✂️", "cta": "Lưu mẫu email lại", "times": {"linkedin": "08:30 (GMT+7)", "instagram_facebook": "11:30 (GMT+7)"}, "dir": "VN/VN_2026-11-23_Mon_EDU_carousel_email-pitch-duoi-200-tu", "imgs": ["VN/VN_2026-11-23_Mon_EDU_carousel_email-pitch-duoi-200-tu/slides/01.png", "VN/VN_2026-11-23_Mon_EDU_carousel_email-pitch-duoi-200-tu/slides/02.png", "VN/VN_2026-11-23_Mon_EDU_carousel_email-pitch-duoi-200-tu/slides/03.png", "VN/VN_2026-11-23_Mon_EDU_carousel_email-pitch-duoi-200-tu/slides/04.png", "VN/VN_2026-11-23_Mon_EDU_carousel_email-pitch-duoi-200-tu/slides/05.png", "VN/VN_2026-11-23_Mon_EDU_carousel_email-pitch-duoi-200-tu/slides/06.png", "VN/VN_2026-11-23_Mon_EDU_carousel_email-pitch-duoi-200-tu/slides/07.png"], "cap": {"instagram": "Email pitch của bạn có quá dài không? 69% nhà báo thích dưới 200 từ. ✂️\n\nCấu trúc 4 dòng:\n1️⃣ Vì sao phù hợp với chuyên mục của họ\n2️⃣ Tin chính trong một câu + con số\n3️⃣ Những gì bạn cung cấp được: số liệu, người phát ngôn, ảnh\n4️⃣ Link thông cáo + liên hệ\n\nFollow-up? Một lần, sau 3–7 ngày.\nMẫu đầy đủ ở slide 6.\n\nLưu bài này và gửi cho người phụ trách PR của bạn. Link ở bio.\n\n#VRITIMES #quanhebaochi #PRtips #thongcaobaochi #PR #doanhnghiepnhovavua\n\nNguồn:\n• Muck Rack, State of Journalism 2025\n", "facebook": "Mẫu email pitch dưới 200 từ, chỉ 4 dòng, đội ngũ của bạn dùng được ngay 👇\n\nCấu trúc 4 dòng:\n1️⃣ Vì sao phù hợp với chuyên mục của họ\n2️⃣ Tin chính trong một câu + con số\n3️⃣ Những gì bạn cung cấp được: số liệu, người phát ngôn, ảnh\n4️⃣ Link thông cáo + liên hệ\n\nFollow-up? Một lần, sau 3–7 ngày.\nMẫu đầy đủ ở slide 6.\n\nLưu lại và chia sẻ cho đội ngũ của bạn 👇\nXem thêm: https://www.vritimes.com/vn?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_vn_202611&utm_content=vn_20261123_edu\n\n#VRITIMES #quanhebaochi #PRtips\n\nNguồn:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "Những email pitch được nhà báo trả lời thường ngắn hơn bạn nghĩ.\nTheo Muck Rack, 69% nhà báo thích pitch dưới 200 từ.\n\nLỗi phổ biến nhất là dán toàn bộ thông cáo vào pitch. Pitch chỉ là lời mời đọc, không phải bản thông cáo.\nCùng nghiên cứu State of Journalism 2025 của Muck Rack cũng trả lời câu hỏi về follow-up: 50% nhà báo cho rằng một lần là lý tưởng, và 51% muốn cách 3–7 ngày.\nCấu trúc bốn dòng đội ngũ của bạn có thể dùng ngay:\n\n1. Mức độ liên quan: vì sao chủ đề phù hợp với chuyên mục hoặc độc giả.\n2. Tin chính trong một câu, kèm con số.\n3. Những gì bạn có sẵn: số liệu, người phát ngôn hoặc ảnh.\n4. Link thông cáo đầy đủ và đầu mối liên hệ luôn phản hồi.\n\nMẫu đầy đủ ở slide 6. Pitch của đội bạn hiện dài khoảng bao nhiêu từ?\n\nTìm hiểu VRITIMES: https://www.vritimes.com/vn?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_vn_202611&utm_content=vn_20261123_edu\n\n#VRITIMES #quanhebaochi #PRtips #thongcaobaochi #PR\n\nNguồn:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": "VN/VN_2026-11-23_Mon_EDU_carousel_email-pitch-duoi-200-tu/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "vn_20261125_fun", "date": "2026-11-25", "day": "Wed", "pillar": "FUN", "format": "single", "title": "Năm 2024 có 233,4 nghìn doanh nghiệp thành lập mới và quay lại hoạt động", "hook": "Năm 2024, Việt Nam có 233,4 nghìn doanh nghiệp thành lập mới và quay lại hoạt động. Bao nhiêu trong số đó từng lên báo? 🤔", "cta": "Tag một chủ doanh nghiệp có câu chuyện đáng lên báo", "times": {"linkedin": "08:30 (GMT+7)", "instagram_facebook": "20:00 (GMT+7)"}, "dir": "VN/VN_2026-11-25_Wed_FUN_single_233-nghin-doanh-nghiep-moi-2024", "imgs": ["VN/VN_2026-11-25_Wed_FUN_single_233-nghin-doanh-nghiep-moi-2024/image.png"], "cap": {"instagram": "Năm 2024, Việt Nam có 233,4 nghìn doanh nghiệp thành lập mới và quay lại hoạt động. Bao nhiêu trong số đó từng lên báo? 🤔\n\nTheo Tổng cục Thống kê:\n• 233,4 nghìn doanh nghiệp thành lập mới & quay lại hoạt động (+7,1%)\n• 76,2 nghìn doanh nghiệp quay lại hoạt động, cao nhất từ trước đến nay\n• Bình quân 13,1 nghìn doanh nghiệp mới mỗi tháng\n\nMở chi nhánh, đơn hàng xuất khẩu đầu tiên, tuyển 50 nhân sự: đều là tin tức.\nChỉ là hiếm khi được viết theo cách toà soạn dùng được.\n\nLưu bài này và gửi cho người phụ trách PR của bạn. Link ở bio.\n\n#VRITIMES #doanhnghiep #FunFact #thongcaobaochi #PR #doanhnghiepnhovavua\n\nNguồn:\n• Tổng cục Thống kê (2025)\n• VCCI / Bộ KH&ĐT\n", "facebook": "Sự thật thú vị: năm 2024 có 233,4 nghìn doanh nghiệp thành lập mới và quay lại hoạt động. Nếu doanh nghiệp của bạn là một trong số đó, câu chuyện của bạn xứng đáng được lên báo 💙\n\nTheo Tổng cục Thống kê:\n• 233,4 nghìn doanh nghiệp thành lập mới & quay lại hoạt động (+7,1%)\n• 76,2 nghìn doanh nghiệp quay lại hoạt động, cao nhất từ trước đến nay\n• Bình quân 13,1 nghìn doanh nghiệp mới mỗi tháng\n\nMở chi nhánh, đơn hàng xuất khẩu đầu tiên, tuyển 50 nhân sự: đều là tin tức.\nChỉ là hiếm khi được viết theo cách toà soạn dùng được.\n\nLưu lại và chia sẻ cho đội ngũ của bạn 👇\nXem thêm: https://www.vritimes.com/vn?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_vn_202611&utm_content=vn_20261125_fun\n\n#VRITIMES #doanhnghiep #FunFact\n\nNguồn:\n• Tổng cục Thống kê (2025) — https://vcci.com.vn/tin-tuc/nam-2024-so-doanh-nghiep-quay-tro-lai-hoat-dong-dat-muc-cao-nhat-tu-truoc-den-nay\n• VCCI / Bộ KH&ĐT — https://www.vcci.com.vn/tin-tuc/doanh-nghiep-nho-va-vua-can-co-che-thuc-chat-co-hoi-binh-dang\n", "linkedin": "Năm 2024, Việt Nam có 233,4 nghìn doanh nghiệp thành lập mới và quay lại hoạt động, trong đó 76,2 nghìn doanh nghiệp quay lại, mức cao nhất từ trước đến nay.\nPhần lớn trong số họ chưa từng xuất hiện trên báo.\n\nVới khoảng 97% doanh nghiệp là doanh nghiệp nhỏ và vừa (theo Bộ KH&ĐT, VCCI dẫn), cạnh tranh để được chú ý ngày càng gay gắt. Số liệu của Tổng cục Thống kê thường được đọc dưới góc độ kinh tế. Chúng tôi nhìn thấy một khoảng trống truyền thông.\nKhông phải vì thiếu giá trị tin tức, mà vì chưa được kể dưới dạng tin tức. Một chi nhánh mới, hợp đồng xuất khẩu đầu tiên hay đợt tuyển dụng lớn đều là tin địa phương tốt khi có số liệu rõ ràng và người phát ngôn có thể trích dẫn.\n\nNếu bạn là chủ doanh nghiệp: câu chuyện nào của năm nay công chúng nên được biết?\n\nTìm hiểu VRITIMES: https://www.vritimes.com/vn?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_vn_202611&utm_content=vn_20261125_fun\n\n#VRITIMES #doanhnghiep #FunFact #thongcaobaochi #PR\n\nNguồn:\n• Tổng cục Thống kê (2025) — https://vcci.com.vn/tin-tuc/nam-2024-so-doanh-nghiep-quay-tro- ": "PRICE_UNVERIFIED"}, {"id": "vn_20261130_edu", "date": "2026-11-30", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "Dùng thông cáo báo chí để làm SEO? Đọc chính sách của Google trước", "hook": "Gửi thông cáo báo chí để lấy backlink? Google có chính sách riêng về việc này. 🔗", "cta": "Lưu lại và gửi cho team SEO", "times": {"linkedin": "08:30 (GMT+7)", "instagram_facebook": "11:30 (GMT+7)"}, "dir": "VN/VN_2026-11-30_Mon_EDU_carousel_backlink-seo-thong-cao-bao-chi", "imgs": ["VN/VN_2026-11-30_Mon_EDU_carousel_backlink-seo-thong-cao-bao-chi/slides/01.png", "VN/VN_2026-11-30_Mon_EDU_carousel_backlink-seo-thong-cao-bao-chi/slides/02.png", "VN/VN_2026-11-30_Mon_EDU_carousel_backlink-seo-thong-cao-bao-chi/slides/03.png", "VN/VN_2026-11-30_Mon_EDU_carousel_backlink-seo-thong-cao-bao-chi/slides/04.png", "VN/VN_2026-11-30_Mon_EDU_carousel_backlink-seo-thong-cao-bao-chi/slides/05.png", "VN/VN_2026-11-30_Mon_EDU_carousel_backlink-seo-thong-cao-bao-chi/slides/06.png", "VN/VN_2026-11-30_Mon_EDU_carousel_backlink-seo-thong-cao-bao-chi/slides/07.png"], "cap": {"instagram": "Gửi thông cáo báo chí để lấy backlink? Google có chính sách riêng về việc này. 🔗\n\nGoogle xếp anchor text tối ưu hoá trong thông cáo phát tán sang website khác vào nhóm link spam.\n\nCách an toàn:\n✓ Anchor = tên thương hiệu / URL\n✓ 1–2 link tới trang liên quan\n✓ Tin tức khiến báo khác viết tiếp\n\nGiá trị thật: lượt truy cập, lượt nhắc thương hiệu và bài viết tự nhiên.\n\nLưu bài này và gửi cho người phụ trách PR của bạn. Link ở bio.\n\n#VRITIMES #SEO #DigitalPR #thongcaobaochi #PR #doanhnghiepnhovavua\n\nNguồn:\n• Google Search Central, Spam policies\n• Google Search Central, Qualify outbound links\n", "facebook": "Nhiều doanh nghiệp gửi thông cáo chỉ để lấy backlink. Trước khi làm tiếp, hãy xem Google nói gì 👇\n\nGoogle xếp anchor text tối ưu hoá trong thông cáo phát tán sang website khác vào nhóm link spam.\n\nCách an toàn:\n✓ Anchor = tên thương hiệu / URL\n✓ 1–2 link tới trang liên quan\n✓ Tin tức khiến báo khác viết tiếp\n\nGiá trị thật: lượt truy cập, lượt nhắc thương hiệu và bài viết tự nhiên.\n\nLưu lại và chia sẻ cho đội ngũ của bạn 👇\nXem thêm: https://www.vritimes.com/vn?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_vn_202611&utm_content=vn_20261130_edu\n\n#VRITIMES #SEO #DigitalPR\n\nNguồn:\n• Google Search Central, Spam policies — https://developers.google.com/search/docs/essentials/spam-policies\n• Google Search Central, Qualify outbound links — https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links\n", "linkedin": "\"Gửi thông cáo để lấy backlink\" là chiến thuật Google nêu đích danh trong chính sách spam.\nĐây là cách dùng thông cáo báo chí cho SEO mà không gặp rủi ro.\n\nTrong tài liệu Spam policies, Google Search Central liệt kê các liên kết có anchor text tối ưu hoá trong bài viết, guest post hoặc thông cáo báo chí phát tán sang website khác là ví dụ của link spam. Google cũng yêu cầu link trả phí hoặc đặt bài gắn rel=\"sponsored\" hoặc nofollow.\nVậy thông cáo vô dụng với SEO? Ngược lại, miễn là bạn đo đúng thứ:\n\n1. Lượt truy cập giới thiệu từ người đọc bấm vào.\n2. Lượt nhắc thương hiệu trên trang tin, giúp củng cố nhận diện.\n3. Bài viết tự nhiên từ nhà báo tìm thấy thông cáo và viết phiên bản của riêng họ. Đây là giá trị SEO lớn nhất.\n4. Thực hành an toàn: anchor là tên thương hiệu/URL, một link chính và tin tức thật sự đáng trích dẫn.\n\nĐội của bạn hiện đo tác động SEO của thông cáo như thế nào?\n\nTìm hiểu VRITIMES: https://www.vritimes.com/vn?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_vn_202611&utm_content=vn_20261130_edu\n\n#VRITIMES #SEO #DigitalPR #thongcaobaochi #PR\n\nNguồn:\n• Google Search Central, Spam policies — https://developers.google.com/search/docs/essentials/spam-policies\n• Google Search Central, Qualify outbound links — https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links\n"}, "sources": [{"name": "Google Search Central", "title": "Spam policies for Google web search (link spam)", "year": 2025, "url": "https://developers.google.com/search/docs/essentials/spam-policies"}, {"name": "Google Search Central", "title": "Qualify your outbound links to Google", "year": 2025, "url": "https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links"}], "pdf": "VN/VN_2026-11-30_Mon_EDU_carousel_backlink-seo-thong-cao-bao-chi/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "vn_20261202_viral", "date": "2026-12-02", "day": "Wed", "pillar": "VIRAL", "format": "reel", "title": "Thông cáo báo chí: kỳ vọng vs thực tế", "hook": "Thông cáo báo chí: kỳ vọng vs thực tế 😅", "cta": "Bình luận: bạn từng gặp cảnh nào?", "times": {"linkedin": "08:30 (GMT+7)", "instagram_facebook": "20:00 (GMT+7)"}, "dir": "VN/VN_2026-12-02_Wed_VIRAL_reels_thong-cao-bao-chi-ky-vong-va-thuc-te", "imgs": ["VN/VN_2026-12-02_Wed_VIRAL_reels_thong-cao-bao-chi-ky-vong-va-thuc-te/cover.png"], "cap": {"instagram": "Thông cáo báo chí: kỳ vọng vs thực tế 😅\n\nKỳ vọng: gửi 1 lần là lên báo khắp nơi\nThực tế: không có tin thì không ai đăng\n\nKỳ vọng: viết dài cho chuyên nghiệp\nThực tế: 69% nhà báo thích pitch dưới 200 từ\n\nKỳ vọng: nhắn nhà báo mỗi ngày\nThực tế: 50% thấy follow-up một lần là đủ\n\nBạn từng gặp cảnh nào? 👇\n\nTag đồng nghiệp từng \"kỳ vọng\" như vậy 😆 Link ở bio.\n\n#VRITIMES #doiPR #marketing #thongcaobaochi #PR #doanhnghiepnhovavua\n\nNguồn:\n• Muck Rack, State of Journalism 2025\n", "facebook": "Kỳ vọng vs thực tế khi gửi thông cáo báo chí 😄 Bạn đã từng ở phía \"kỳ vọng\" chưa?\n\nKỳ vọng: gửi 1 lần là lên báo khắp nơi\nThực tế: không có tin thì không ai đăng\n\nKỳ vọng: viết dài cho chuyên nghiệp\nThực tế: 69% nhà báo thích pitch dưới 200 từ\n\nKỳ vọng: nhắn nhà báo mỗi ngày\nThực tế: 50% thấy follow-up một lần là đủ\n\nBạn từng gặp cảnh nào? 👇\n\nLưu lại và chia sẻ cho đội ngũ của bạn 👇\nXem thêm: https://www.vritimes.com/vn?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_vn_202612&utm_content=vn_20261202_viral\n\n#VRITIMES #doiPR #marketing\n\nNguồn:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "Ba kỳ vọng phổ biến về thông cáo báo chí, và thực tế theo số liệu.\n\nNhiều kỳ vọng về PR đến từ thói quen, không phải dữ liệu. Khi kỳ vọng không khớp thực tế, đội truyền thông thường bị đánh giá là \"làm chưa tới\", trong khi vấn đề nằm ở cách đặt mục tiêu ngay từ đầu.\nMuck Rack State of Journalism 2025 cho một bức tranh rõ ràng hơn:\n\n1. Gửi một lần không đảm bảo lên báo khắp nơi. Giá trị tin tức mới là yếu tố quyết định.\n2. Dài không đồng nghĩa với chuyên nghiệp: 69% nhà báo thích pitch dưới 200 từ.\n3. Nhắn mỗi ngày không tăng cơ hội: 50% nhà báo thấy một lần follow-up là lý tưởng, 51% muốn cách 3–7 ngày.\n\nKỳ vọng nào bạn thường phải \"điều chỉnh\" với sếp hoặc khách hàng?\n\nTìm hiểu VRITIMES: https://www.vritimes.com/vn?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_vn_202612&utm_content=vn_20261202_viral\n\n#VRITIMES #doiPR #marketing #thongcaobaochi #PR\n\nNguồn:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": null, "mp4": "VN/VN_2026-12-02_Wed_VIRAL_reels_thong-cao-bao-chi-ky-vong-va-thuc-te/reel_draft.mp4", "script": "VN/VN_2026-12-02_Wed_VIRAL_reels_thong-cao-bao-chi-ky-vong-va-thuc-te/reel_script.md", "price": null}, {"id": "vn_20261204_edu", "date": "2026-12-04", "day": "Fri", "pillar": "EDU", "format": "carousel", "title": "5 công thức tiêu đề thông cáo báo chí kèm ví dụ", "hook": "Tiêu đề quyết định thông cáo của bạn có được mở hay không. Đây là 5 công thức kèm ví dụ ✍️", "cta": "Lưu lại cho lần viết tiếp theo", "times": {"linkedin": "08:30 (GMT+7)", "instagram_facebook": "11:30 (GMT+7)"}, "dir": "VN/VN_2026-12-04_Fri_EDU_carousel_cong-thuc-tieu-de-thong-cao", "imgs": ["VN/VN_2026-12-04_Fri_EDU_carousel_cong-thuc-tieu-de-thong-cao/slides/01.png", "VN/VN_2026-12-04_Fri_EDU_carousel_cong-thuc-tieu-de-thong-cao/slides/02.png", "VN/VN_2026-12-04_Fri_EDU_carousel_cong-thuc-tieu-de-thong-cao/slides/03.png", "VN/VN_2026-12-04_Fri_EDU_carousel_cong-thuc-tieu-de-thong-cao/slides/04.png", "VN/VN_2026-12-04_Fri_EDU_carousel_cong-thuc-tieu-de-thong-cao/slides/05.png", "VN/VN_2026-12-04_Fri_EDU_carousel_cong-thuc-tieu-de-thong-cao/slides/06.png", "VN/VN_2026-12-04_Fri_EDU_carousel_cong-thuc-tieu-de-thong-cao/slides/07.png", "VN/VN_2026-12-04_Fri_EDU_carousel_cong-thuc-tieu-de-thong-cao/slides/08.png"], "cap": {"instagram": "Tiêu đề quyết định thông cáo của bạn có được mở hay không. Đây là 5 công thức kèm ví dụ ✍️\n\n01 Chủ thể + hành động + con số\n02 Số liệu mới làm tiêu đề\n03 Lần đầu tiên (có kiểm chứng)\n04 Hợp tác: ai + ai + để làm gì\n05 Sự kiện: tên + thời gian + giá trị\n\nTránh: \"đột phá\", \"số 1\" không bằng chứng, tiêu đề không động từ, viết hoa toàn bộ.\n\nLưu bài này và gửi cho người phụ trách PR của bạn. Link ở bio.\n\n#VRITIMES #vietthongcao #PRtips #thongcaobaochi #PR #doanhnghiepnhovavua\n\nNguồn:\n• Muck Rack, State of Journalism 2025\n", "facebook": "5 công thức viết tiêu đề thông cáo báo chí, kèm ví dụ dễ áp dụng. Lưu lại nhé 👇\n\n01 Chủ thể + hành động + con số\n02 Số liệu mới làm tiêu đề\n03 Lần đầu tiên (có kiểm chứng)\n04 Hợp tác: ai + ai + để làm gì\n05 Sự kiện: tên + thời gian + giá trị\n\nTránh: \"đột phá\", \"số 1\" không bằng chứng, tiêu đề không động từ, viết hoa toàn bộ.\n\nLưu lại và chia sẻ cho đội ngũ của bạn 👇\nXem thêm: https://www.vritimes.com/vn?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_vn_202612&utm_content=vn_20261204_edu\n\n#VRITIMES #vietthongcao #PRtips\n\nNguồn:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n", "linkedin": "Phần lớn thông cáo bị bỏ qua ngay từ tiêu đề.\nNăm công thức chúng tôi khuyên dùng, kèm ví dụ minh hoạ.\n\nNhà báo nhận rất nhiều pitch mỗi ngày, và Muck Rack (2025) cho thấy 69% thích pitch dưới 200 từ. Trong bối cảnh đó, tiêu đề phải nói được tin chính trong một lần đọc.\nNăm công thức (ví dụ chỉ mang tính minh hoạ):\n\n1. Chủ thể + hành động + con số: tin doanh nghiệp rõ ràng nhất.\n2. Số liệu mới làm tiêu đề: khi bạn có dữ liệu riêng.\n3. \"Lần đầu tiên\": chỉ khi chứng minh được.\n4. Hợp tác: nói rõ ai với ai và kết quả cho người dùng.\n5. Sự kiện: tên, thời gian và giá trị cho người tham dự.\n\nCông thức nào đội của bạn dùng nhiều nhất?\n\nTìm hiểu VRITIMES: https://www.vritimes.com/vn?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_vn_202612&utm_content=vn_20261204_edu\n\n#VRITIMES #vietthongcao #PRtips #thongcaobaochi #PR\n\nNguồn:\n• Muck Rack, State of Journalism 2025 — https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs\n"}, "sources": [{"name": "Muck Rack", "title": "State of Journalism 2025 (webinar FAQs)", "year": 2025, "url": "https://muckrack.com/blog/2025/07/09/state-of-journalism-2025-webinar-faqs"}], "pdf": "VN/VN_2026-12-04_Fri_EDU_carousel_cong-thuc-tieu-de-thong-cao/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "vn_20261207_edu", "date": "2026-12-07", "day": "Mon", "pillar": "EDU", "format": "carousel", "title": "Lịch PR 2027 cho thương hiệu Việt", "hook": "Lịch PR 2027 có thể bắt đầu từ hôm nay. 🗓️", "cta": "Lưu lại cho kế hoạch 2027", "times": {"linkedin": "08:30 (GMT+7)", "instagram_facebook": "11:30 (GMT+7)"}, "dir": "VN/VN_2026-12-07_Mon_EDU_carousel_lich-pr-2027-viet-nam", "imgs": ["VN/VN_2026-12-07_Mon_EDU_carousel_lich-pr-2027-viet-nam/slides/01.png", "VN/VN_2026-12-07_Mon_EDU_carousel_lich-pr-2027-viet-nam/slides/02.png", "VN/VN_2026-12-07_Mon_EDU_carousel_lich-pr-2027-viet-nam/slides/03.png", "VN/VN_2026-12-07 hành lập mới (Tổng cục Thống kê). Cạnh tranh để được chú ý vào các dịp cao điểm ngày càng lớn, và sự chuẩn bị, chứ không phải số lượng, quyết định ai được đưa tin.\nKhung theo quý để tham khảo:\n\n1. Q1: Tết Nguyên Đán (ngày 2027 là dự kiến), tổng kết năm và 8/3.\n2. Q2: kỳ nghỉ 30/4 – 1/5 và 21/6 Ngày Báo chí Cách mạng Việt Nam.\n3. Q3: 2/9 với chương trình cộng đồng, cùng tin hợp tác và gọi vốn.\n4. Q4: 20/10, 20/11, Black Friday và 12.12. Gửi thông cáo trước ngày cao điểm.\n5. Mỗi dịp: T-14 nghiên cứu, T-7 thông cáo hoàn chỉnh, T-3 pitch, Ngày D đăng, T+3 tổng hợp.\n\nDịp nào quan trọng nhất với thương hiệu của bạn năm tới?\n\nTìm hiểu VRITIMES: https://www.vritimes.com/vn?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_vn_202612&utm_content=vn_20261207_edu\n\n#VRITIMES #lichPR #kehoach2027 #thongcaobaochi #PR\n\nNguồn:\n• VOH — https://voh.com.vn/ngay-nay-nam-ay/ngay-21-6-1925-to-bao-cach-mang-dau-tien-cua-nuoc-ta-ra-doi-368119.html\n• Tổng cục Thống kê (2025) — https://vcci.com.vn/tin-tuc/nam-2024-so-doanh-nghiep-quay-tro-lai-hoat-dong-dat-muc-cao-nhat-tu-truoc-den-nay\n"}, "sources": [{"name": "VOH", "title": "Ngày 21/6/1925: Tờ báo cách mạng đầu tiên của nước ta ra đời", "year": 2024, "url": "https://voh.com.vn/ngay-nay-nam-ay/ngay-21-6-1925-to-bao-cach-mang-dau-tien-cua-nuoc-ta-ra-doi-368119.html"}, {"name": "Tổng cục Thống kê (qua VCCI)", "title": "Năm 2024, số doanh nghiệp quay trở lại hoạt động đạt mức cao nhất từ trước đến nay", "year": 2025, "url": "https://vcci.com.vn/tin-tuc/nam-2024-so-doanh-nghiep-quay-tro-lai-hoat-dong-dat-muc-cao-nhat-tu-truoc-den-nay"}], "pdf": "VN/VN_2026-12-07_Mon_EDU_carousel_lich-pr-2027-viet-nam/linkedin_carousel.pdf", "mp4": null, "script": null, "price": null}, {"id": "vn_20261209_fun", "date": "2026-12-09", "day": "Wed", "pillar": "FUN", "format": "reel", "title": "Ngày 21/6/1925 và tờ báo cách mạng đầu tiên", "hook": "Vì sao ngày 21/6 là Ngày Báo chí Cách mạng Việt Nam? 📰", "cta": "Chia sẻ cho người làm truyền thông", "times": {"linkedin": "08:30 (GMT+7)", "instagram_facebook": "20:00 (GMT+7)"}, "dir": "VN/VN_2026-12-09_Wed_FUN_reels_bao-thanh-nien-21-6-1925", "imgs": ["VN/VN_2026-12-09_Wed_FUN_reels_bao-thanh-nien-21-6-1925/cover.png"], "cap": {"instagram": "Vì sao ngày 21/6 là Ngày Báo chí Cách mạng Việt Nam? 📰\n\n21/6/1925: báo Thanh Niên ra số đầu tiên tại Quảng Châu (Trung Quốc).\nTờ báo do lãnh tụ Nguyễn Ái Quốc sáng lập.\nNgày ra số đầu được chọn làm Ngày Báo chí Cách mạng Việt Nam.\n\nVới doanh nghiệp, cách tôn trọng báo chí tốt nhất: gửi tin thật, số liệu thật, đúng lúc.\n\nLưu bài này và gửi cho người phụ trách PR của bạn. Link ở bio.\n\n#VRITIMES #baochi #FunFact #thongcaobaochi #PR #doanhnghiepnhovavua\n\nNguồn:\n• VOH\n", "facebook": "Bạn có biết vì sao 21/6 là Ngày Báo chí Cách mạng Việt Nam không? Xem video nhé 👀\n\n21/6/1925: báo Thanh Niên ra số đầu tiên tại Quảng Châu (Trung Quốc).\nTờ báo do lãnh tụ Nguyễn Ái Quốc sáng lập.\nNgày ra số đầu được chọn làm Ngày Báo chí Cách mạng Việt Nam.\n\nVới doanh nghiệp, cách tôn trọng báo chí tốt nhất: gửi tin thật, số liệu thật, đúng lúc.\n\nLưu lại và chia sẻ cho đội ngũ của bạn 👇\nXem thêm: https://www.vritimes.com/vn?utm_source=facebook&utm_medium=organic_social&utm_campaign=sns_vn_202612&utm_content=vn_20261209_fun\n\n#VRITIMES #baochi #FunFact\n\nNguồn:\n• VOH — https://voh.com.vn/ngay-nay-nam-ay/ngay-21-6-1925-to-bao-cach-mang-dau-tien-cua-nuoc-ta-ra-doi-368119.html\n", "linkedin": "Ngày 21/6/1925, báo Thanh Niên do lãnh tụ Nguyễn Ái Quốc sáng lập ra số đầu tiên tại Quảng Châu.\nĐó là lý do 21/6 trở thành Ngày Báo chí Cách mạng Việt Nam.\n\nMột câu chuyện lịch sử, và cũng là bài học cho người làm truyền thông doanh nghiệp. Năm 2025 đánh dấu 100 năm báo chí cách mạng Việt Nam. Với các đội truyền thông doanh nghiệp, đây là lời nhắc về vai trò của báo chí: kiểm chứng, chọn lọc và đưa tin có giá trị cho công chúng.\nĐiều đó có ý nghĩa thực tế khi bạn gửi thông cáo:\n\n1. Chỉ gửi khi có tin thật sự, không gửi để \"cho có\".\n2. Số liệu phải kiểm chứng được và có nguồn.\n3. Tôn trọng thời gian của nhà báo: ngắn gọn, đúng chuyên mục, follow-up có chừng mực.\n\nBạn sẽ chuẩn bị gì cho dịp 21/6 năm tới?\n\nTìm hiểu VRITIMES: https://www.vritimes.com/vn?utm_source=linkedin&utm_medium=organic_social&utm_campaign=sns_vn_202612&utm_content=vn_20261209_fun\n\n#VRITIMES #baochi #FunFact #thongcaobaochi #PR\n\nNguồn:\n• VOH — https://voh.com.vn/ngay-nay-nam-ay/ngay-21-6-1925-to-bao-cach-mang-dau-tien-cua-nuoc-ta-ra-doi-368119.html\n"}, "sources": [{"name": "VOH", "title": "Ngày 21/6/1925: Tờ báo cách mạng đầu tiên của nước ta ra đời", "year": 2024, "url": "https://voh.com.vn/ngay-nay-nam-ay/ngay-21-6-1925-to-bao-cach-mang-dau-tien-cua-nuoc-ta-ra-doi-368119.html"}], "pdf": null, "mp4": "VN/VN_2026-12-09_Wed_FUN_reels_bao-thanh-nien-21-6-1925/reel_draft.mp4", "script": "VN/VN_2026-12-09_Wed_FUN_reels_bao-thanh-nien-21-6-1925/reel_script.md", "price": null}, {"id": "vn_20261211_promo", "date": "2026-12-11", "day": "Fri", "pillar": "PROMO", "format": "single", "title": "Công bố tin trước 12.12 và mùa Tết", "hook": "12.12 là ngày mai, Tết đang đến gần. Tin của bạn đã lên báo chưa? 🧧", "cta": "Xem giá mới nhất qua link", "times": {"linkedin": "08:30 (GMT+7)", "instagram_facebook": "11:30 (GMT+7)"}, "dir": "VN/VN_2026-12-11_Fri_PROMO_single_cong-bo-tin-truoc-tet", "imgs": ["VN/VN_2026-12-11_Fri_PROMO_single_cong-bo-tin-truoc-tet/image.png"], "cap": {"instagram": "12.12 là ngày mai, Tết đang đến gần. Tin của bạn đã lên báo chưa? 🧧\n\nĐi trước khi toà soạn bước vào mùa Tết:\n✓ Đăng tải trước ngày cao điểm\n✓ Backlink tới trang khuyến mãi/sản phẩm\n✓ Báo cáo phân phối để đánh giá\n\nGói và giá mới nhất: link ở bio.\n\nXem gói và giá mới nhất qua link ở bio.\n\n#VRITIMES #thongcaobaochi #doanhnghiep #thongcaobaochi #PR #doanhnghiepnhovavua\n\nNguồn:\n• vritimes.com/vn/service/pricing\n", "facebook": "Đừng để tin cuối năm của bạn lên báo khi mọi người đã nghỉ Tết 😅 Xem các gói VRITIMES tại đây
